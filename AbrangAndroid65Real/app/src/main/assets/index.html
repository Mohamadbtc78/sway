function fuzzyScore(hay,query){const qTokens=searchTokens(query);if(!qTokens.length)return 0;const fields=String(hay||'').split('|'),weights=[130,120,115,90,75,60,50,35];let score=0;for(let fi=0;fi<fields.length;fi++){const h=normalizeSearchText(digitsFa(fields[fi]));for(const q of qTokens){if(h===q)score+=weights[fi]||30;else if(h.startsWith(q))score+=(weights[fi]||30)*.82;else if(h.includes(q))score+=(weights[fi]||30)*.58;else{let qi=0;for(const ch of h){if(ch===q[qi])qi++;if(qi===q.length)break}if(qi===q.length)score+=(weights[fi]||30)*.25;}}}return Math.round(score)}
function productSearchText(p){return [p.name,p.barcode,p.code,p.brand,p.cat,p.shelf,p.unit,p.note].map(normalizeSearchText).join('|')}
function searchProducts(query,opts={}){const q=normalizeSearchText(digitsFa(query)),cat=opts.cat||'',brand=opts.brand||'',stock=opts.stock||'all',hasBarcode=opts.hasBarcode||'',min=opts.min==null?'':opts.min,max=opts.max==null?'':opts.max,sort=opts.sort||'relevance';let arr=data.products.filter(p=>{if(cat&&p.cat!==cat)return false;if(brand&&p.brand!==brand)return false;if(stock==='low'&&n(p.stock)>n(p.minStock))return false;if(stock==='out'&&n(p.stock)>0)return false;if(stock==='available'&&n(p.stock)<=0)return false;if(hasBarcode==='yes'&&!p.barcode)return false;if(hasBarcode==='no'&&p.barcode)return false;if(min!==''&&n(p.sell)<n(min))return false;if(max!==''&&n(p.sell)>n(max))return false;return true}).map(p=>({p,score:q?fuzzyScore(productSearchText(p),q):1}));if(q)arr=arr.filter(x=>x.score>0);if(sort==='name')arr.sort((a,b)=>String(a.p.name).localeCompare(String(b.p.name),'fa'));else if(sort==='stock')arr.sort((a,b)=>n(b.p.stock)-n(a.p.stock));else if(sort==='priceAsc')arr.sort((a,b)=>n(a.p.sell)-n(b.p.sell));else if(sort==='priceDesc')arr.sort((a,b)=>n(b.p.sell)-n(a.p.sell));else arr.sort((a,b)=>b.score-a.score||n(b.p.stock)-n(a.p.stock));return arr}
function suggestPOS(){const q=val('scan').trim(),box=document.getElementById('suggestList');if(!box)return;if(!q){box.innerHTML='';return}const arr=searchProducts(q,{sort:'relevance',cat:activePOSCat==='همه'?'':activePOSCat}).slice(0,12);box.innerHTML=arr.map(({p,score})=>`<div class="suggestItem" onclick="addDraft('${p.id}')"><div style="display:flex;justify-content:space-between"><b>${esc(p.name)}</b><span>${money(p.sell)}</span></div><div class="muted">${esc(p.code||'-')} · ${esc(p.barcode||'-')} · موجودی ${qty(p.stock)} · تطبیق ${score}</div></div>`).join('')||'<div class="suggestItem">یافت نشد</div>'}

function csvParse(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const ch=text[i];if(q){if(ch==='"'&&text[i+1]==='"'){cell+='"';i++;}else if(ch==='"')q=false;else cell+=ch}else{if(ch==='"')q=true;else if(ch===','){row.push(cell);cell=''}else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell=''}else if(ch==='\r'){}else cell+=ch}}row.push(cell);if(row.some(x=>String(x).trim()!==''))rows.push(row);return rows}
function csvClean(v){return normalizeSearchText(String(v??'').replace(/^\uFEFF/,''))}
function importTemplate(){const rows=[['نام','بارکد','کد','دسته','برند','قیمت خرید','قیمت فروش','موجودی','حداقل موجودی','قفسه','واحد'],['مداد HB آریا','1234567890123','P100','مداد','آریا','10000','18000','20','5','A1','عدد']];const csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');downloadJSON({csv},'abrang-import-template.json');const b=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='abrang-products-template.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importPage(){return `<div class="panel"><div class="toolbar"><div class="left"><b>ورود گروهی کالا و مدیریت داده</b><span class="badgeInfo">مناسب ورود ۱۰ تا چند هزار کالا</span></div><div class="right"><button class="btn sec" onclick="importTemplate()">دانلود فایل نمونه</button><label class="btn" for="csvfile">انتخاب CSV</label><input id="csvfile" class="hide" type="file" accept=".csv,text/csv" onchange="loadCSVFile(event)"></div></div><div class="pad"><div class="notice"><b>قالب پیشنهادی:</b> نام، بارکد، کد، دسته، برند، قیمت خرید، قیمت فروش، موجودی، حداقل موجودی، قفسه، واحد.<br>اگر کالا با بارکد یا کد موجود پیدا شود به‌روزرسانی می‌شود؛ در غیر این صورت کالا جدید ساخته می‌شود. قبل از اعمال، پیش‌نمایش می‌بینی.</div><div class="sectionbox"><h3>چسباندن داده CSV</h3><textarea id="csvText" class="textarea" style="min-height:180px" placeholder="سطر اول: نام,بارکد,کد,دسته,برند,قیمت خرید,قیمت فروش,موجودی,حداقل موجودی,قفسه,واحد"></textarea><div class="actions" style="margin-top:8px"><button class="btn blue" onclick="previewCSV()">پیش‌نمایش</button><button class="btn green" onclick="applyCSVImport()">اعمال ورود</button><button class="btn sec" onclick="document.getElementById('csvText').value=''">پاک کردن</button></div></div><div id="csvPreview"></div><div class="sectionbox"><h3>سلامت اطلاعات</h3><div id="dataHealth"></div><div class="actions"><button class="btn sec" onclick="runHealthCheck()">بررسی دوباره</button><button class="btn orange" onclick="repairDataSafe()">اصلاح موارد قابل ترمیم</button></div></div></div></div>`}
let pendingCSV=[];
function loadCSVFile(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{document.getElementById('csvText').value=r.result;previewCSV()};r.readAsText(f,'utf-8');e.target.value=''}
function headerMap(headers){const h=headers.map(csvClean);const aliases={'نام':['نام','نام کالا','کالا'],'بارکد':['بارکد','barcode'],'کد':['کد','کد کالا','code'],'دسته':['دسته','دسته بندی','دسته‌بندی','category'],'برند':['برند','brand'],'قیمت خرید':['قیمت خرید','خرید','buy','بهای خرید'],'قیمت فروش':['قیمت فروش','فروش','sell'],'موجودی':['موجودی','تعداد','stock'],'حداقل موجودی':['حداقل موجودی','حداقل','minstock'],'قفسه':['قفسه','shelf'],'واحد':['واحد','unit']};const map={};for(const [key,arr] of Object.entries(aliases)){const idx=h.findIndex(x=>arr.some(a=>x===csvClean(a)));if(idx>=0)map[key]=idx}return map}
function buildCSVObjects(){const text=val('csvText').trim();if(!text)throw new Error('داده‌ای برای ورود وجود ندارد');const rows=csvParse(text);if(rows.length<2)throw new Error('حداقل یک سطر کالا لازم است');const map=headerMap(rows[0]);if(map['نام']==null)throw new Error('ستون «نام» پیدا نشد');return rows.slice(1).map((r,i)=>({line:i+2,name:String(r[map['نام']]||'').trim(),barcode:String(r[map['بارکد']]||'').trim(),code:String(r[map['کد']]||'').trim(),cat:String(r[map['دسته']]||'لوازم تحریر').trim()||'لوازم تحریر',brand:String(r[map['برند']]||'').trim(),buy:n(r[map['قیمت خرید']]),sell:n(r[map['قیمت فروش']]),stock:n(r[map['موجودی']]),minStock:n(r[map['حداقل موجودی']])||3,shelf:String(r[map['قفسه']]||'').trim(),unit:String(r[map['واحد']]||'عدد').trim()||'عدد'})).filter(x=>x.name)}
function previewCSV(){try{pendingCSV=buildCSVObjects();const dup=pendingCSV.filter((x,i)=>pendingCSV.some((y,j)=>i!==j&&((x.barcode&&y.barcode&&x.barcode===y.barcode)||(x.code&&y.code&&x.code===y.code)))).length;document.getElementById('csvPreview').innerHTML=`<div class="sectionbox"><h3>پیش‌نمایش <span class="badgeInfo">${qty(pendingCSV.length)} سطر</span></h3><div class="miniGrid"><div class="mini">کالای جدید<b>${qty(pendingCSV.filter(x=>!findExistingImport(x)).length)}</b></div><div class="mini">به‌روزرسانی<b>${qty(pendingCSV.filter(x=>!!findExistingImport(x)).length)}</b></div><div class="mini">مقادیر تکراری داخل فایل<b>${qty(dup)}</b></div><div class="mini">موجودی اولیه کل<b>${qty(pendingCSV.reduce((a,x)=>a+x.stock,0))}</b></div></div><div class="tablewrap" style="margin-top:10px"><table><tr><th>سطر</th><th>نام</th><th>بارکد</th><th>قیمت خرید</th><th>قیمت فروش</th><th>موجودی</th><th>عملیات</th></tr>${pendingCSV.slice(0,100).map((x,i)=>`<tr><td>${x.line}</td><td><b>${esc(x.name)}</b></td><td>${esc(x.barcode||'-')}</td><td>${money(x.buy)}</td><td>${money(x.sell)}</td><td>${qty(x.stock)}</td><td><button class="btn sm sec" onclick="removePendingCSV(${i})">حذف</button></td></tr>`).join('')}</table></div>${pendingCSV.length>100?'<div class="muted">فقط ۱۰۰ سطر اول برای پیش‌نمایش نمایش داده شده است.</div>':''}</div>`}catch(e){pendingCSV=[];document.getElementById('csvPreview').innerHTML='<div class="hint danger">خطا: '+esc(e.message)+'</div>'}}
function removePendingCSV(i){pendingCSV.splice(i,1);previewPendingOnly()}
function previewPendingOnly(){document.getElementById('csvPreview').innerHTML=`<div class="sectionbox"><h3>پیش‌نمایش <span class="badgeInfo">${qty(pendingCSV.length)} سطر باقی‌مانده</span></h3><div class="tablewrap"><table><tr><th>نام</th><th>بارکد</th><th>خرید</th><th>فروش</th><th>موجودی</th></tr>${pendingCSV.slice(0,100).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.barcode||'-')}</td><td>${money(x.buy)}</td><td>${money(x.sell)}</td><td>${qty(x.stock)}</td></tr>`).join('')}</table></div></div>`}
function findExistingImport(x){return data.products.find(p=>(x.barcode&&p.barcode&&digitsFa(p.barcode)===digitsFa(x.barcode))||(x.code&&p.code&&normalizeSearchText(p.code)===normalizeSearchText(x.code))||(!x.barcode&&!x.code&&normalizeSearchText(p.name)===normalizeSearchText(x.name)))}
function applyCSVImport(){if(!pendingCSV.length){try{pendingCSV=buildCSVObjects()}catch(e){return alert(e.message)}}const rows=pendingCSV.slice();let created=0,updated=0;rows.forEach(x=>{let p=findExistingImport(x);if(!p){p={id:uid(),name:x.name,code:'',barcode:'',cat:'لوازم تحریر',brand:'',unit:'عدد',buy:0,avgBuy:0,sell:0,stock:0,minStock:3,shelf:'',note:'',reorderDays:14};data.products.push(p);created++}else updated++;Object.assign(p,{name:x.name,code:x.code||p.code||nextProductCode(),barcode:x.barcode||p.barcode||'',cat:x.cat||p.cat||'لوازم تحریر',brand:x.brand||p.brand||'',unit:x.unit||p.unit||'عدد',buy:x.buy||p.buy||p.avgBuy||0,avgBuy:x.buy||p.avgBuy||p.buy||0,sell:x.sell||p.sell||0,stock:x.stock, minStock:x.minStock, shelf:x.shelf||p.shelf||''});data.moves.push({id:uid(),isoDate:todayISO(),date:faDate(),type:'ورود گروهی کالا',productId:p.id,qty:x.stock,ref:'CSV'})});audit('ورود گروهی کالا',created+' جدید / '+updated+' به‌روزرسانی');pendingCSV=[];save();runHealthCheck();alert('ورود گروهی با موفقیت انجام شد')}
function healthReport(){const issues=[];const seenB=new Map(),seenC=new Map();data.products.forEach(p=>{if(!p.name)issues.push('کالایی بدون نام');if(n(p.stock)<0)issues.push('موجودی منفی: '+p.name);if(p.barcode){const k=digitsFa(p.barcode);if(seenB.has(k))issues.push('بارکد تکراری: '+k);else seenB.set(k,p.id)}if(p.code){const k=normalizeSearchText(p.code);if(seenC.has(k))issues.push('کد کالا تکراری: '+k);else seenC.set(k,p.id)}if(n(p.sell)<0||n(p.avgBuy)<0)issues.push('قیمت منفی: '+p.name)});data.sales.forEach(s=>{if(!s.no||!s.id)issues.push('فاکتور ناقص')});return [...new Set(issues)].slice(0,80)}
function runHealthCheck(){const el=document.getElementById('dataHealth');if(!el)return;const issues=healthReport();el.innerHTML=issues.length?`<div class="hint danger"><b>${qty(issues.length)} مورد نیازمند بررسی</b><ul style="margin:8px 0 0 18px">${issues.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:'<div class="hint ok"><b>اطلاعات در بررسی اولیه سالم است.</b><br>کالای تکراری با بارکد/کد، موجودی منفی و چند خطای رایج بررسی شد.</div>'}
function repairDataSafe(){let count=0;data.products.forEach(p=>{if(n(p.stock)<0){p.stock=0;count++}if(!p.cat)p.cat='لوازم تحریر';if(!p.unit)p.unit='عدد';if(n(p.avgBuy)<0){p.avgBuy=0;count++}if(n(p.sell)<0){p.sell=0;count++}if(n(p.minStock)<0){p.minStock=0;count++}});audit('ترمیم امن اطلاعات',String(count));save();runHealthCheck();alert('اصلاح امن انجام شد؛ موارد خطرناک بدون حذف سوابق اصلاح شدند')}




// ===== ABRANG v13 professional operations =====
function proNum(v){return Number(String(v??'').replace(/[٬,]/g,''))||0}
function digitsFa(v){return String(v??'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))}
function csvCell(v){const x=String(v??'');return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x}
function downloadText(filename,text,type='text/csv;charset=utf-8'){const b=new Blob(['\ufeff',text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1200)}
function exportProductsExcel(){const heads=['نام کالا','بارکد','کد کالا','دسته','برند','قیمت خرید','میانگین خرید','قیمت فروش','موجودی','حداقل موجودی','روزهای پوشش','قفسه','واحد'];const rows=data.products.map(p=>[p.name,p.barcode,p.code,p.cat,p.brand,p.buy,p.avgBuy,p.sell,p.stock,p.minStock,p.reorderDays,p.shelf,p.unit]);downloadText('آبرنگ_کالاها_'+todayISO()+'.csv',[heads,...rows].map(r=>r.map(csvCell).join(',')).join('\n'));audit('خروجی کالاها',data.products.length+' کالا')}
function exportSalesCSV(){const heads=['شماره فاکتور','تاریخ','مشتری','مبلغ','پرداخت','مانده','سود','وضعیت'];const rows=data.sales.map(s=>[s.no,s.date,s.partyName||'متفرقه',s.total,s.paymentType||'',s.remaining,s.profit,s.status]);downloadText('آبرنگ_فروش_'+todayISO()+'.csv',[heads,...rows].map(r=>r.map(csvCell).join(',')).join('\n'));audit('خروجی فروش',data.sales.length+' فاکتور')}
function exportAllCSV(){exportProductsExcel();setTimeout(exportSalesCSV,250)}
function bulkPriceUpdate(){
 const cats=[...new Set(data.products.map(p=>p.cat).filter(Boolean))].sort();
 modal('افزایش/کاهش گروهی قیمت فروش',`<div class="notice">این ابزار قیمت فروش را بر اساس درصد تغییر می‌دهد. قبل از اعمال، یک پشتیبان بگیر. قیمت خرید و سوابق فروش تغییر نمی‌کنند.</div><div class="formgrid" style="margin-top:10px"><div class="field"><label>دسته</label><select id="bp2Cat" class="select"><option value="">همه کالاها</option>${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>درصد تغییر</label><input id="bp2Val" class="input" type="number" step="0.1" placeholder="مثلاً 10 یا -5"></div><div class="field"><label>روش گرد کردن</label><select id="bp2Round" class="select"><option value="1">بدون گرد کردن</option><option value="100">صدتایی</option><option value="500">۵۰۰ تایی</option><option value="1000">هزارتایی</option></select></div></div><div id="bp2Preview" class="sectionbox" style="margin-top:10px">درصد و دسته را وارد کن تا پیش‌نمایش محاسبه شود.</div><div class="actions"><button class="btn blue" onclick="previewBulkPrice()">پیش‌نمایش</button><button class="btn green" onclick="applyBulkPrice()">اعمال تغییر</button><button class="btn sec" onclick="closeModal()">انصراف</button></div>`)
}
function previewBulkPrice(){const cat=val('bp2Cat'),pct=proNum(val('bp2Val')),round=proNum(val('bp2Round'))||1;const arr=data.products.filter(p=>!cat||p.cat===cat);const sample=arr.slice(0,12).map(p=>{const next=round===1?Math.round(p.sell*(1+pct/100)):Math.round(p.sell*(1+pct/100)/round)*round;return `<tr><td>${esc(p.name)}</td><td>${money(p.sell)}</td><td>${money(next)}</td></tr>`}).join('');document.getElementById('bp2Preview').innerHTML=`<div class="miniGrid"><div class="mini">تعداد<b>${qty(arr.length)}</b></div><div class="mini">درصد تغییر<b>${pct}%</b></div></div><div class="tablewrap" style="margin-top:8px"><table><tr><th>کالا</th><th>فعلی</th><th>جدید</th></tr>${sample||'<tr><td colspan="3">کالایی پیدا نشد.</td></tr>'}</table></div>`}
function applyBulkPrice(){const cat=val('bp2Cat'),pct=proNum(val('bp2Val')),round=proNum(val('bp2Round'))||1;if(!pct)return alert('درصد تغییر را وارد کن');const arr=data.products.filter(p=>!cat||p.cat===cat);if(!arr.length)return alert('کالایی پیدا نشد');if(!confirm(`قیمت ${arr.length} کالا ${pct>0?'افزایش':'کاهش'} داده شود؟`))return;arr.forEach(p=>{const old=n(p.sell);let next=old*(1+pct/100);if(round>1)next=Math.round(next/round)*round;p.sell=Math.max(0,Math.round(next));data.priceHistory.push({id:uid(),isoDate:todayISO(),date:faDate(),productId:p.id,oldSell:old,newSell:p.sell,reason:'تغییر گروهی قیمت'});});audit('تغییر گروهی قیمت',arr.length+' کالا · '+pct+'%');closeModal();save()}
function holdDraft(){if(!draft.items.length)return alert('فاکتور خالی است');const code='H'+Date.now().toString(36).toUpperCase();data.heldDrafts=data.heldDrafts||[];data.heldDrafts.push({id:uid(),code,createdAt:new Date().toISOString(),partyId:draft.partyId||'',payment:draft.payment||'نقدی',discount:n(draft.discount),paid:draft.paid,items:clone(draft.items)});draft={items:[],discount:0,paid:null,payment:'نقدی',partyId:''};audit('تعلیق فاکتور',code);save()}
function openHeld(){data.heldDrafts=data.heldDrafts||[];modal('فاکتورهای معلق',`${data.heldDrafts.length?data.heldDrafts.slice().reverse().map((h,ri)=>`<div class="holdCard"><div><b>${h.code}</b><div class="meta">${new Date(h.createdAt).toLocaleString('fa-IR')} · ${qty(h.items.reduce((a,i)=>a+n(i.qty),0))} قلم</div></div><div class="actions"><button class="btn green" onclick="resumeHeld('${h.id}')">ادامه</button><button class="btn red" onclick="deleteHeld('${h.id}')">حذف</button></div></div>`).join(''):'<div class="empty">فاکتور معلقی وجود ندارد.</div>'}`)}
function resumeHeld(id){const i=(data.heldDrafts||[]).findIndex(h=>h.id===id);if(i<0)return;const h=data.heldDrafts[i];if(draft.items.length&& !confirm('فاکتور فعلی با فاکتور معلق جایگزین شود؟'))return;draft={items:clone(h.items),discount:n(h.discount),paid:h.paid===null?null:n(h.paid),payment:h.payment||'نقدی',partyId:h.partyId||''};data.heldDrafts.splice(i,1);closeModal();save(true);go('pos')}
function deleteHeld(id){data.heldDrafts=(data.heldDrafts||[]).filter(h=>h.id!==id);save()}

function posPage(){return `<div class="quickGrid"><div><div class="panel"><div class="toolbar"><div class="left"><b>فروش سریع</b><span class="shortcut">F8 جستجو</span><span class="shortcut">Enter افزودن</span></div><div class="right"><button class="btn sec" onclick="openHeld()">📌 فاکتورهای معلق (${qty((data.heldDrafts||[]).length)})</button><button class="btn sec" onclick="holdDraft()">⏸ تعلیق</button><button class="btn sec" onclick="clearDraft()">فاکتور جدید</button><button class="btn green" onclick="commitDraft()">ثبت فروش و چاپ</button></div></div><div class="pad"><div class="scan"><label>بارکد / کد کالا / نام کالا</label><div class="suggest"><input id="scan" class="input" autocomplete="off" placeholder="بارکد را اسکن کن یا نام کالا را بنویس..." oninput="suggestPOS()" onkeydown="scanKey(event)"><div id="suggestList" class="suggestList"></div></div></div><div class="sectionbox" style="margin-top:10px"><div class="formgrid"><div class="field"><label>مشتری</label><select id="posParty" class="select" onchange="draft.partyId=this.value"><option value="">متفرقه / نقدی</option>${data.parties.filter(p=>p.type==='customer').map(p=>`<option value="${p.id}" ${draft.partyId===p.id?'selected':''}>${esc(p.name)} · مانده ${money(p.balance)}</option>`).join('')}</select></div><div class="field"><label>پرداخت</label><select id="posPay" class="select" onchange="draft.payment=this.value;recalcPOS()"><option ${draft.payment==='نقدی'?'selected':''}>نقدی</option><option ${draft.payment==='کارتخوان'?'selected':''}>کارتخوان</option><option ${draft.payment==='کارت‌به‌کارت'?'selected':''}>کارت‌به‌کارت</option><option ${draft.payment==='نسیه'?'selected':''}>نسیه</option></select></div><div class="field"><label>تخفیف فاکتور</label><input id="posDisc" class="input" type="number" value="${draft.discount||0}" oninput="draft.discount=n(this.value);recalcPOS()"></div><div class="field"><label>دریافتی</label><input id="posPaid" class="input" type="number" value="${draft.paid===null?'':draft.paid}     const pa=party(serviceDraft.partyId);
    const no=data.settings.prefix+'S'+String(data.seq.serviceSale).padStart(5,'0');
    data.seq.serviceSale+=1;
    const rec={id:uid(),no,isoDate:todayISO(),date:faDate(),partyId:pa?.id||'',partyName:pa?.name||'متفرقه',items:serviceDraft.items.map(x=>({...x})),subtotal:c.sub,discount:c.disc,total:c.total,paid:c.paid,remaining:c.rem,paymentType:serviceDraft.payment,profit:c.profit,status:'active'};
    data.serviceSales.push(rec);
    if(c.paid>0)cashAdd('دریافت خدمات',c.paid,serviceDraft.payment,rec.partyName,no);
    if(c.rem>0&&pa)pa.balance=n(pa.balance)+c.rem;
    audit('ثبت خدمات',no+' · '+rec.partyName+' · '+rec.total);
    serviceResetDraft();
    save(true);
    render();
    if(print)setTimeout(()=>printService(rec),120);

  }catch(e){console.error('serviceCommit',e);alert('ثبت خدمت با خطای غیرمنتظره روبه‌رو شد. اطلاعات فعلی حفظ شده است.');return false}

function serviceApplyPaymentCorrection(rec,newPayment,newPaid,newPartyId){
  const oldPaid=n(rec.paid),oldRem=n(rec.remaining),newP=String(newPayment||'نقدی');
  const total=n(rec.total),paid=newP==='نسیه'?0:Math.min(total,Math.max(0,n(newPaid)));
  const newRem=Math.max(0,total-paid);
  const oldParty=party(rec.partyId),newParty=party(newPartyId);
  const tx=(data.cash||[]).filter(x=>x.ref===rec.no);
  tx.forEach(x=>x.amount=0);
  if(paid>0)cashAdd('دریافت اصلاح‌شده خدمات',paid,newP,newParty?.name||rec.partyName,rec.no);
  if(oldParty)oldParty.balance=Math.max(0,n(oldParty.balance)-oldRem);
  if(newRem>0&&newParty)newParty.balance=n(newParty.balance)+newRem;
  rec.partyId=newParty?.id||'';rec.partyName=newParty?.name||'متفرقه';rec.paymentType=newP;rec.paid=paid;rec.remaining=newRem;
  audit('اصلاح پرداخت خدمات',rec.no+' · '+newP+' · '+paid);
  save(true);closeModal();render();
}

function v19Init(){if(!Array.isArray(data.manualJournals))data.manualJournals=[];if(!data.seq||typeof data.seq!=='object')data.seq={};if(!data.seq.journal)data.seq.journal=1;}
v19Init();
function v19PayAccount(pay){if(pay==='کارتخوان')return 'کارتخوان';if(pay==='کارت‌به‌کارت')return 'کارت‌به‌کارت';return 'صندوق نقدی'}
function v19Journal(){
  const rows=[];
  const add=(date,ref,desc,debit,credit,amount,source)=>{amount=n(amount);if(amount>0)rows.push({id:uid(),date:date||todayISO(),ref:ref||'',desc:desc||'',debit,credit,amount,source})};
  (data.sales||[]).filter(s=>s.status!=='cancelled').forEach(s=>{const d=s.isoDate||todayISO();if(n(s.paid)>0)add(d,s.no,'دریافت فروش '+(s.partyName||'متفرقه'),v19PayAccount(s.paymentType),'فروش کالا',n(s.paid),'فروش');if(n(s.remaining)>0)add(d,s.no,'فروش نسیه '+(s.partyName||'مشتری'), 'حساب‌های دریافتنی','فروش کالا',n(s.remaining),'فروش')});
  (data.serviceSales||[]).filter(s=>s.status!=='cancelled').forEach(s=>{const d=s.isoDate||todayISO();if(n(s.paid)>0)add(d,s.no,'دریافت خدمات '+(s.partyName||'متفرقه'),v19PayAccount(s.paymentType),'درآمد خدمات',n(s.paid),'خدمات');if(n(s.remaining)>0)add(d,s.no,'خدمات نسیه '+(s.partyName||'مشتری'),'حساب‌های دریافتنی','درآمد خدمات',n(s.remaining),'خدمات')});
  (data.purchases||[]).forEach(p=>{const d=p.isoDate||todayISO();if(n(p.total)>0)add(d,p.no,'ثبت خرید '+(p.partyName||'متفرقه'),'موجودی کالا','حساب‌های پرداختنی',n(p.total),'خرید');if(n(p.paid)>0)add(d,p.no,'پرداخت خرید '+(p.partyName||'متفرقه'),'حساب‌های پرداختنی',v19PayAccount(p.paymentType),n(p.paid),'خرید/پرداخت')});
  (data.expenses||[]).forEach(x=>{if(n(x.amount)>0)add(x.isoDate||todayISO(),x.id||'',x.title||'هزینه فروشگاه', 'هزینه‌های فروشگاه',v19PayAccount(x.paymentType||x.pay),n(x.amount),'هزینه')});
  (data.manualJournals||[]).forEach(x=>{if(n(x.amount)>0)add(x.date||todayISO(),x.no||'',x.desc||'سند دستی',x.debit||'سرمایه / سایر',x.credit||'صندوق نقدی',n(x.amount),'دستی')});
  return rows.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
}
function v19Aggregate(){const m={};v19Journal().forEach(r=>{m[r.debit]??={debit:0,credit:0};m[r.credit]??={debit:0,credit:0};m[r.debit].debit+=r.amount;m[r.credit].credit+=r.amount});return Object.entries(m).map(([account,v])=>({account,debit:v.debit,credit:v.credit,balance:v.debit-v.credit})).sort((a,b)=>Math.abs(b.balance)-Math.abs(a.balance))}
function v19FinancePage(){
  const j=v19Journal(), agg=v19Aggregate();
  const sales=activeSales().reduce((a,s)=>a+n(s.total),0), services=(data.serviceSales||[]).filter(s=>s.status!=='cancelled').reduce((a,s)=>a+n(s.total),0), costs=(data.expenses||[]).reduce((a,x)=>a+n(x.amount),0);
  const recv=(data.parties||[]).filter(p=>p.type==='customer').reduce((a,p)=>a+Math.max(0,n(p.balance)),0);
  const payables=(data.parties||[]).filter(p=>p.type==='supplier').reduce((a,p)=>a+Math.max(0,n(p.balance)),0);
  const cash=(data.cash||[]).filter(x=>String(x.payment||x.method||'')==='نقدی').reduce((a,x)=>a+n(x.amount),0);
  const revenue=sales+services;
  const approxNet=revenue-costs-(j.filter(x=>x.credit==='موجودی کالا').reduce((a,x)=>a+x.amount,0)-j.filter(x=>x.debit==='موجودی کالا').reduce((a,x)=>a+x.amount,0));
  return `<div class="panel"><div class="toolbar"><div class="left"><b>📚 مرکز مالی و حسابداری</b><span class="tag b">نسخه ۱۹</span></div><div class="right"><button class="btn green" onclick="v19OpenJournal()">+ سند دستی</button><button class="btn sec" onclick="v19ExportLedger()">خروجی دفتر</button><button class="btn sec" onclick="go('reports')">گزارش فروش</button></div></div><div class="pad">
  <div class="financeCards"><div class="card metric"><div class="muted">فروش کالا</div><div class="big">${money(sales)}</div></div><div class="card metric"><div class="muted">درآمد خدمات</div><div class="big">${money(services)}</div></div><div class="card metric"><div class="muted">مطالبات مشتریان</div><div class="big">${money(recv)}</div></div><div class="card metric"><div class="muted">بدهی تأمین‌کنندگان</div><div class="big">${money(payables)}</div></div></div>
  <div class="financeGrid section"><div class="panel"><div class="toolbar"><b>دفتر رویدادهای مالی</b><span class="muted">فروش، خرید، خدمات، هزینه و اسناد دستی</span></div><div class="tablewrap"><table><tr><th>تاریخ</th><th>شماره</th><th>شرح</th><th>بدهکار</th><th>بستانکار</th><th>مبلغ</th><th>منبع</th></tr>${j.slice(0,120).map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.ref)}</td><td>${esc(r.desc)}</td><td>${esc(r.debit)}</td><td>${esc(r.credit)}</td><td><b>${money(r.amount)}</b></td><td><span class="ledgerBadge ${r.source==='دستی'?'debit':'credit'}">${esc(r.source)}</span></td></tr>`).join('')||'<tr><td colspan="7" class="empty">هنوز رویداد مالی ثبت نشده است.</td></tr>'}</table></div></div>
  <div><div class="panel"><div class="toolbar"><b>مانده حساب‌ها</b></div><div class="pad">${agg.length?agg.map(a=>`<div class="financeAccount" style="margin-bottom:7px"><div class="label">${esc(a.account)}</div><div class="value ${a.balance>=0?'positive':'negative'}">${money(a.balance)}</div><div class="muted">بدهکار ${money(a.debit)} · بستانکار ${money(a.credit)}</div></div>`).join(''):'<div class="empty">داده مالی موجود نیست.</div>'}</div></div>
  <div class="panel section"><div class="toolbar"><b>خلاصه مالی</b></div><div class="pad"><div class="financeSummary"><div class="mini">درآمد کل<b>${money(revenue)}</b></div><div class="mini">هزینه ثبت‌شده<b>${money(costs)}</b></div><div class="mini">موجودی کالا<b>${money(stockBuyValue())}</b></div><div class="mini">صندوق/دریافت نقدی<b>${money(cash)}</b></div><div class="mini">اسناد مالی<b>${qty(j.length)}</b></div><div class="mini">برآورد جریان درآمد-هزینه<b>${money(revenue-costs)}</b></div></div><div class="hint" style="margin-top:9px">این مرکز مالی برای کنترل مدیریتی فروشگاه طراحی شده است. برای حسابداری رسمی/مالیاتی، اسناد باید با ساختار و قوانین موردنیاز کسب‌وکار بررسی شوند.</div></div></div></div></div>
  <div class="panel section"><div class="toolbar"><b>عملیات سریع مالی</b></div><div class="pad"><div class="actions"><button class="btn" onclick="go('cash')">💰 صندوق</button><button class="btn sec" onclick="go('parties')">👥 طرف حساب‌ها</button><button class="btn sec" onclick="go('expenses')">💸 هزینه‌ها</button><button class="btn sec" onclick="go('purchases')">🛒 خریدها</button><button class="btn sec" onclick="go('services')">🖨️ خدمات</button></div></div></div></div></div>`
}
function v19OpenJournal(){modal('ثبت سند مالی دستی',`<div class="hint">برای اصلاح یا ثبت رویدادهای مالی خارج از فروش/خرید/خدمات از این بخش استفاده کن. مبلغ را به تومان وارد کن.</div><div class="sectionbox"><div class="journalLine"><div class="field"><label>تاریخ</label><input id="jDate" class="input" type="date" value="${todayISO()}"></div><div class="field"><label>حساب بدهکار</label><select id="jDebit" class="select">${V19_ACCOUNTS.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>حساب بستانکار</label><select id="jCredit" class="select"><option>صندوق نقدی</option>${V19_ACCOUNTS.filter(x=>x!=='صندوق نقدی').map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>شرح</label><input id="jDesc" class="input" placeholder="مثلاً انتقال وجه یا سرمایه‌گذاری"></div><div class="field"><label>مبلغ</label><input id="jAmt" class="input" type="number" min="1" placeholder="تومان"></div></div></div><div class="actions"><button class="btn green" onclick="v19SaveJournal()">ثبت سند</button><button class="btn sec" onclick="closeModal()">انصراف</button></div>`)}
function v19SaveJournal(){const amount=n(val('jAmt'));const debit=val('jDebit'),credit=val('jCredit');if(amount<=0)return alert('مبلغ معتبر وارد کن');if(debit===credit)return alert('حساب بدهکار و بستانکار نباید یکی باشد');const no='S'+String(data.seq.journal++).padStart(5,'0');data.manualJournals.push({id:uid(),no,date:val('jDate')||todayISO(),desc:val('jDesc')||'سند دستی',debit,credit,amount});audit('ثبت سند مالی دستی',no+' · '+amount);closeModal();save();go('finance')}
function v19ExportLedger(){const rows=v19Journal();const lines=[['تاریخ','شماره','شرح','بدهکار','بستانکار','مبلغ','منبع'],...rows.map(r=>[r.date,r.ref,r.desc,r.debit,r.credit,r.amount,r.source])];const txt=lines.map(r=>r.map(csvCell).join(',')).join('\n');downloadText('abrang-ledger-'+todayISO()+'.csv',txt);}
const _v19BaseRender=render;
render=function(){if(page==='finance'){document.getElementById('title').textContent='مرکز مالی و حسابداری';document.getElementById('subtitle').textContent=data.settings.shopName+' · '+data.settings.address+' · '+data.settings.phone;document.querySelectorAll('#nav button[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p===page));document.getElementById('content').innerHTML=v19FinancePage();return;}return _v19BaseRender();};

/* ===== ABRANG V20 SUPPLY / SUPPLIER SETTLEMENT / PRICE LEVELS ===== */
(function(){
  function v20Normalize(){
    data.products.forEach(p=>{
      p.prices=p.prices&&typeof p.prices==='object'?p.prices:{};
      if(p.prices.retail==null)p.prices.retail=n(p.sell);
      if(p.prices.bulk==null)p.prices.bulk=Math.round(n(p.sell)*0.95);
      if(p.prices.wholesale==null)p.prices.wholesale=Math.round(n(p.sell)*0.90);
    });
  }
  v20Normalize();
  const _v20OrigAddDraft=addDraft;
  window.v20PriceLevel='retail';
  window.v20PriceMap={retail:'عادی',bulk:'همکار',wholesale:'عمده'};
  window.v20Price=(p,level)=>{const x=n(p?.prices?.[level]);return x||n(p?.sell)};
  window.addDraft=function(id){
    const p=product(id);if(!p)return;
    const ex=draft.items.find(i=>i.productId===id);
    if(ex){ex.qty++;if(window.v20PriceLevel)ex.price=v20Price(p,window.v20PriceLevel);}
    else draft.items.push({productId:id,name:p.name,qty:1,price:v20Price(p,window.v20PriceLevel),discount:0});
    const sc=document.getElementById('scan');if(sc)sc.value='';const sl=document.getElementById('suggestList');if(sl)sl.innerHTML='';renderPOSBody();
  };
  window.v20ApplyPriceLevel=function(){draft.items.forEach(i=>{const p=product(i.productId);if(p)i.price=v20Price(p,window.v20PriceLevel)});renderPOSBody()};
  window.v20SetPrice=function(id,level){const p=product(id);if(!p)return;const x=prompt('قیمت '+(v20PriceMap[level]||level)+' برای «'+p.name+'» را وارد کن:',String(v20Price(p,level)));if(x===null)return;const v=n(x);if(v<0)return alert('قیمت نامعتبر است');p.prices=p.prices||{};p.prices[level]=v;if(level==='retail')p.sell=v;audit('تغییر قیمت '+(v20PriceMap[level]||level),p.name+' · '+v);save();go('supply')};
  window.v20SetAllByPercent=function(level,percent,cat){const pct=n(percent);let count=0;data.products.forEach(p=>{if(cat&&p.cat!==cat)return;p.prices=p.prices||{};p.prices[level]=Math.max(0,Math.round(v20Price(p,level)*(1+pct/100)));if(level==='retail')p.sell=p.prices[level];count++});if(count){audit('تغییر گروهی قیمت '+(v20PriceMap[level]||level),count+' کالا · '+pct+'٪');save();go('supply')} };
  window.v20SupplierDue=function(pid){return data.purchases.filter(x=>x.partyId===pid).reduce((a,x)=>a+Math.max(0,n(x.remaining)),0)};
  window.v20ApplySupplierPayment=function(pid){
    const p=party(pid); if(!p)return; const due=v20SupplierDue(pid);
    modal('پرداخت به تأمین‌کننده — '+esc(p.name),`<div class="miniGrid"><div class="mini">بدهی خرید<b>${money(due)}</b></div><div class="mini">مانده ثبت‌شده طرف حساب<b>${money(p.balance)}</b></div></div><div class="formgrid" style="margin-top:10px"><div class="field"><label>مبلغ پرداخت</label><input id="v20PayAmt" class="input" type="number" value="${due}"></div><div class="field"><label>روش</label><select id="v20PayMethod" class="select"><option>نقدی</option><option>کارتخوان</option><option>کارت‌به‌کارت</option></select></div><div class="field" style="grid-column:span 2"><label>شرح</label><input id="v20PayNote" class="input" value="پرداخت به ${esc(p.name)}"></div></div><div class="actions" style="margin-top:10px"><button class="btn green" onclick="v20SaveSupplierPayment('${pid}')">ثبت پرداخت</button><button class="btn sec" onclick="closeModal()">انصراف</button></div>`);
  };
  window.v20SaveSupplierPayment=function(pid){
    const p=party(pid),amount=Math.max(0,n(val('v20PayAmt'))),method=val('v20PayMethod');if(!p||!amount)return alert('مبلغ معتبر نیست');
    let left=Math.min(amount,v20SupplierDue(pid));
    const pp=data.purchases.filter(x=>x.partyId===pid&&n(x.remaining)>0).sort((a,b)=>String(a.isoDate).localeCompare(String(b.isoDate)));
    for(const pur of pp){if(left<=0)break;const q=Math.min(left,n(pur.remaining));pur.remaining-=q;pur.paid=n(pur.paid)+q;left-=q;}
    const ref='SP'+String(data.seq.supplierPay++).padStart(5,'0');
    cashAdd('پرداخت به تأمین‌کننده',-amount,method,p.name,ref);
    p.balance=Math.max(0,n(p.balance)-amount);
    audit('پرداخت تأمین‌کننده',p.name+' · '+amount+' · '+ref);closeModal();save();go('supply');
  };
  window.v20PurchaseDetail=function(no){const pur=data.purchases.find(x=>x.no===no);if(!pur)return;modal('جزئیات خرید '+esc(no),`<div class="miniGrid"><div class="mini">تأمین‌کننده<b>${esc(pur.partyName||'متفرقه')}</b></div><div class="mini">مبلغ<b>${money(pur.total)}</b></div><div class="mini">پرداخت<b>${money(pur.paid)}</b></div><div class="mini">مانده<b>${money(pur.remaining)}</b></div></div><div class="tablewrap" style="margin-top:10px"><table><tr><th>کالا</th><th>تعداد</th><th>قیمت خرید</th><th>جمع</th></tr>${(pur.items||[]).map(i=>`<tr><td>${esc(product(i.productId)?.name||i.name||'-')}</td><td>${qty(i.qty)}</td><td>${money(i.price)}</td><td>${money(n(i.qty)*n(i.price))}</td></tr>`).join('')}</table></div>`)};

    const dueAll=data.purchases.reduce((a,x)=>a+Math.max(0,n(x.remaining)),0);

button class="btn sec" onclick="v20PurchaseDetail('${x.no}')">جزئیات</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">خریدی ثبت نشده است.</td></tr>'}</table></div></div></div><div><div class="panel"><div class="toolbar"><b>قیمت‌گذاری چندسطحی</b><span class="v20Pill">عادی · همکار · عمده</span></div><div class="pad"><div class="field"><label>کالا</label><select id="v20PriceProduct" class="select">${data.products.map(p=>`<option value="${p.id}">${esc(p.name)} · ${money(p.sell)}</option>`).join('')}</select></div><div class="v20PriceGrid" style="margin-top:10px"><div class="v20PriceBox"><b>عادی</b><input id="v20retail" class="input" type="number"></div><div class="v20PriceBox"><b>همکار</b><input id="v20bulk" class="input" type="number"></div><div class="v20PriceBox"><b>عمده</b><input id="v20wholesale" class="input" type="number"></div></div><div class="actions" style="margin-top:10px"><button class="btn" onclick="v20SaveProductPrices()">ذخیره قیمت‌ها</button></div><div class="hint" style="margin-top:8px">قیمت «عادی» همان قیمت فروش اصلی است. در فروش سریع، سطح قیمت انتخاب‌شده روی کالا اعمال می‌شود.</div></div></div><div class="panel section"><div class="toolbar"><b>افزایش/کاهش گروهی</b></div><div class="pad"><div class="formgrid"><div class="field"><label>سطح قیمت</label><select id="v20BulkLevel" class="select"><option value="retail">عادی</option><option value="bulk">همکار</option><option value="wholesale">عمده</option><option value="special">ویژه</option></select></div><div class="field"><label>درصد تغییر</label><input id="v20BulkPct" class="input" type="number" placeholder="مثلاً 10 یا -5"></div><div class="field"><label>دسته</label><select id="v20BulkCat" class="select"><option value="">همه دسته‌ها</option>${cat.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div></div><button class="btn green" style="margin-top:10px" onclick="v20BulkPrice()">اعمال تغییر گروهی</button><div class="hint" style="margin-top:8px">قبل از اعمال، از پشتیبان‌گیری استفا     const items=[];for(let r=1;r<rows.length;r++){const row=rows[r];const get=k=>map[k]===undefined?'':row[map[k]]??'';const name=String(get('name')).trim();if(!name)continue;let buy=v30Num(get('buy')),sell=v30Num(get('sell')),profit=get('profit')===''?'':v30Num(get('profit'));if(!sell&&buy){const pct=profit===''?70:profit;sell=v30Round(buy*(1+pct/100),1000)}items.push({name,barcode:String(get('barcode')).trim(),code:String(get('code')).trim(),cat:String(get('cat')).trim()||'لوازم تحریر',brand:String(get('brand')).trim(),unit:String(get('unit')).trim()||'عدد',shelf:String(get('shelf')).trim(),buy,avgBuy:buy,sell,profitPercent:profit===''?(buy?((sell/buy)-1)*100:0):profit,stock:v30Num(get('stock')),minStock:v30Num(get('minStock')),reorderDays:v30Num(get('reorderDays'))||14,__buyProvided:String(get('buy')).trim()!=='',__sellProvided:String(get('sell')).trim()!=='',__stockProvided:String(get('stock')).trim()!=='',__minProvided:String(get('minStock')).trim()!=='',__profitProvided:String(get('profit')).trim()!==''});}

  function v30BatchWizard(){

  function v30PreviewBatch(){const t=document.getElementById('v30BatchText')?.value||'';const parsed=v30ParseRows(t),box=document.getElementById('v30BatchPreview');if(!box)return; if(parsed.error){box.innerHTML='<div class="notice danger">'+esc(parsed.error)+'</div>';return}const issues=[];const seenCodes=new Set(),seenBars=new Set();parsed.items.forEach((it,i)=>{if(it.code){if(seenCodes.has(it.code))issues.push('کد تکراری داخل فایل در ردیف '+(i+2));seenCodes.add(it.code);if(data.products.some(p=>String(p.code||'')===it.code))issues.push('کد موجود در سیستم: '+it.code)}if(it.barcode){if(seenBars.has(it.barcode))issues.push('بارکد تکراری داخل فایل در ردیف '+(i+2));seenBars.add(it.barcode);if(data.products.some(p=>String(p.barcode||'')===it.barcode))issues.push('بارکد موجود در سیستم: '+it.barcode)} });box.innerHTML='<div class="miniGrid"><div class="mini">ردیف قابل ثبت<b>'+qty(parsed.items.length)+'</b></div><div class="mini">خطای جدی<b>'+qty(issues.length)+'</b></div><div class="mini">قیمت محاسبه‌ای<b>'+qty(parsed.items.filter(x=>x.buy&&!x.sell).length)+'</b></div><div class="mini">موجودی اولیه<b>'+qty(parsed.items.reduce((a,x)=>a+n(x.stock),0))+'</b></div></div>'+(issues.length?'<div class="notice danger" style="margin-top:10px">'+issues.slice(0,12).map(esc).join('<br>')+'</div>':'<div class="notice ok" style="margin-top:10px">کنترل اولیه بدون خطای تکراری انجام شد.</div>')+'<div class="tablewrap" style="margin-top:10px;max-height:260px"><table><tr><th>نام</th><th>کد</th><th>بارکد</th><th>خرید</th><th>سود</th><th>فروش</th><th>موجودی</th></tr>'+parsed.items.slice(0,50).map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.code||'خودکار')+'</td><td>'+esc(x.barcode||'—')+'</td><td>'+money(x.buy)+'</td><td>'+qty(x.profitPercent)+'٪</td><td>'+money(x.sell)+'</td><td>'+qty(x.stock)+'</td></tr>').join('')+'</table></div>';
  }
  function v30ImportBatch(){
    const t=document.getElementById('v30BatchText')?.value||'',parsed=v30ParseRows(t);if(parsed.error)return alert(parsed.error);if(!parsed.items.length)return alert('ردیفی برای ثبت وجود ندارد');
    let added=0,updated=0,skipped=0;const errs=[];

    }

  }

<script>
(function(){
  const V32_DB='ABRANG_LOCAL_DB_V32';
  const V32_STORE='snapshots';
  const V32_ID='current';
  let v32dbPromise=null;
  function v32OpenDB(){
    if(v32dbPromise)return v32dbPromise;
    v32dbPromise=new Promise((resolve,reject)=>{
      if(!window.indexedDB)return reject(new Error('IndexedDB unavailable'));
      const req=indexedDB.open(V32_DB,1);
      req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(V32_STORE))db.createObjectStore(V32_STORE,{keyPath:'id'})};
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error||new Error('DB open failed'));
    });
    return v32dbPromise;
  }
  async function v32Put(snapshot){
    const db=await v32OpenDB();
    await new Promise((resolve,reject)=>{const tx=db.transaction(V32_STORE,'readwrite');tx.objectStore(V32_STORE).put(snapshot);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});
  }
  async function v32Get(){
    const db=await v32OpenDB();
    return await new Promise((resolve,reject)=>{const tx=db.transaction(V32_STORE,'readonly');const r=tx.objectStore(V32_STORE).get(V32_ID);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)});
  }
  function v32Size(){try{return new Blob([JSON.stringify(data||{})]).size}catch(e){return 0}}
  function v32PrettyBytes(v){const n=Number(v)||0;if(n<1024)return n+' B';if(n<1024*1024)return (n/1024).toFixed(1)+' KB';return (n/1024/1024).toFixed(2)+' MB'}
  function v32MirrorNow(source){
    try{
      const snap={id:V32_ID,appVersion:'32.0',format:'ABRANG-LOCAL-DB-V1',savedAt:new Date().toISOString(),source:String(source||'save'),size:v32Size(),data:clone(data)};
      v32Put(snap).then(()=>{window.__v32LastMirror=snap.savedAt;window.__v32MirrorOk=true;}).catch(()=>{window.__v32MirrorOk=false});
    }catch(e){window.__v32MirrorOk=false}
  }
  async function v32Status(){
    try{const x=await v32Get();return {ok:true,snapshot:x}}
    catch(e){return {ok:false,error:String(e.message||e)}}
  }
  function v32FmtDate(iso){if(!iso)return '—';try{return new Intl.DateTimeFormat('fa-IR',{dateStyle:'short',timeStyle:'short'}).format(new Date(iso))}catch(e){return iso}}
  function v32Health(){
    const ps=data.products||[], issues=[];
    const codes=new Map(), bars=new Map();
    ps.forEach((p,i)=>{
      if(!String(p.name||'').trim())issues.push('کالای ردیف '+(i+1)+' نام ندارد.');
      if(n(p.stock)<0)issues.push('موجودی منفی: '+(p.name||p.code||'بدون نام'));
      if(p.code){const k=String(p.code);codes.set(k,(codes.get(k)||0)+1)}
      if(p.barcode){const k=String(p.barcode);bars.set(k,(bars.get(k)||0)+1)}
      if(n(p.sell)<0 || n(p.avgBuy)<0)issues.push('قیمت منفی: '+(p.name||p.code||'بدون نام'));
    });
    for(const [k,v] of codes)if(v>1)issues.push('کد کالا تکراری: '+k);
    for(const [k,v] of bars)if(v>1)issues.push('بارکد تکراری: '+k);
    return {issues,codes:ps.filter(p=>p.code).length,bars:ps.filter(p=>p.barcode).length};
  }
  function v32DataCenterPage(){

      <div class="notice ok"><b>هدف این بخش:</b> اطلاعات فروشگاه فقط به یک محل وابسته نباشد. نسخه ۳۲ علاوه بر ذخیره‌سازی قبلی مرورگر، یک آینه داخلی از کل داده‌ها نگهداری می‌کند تا در صورت مشکل، امکان بازیابی سریع داشته باشیم.</div>

        <div class="v32stat">تعداد کالا<b>${fmt((data.products||[]).length)}</b></div>
        <div class="v32stat">فاکتورهای فروش<b>${fmt((data.sales||[]).length)}</b></div>

      <div class="sectionbox" style="margin-top:12px"><h3>روال پیشنهادی امنیت اطلاعات</h3><div class="v32step"><div class="num">۱</div><div>کار روزمره را مثل قبل انجام بده؛ ذخیره اصلی نرم‌افزار همچنان فعال است.</div></div><div class="v32step" style="margin-top:9px"><div class="num">۲</div><div>آینه داخلی نسخه ۳۲ به‌صورت خودکار بعد از ذخیره‌های اصلی به‌روزرسانی می‌شود.</div></div><div class="v32step" style="margin-top:9px"><div class="num">۳</div><div>هر چند وقت یک‌بار یک پشتیبان فایل مستقل هم دانلود کن و خارج از مرورگر نگه دار.</div></div></div>
    </div></div>`;
  }
  function v32RefreshDataCenter(){render();}
  async function v32CheckMirror(){
    const el=document.getElementById('v32MirrorInfo');if(!el)return;el.textContent='در حال بررسی...';
    const st=await v32Status();
    if(!st.ok){el.innerHTML='<span class="tag r">آینه قابل دسترسی نیست</span> '+esc(st.error);return}
    const x=st.snapshot;
    el.innerHTML=`<div class="notice ok">آینه پیدا شد: <b>${esc(v32FmtDate(x.savedAt))}</b> · منبع: ${esc(x.source||'save')} · حجم: ${v32PrettyBytes(x.size)} · کالا: ${fmt((x.data?.products||[]).length)} · فاکتور: ${fmt((x.data?.sales||[]).length)} · خدمات: ${fmt((x.data?.serviceSales||[]).length)}</div>`;
    const s=document.getElementById('v32dbState');if(s)s.textContent='فعال و قابل بازیابی';
  }
  async function v32RestoreMirror(){
    const st=await v32Status();if(!st.ok||!st.snapshot)return alert('آینه داخلی پیدا نشد یا قابل خواندن نیست.');

<script>

(function(){

  }
  function v33Matches(q){

      let score=0, reason='';

        else if((p.altBarcodes||[]).some(b=>v33Normalize(digitsFa(b)).includes(x))) {score=92;reason='بخشی از بارکد جایگزین'}

<td>${esc(p.barcode||'-')}</td><td>${qty((p.altBarcodes||[]).length)}</td><td>${qty((p.aliases||[]).length)}</td><td><button class="btn sec" onclick="v33IdentityModal('${p.id}')">ویرایش</button></td></tr>`).slice(0,300).join('')||'<tr><td colspan="6" class="empty">کالایی ثبت نشده است.</td></tr>'}</table></div></div></div></div>`;

  }

  function fmtSvcDate(x){return esc(x?.date||x?.isoDate||'')}
  function calcSvc35(){

    const cost=draft35.items.reduce((a,i)=>a+n(i.qty)*n(i.cost),0);

  function cards35(rows){

  function stats35(){

    const rev=td.reduce((a,x)=>a+n(x.total),0), cost=td.reduce((a,x)=>(a+(x.items||[]).reduce((b,i)=>b+n(i.qty)*n(i.cost),0)),0);
    const profit=td.reduce((a,x)=>a+n(x.profit||0),0);

    const cats={};active.filter(x=>{const t=new Date(x.isoDate||x.date||0).getTime();return t>=Date.now()-30*86400000}).forEach(x=>{const k=x.category||x.items?.[0]?.category||'سایر خدمات';cats[k]=(cats[k]||0)+n(x.total)});

  function servicePage35(){

      <div class="miniGrid"><div class="mini">درآمد خدمات امروز<b>${money(st.rev)}</b></div><div class="mini">سود تقریبی امروز<b>${money(st.profit)}</b></div><div class="mini">تعداد رسید امروز<b>${fmt(st.count)}</b></div><div class="mini">درآمد ۳۰ روز<b>${money(st.rev30)}</b></div></div>

    <div class="serviceGrid" style="margin-top:12px"><div>

    </div><div>
      <div class="panel"><div class="toolbar"><b>رسید خدمات جاری</b><span class="tag b">متفرقه / کافی‌نت</span></div><div class="pad"><div id="svcLines35">${svcLines35()}</div><div class="quickCats" style="margin:8px 0"><button onclick="svc35Qty(1)">×۱</button><button onclick="svc35Qty(10)">×۱۰</button><button onclick="svc35Qty(20)">×۲۰</button><button onclick="svc35Qty(50)">×۵۰</button><button onclick="svc35Qty(100)">×۱۰۰</button></div><div class="formgrid"><div class="field"><label>مشتری</label><select id="svc35Party" class="select" onchange="draft35.partyId=this.value"><option value="">متفرقه</option>${partys.map(p=>`<option value="${p.id}" ${draft35.partyId===p.id?'selected':''}>${esc(p.name)} · مانده ${money(p.balance)}</option>`).join('')}</select></div><div class="field"><label>روش پرداخت</label><select id="svc35Pay" class="select" onchange="draft35.payment=this.value;renderSvcSummary35()"><option ${draft35.payment==='نقدی'?'selected':''}>نقدی</option><option ${draft35.payment==='کارتخوان'?'selected':''}>کارتخوان</option><option ${draft35.payment==='کارت‌به‌کارت'?'selected':''}>کارت‌به‌کارت</option><option ${draft35.payment==='نسیه'?'selected':''}>نسیه</option></select></div><div class="field"><label>تخفیف</label><input id="svc35Disc" class="input" type="number" value="${n(draft35.discount)}" oninput="draft35.discount=n(this.value);renderSvcSummary35()"></div><div class="field"><label>دریافتی</label><input id="svc35Paid" class="input" type="number" value="${draft35.paid===null?'':n(draft35.paid)}" placeholder="خالی = کامل" oninput="draft35.paid=this.value===''?null:n(this.value);renderSvcSummary35()"></div></div><div class="formgrid" style="margin-top:9px"><div class="field"><label>وضعیت کار</label><select id="svc35Status" class="select" onchange="draft35.jobStatus=this.value"><option ${draft35.jobStatus==='تحویل شد'?'selected':''}>تحویل شد</option><option ${draft35.jobStatus==='در حال انجام'?'selected':''}>در حال انجام</option><option ${draft35.jobStatus==='در انتظار'?'selected':''}>در انتظار</option></select></div><div class="field" style="grid-column:span 3"><label>شرح کار / نام فایل / یادداشت</label><input id="svc35Note" class="input" value="${esc(draft35.notes)}" placeholder="مثلاً فلش 32GB، نام فایل، توضیح مشتری..." oninput="draft35.notes=this.value"></div></div><div id="svc35Summary"></div><div class="actions" style="margin-top:10px"><button class="btn dark" onclick="serviceCommit35(false)">⚡ ثبت فوری بدون چاپ</button><button class="btn green" onclick="serviceCommit35(true)">🖨️ ثبت و چاپ رسید</button><button class="btn sec" onclick="serviceReset35();renderSvc35(true)">پاک‌کردن رسید</button></div></div></div>
      <div class="panel section"><div class="toolbar"><b>گزارش امروز خدمات</b></div><div class="pad"><div class="miniGrid"><div class="mini">هزینه تقریبی<b>${money(st.cost)}</b></div><div class="mini">سود تقریبی<b>${money(st.profit)}</b></div><div class="mini">رسیدهای امروز<b>${fmt(st.count)}</b></div><div class="mini">وضعیت صف کار<b>${fmt(activeSvc35().filter(x=>x.jobStatus!=='تحویل شد').length)}</b></div></div><div class="tablewrap" style="margin-top:9px"><table><tr><th>دسته</th><th>درآمد ۳۰ روز</th></tr>${Object.entries(st.cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td><b>${money(v)}</b></td></tr>`).join('')||'<tr><td colspan="2" class="empty">هنوز اطلاعاتی ثبت نشده است.</td></tr>'}</table></div></div></div>
    </div></div>`;
  }
  function renderSvc35(focus){const c=document.getElementById('content');if(!c)return; c.innerHTML=servicePage35(); renderSvcSummary35(); if(focus)setTimeout(()=>document.getElementById('svcSearch35')?.focus(),25)}
  window.renderSvc35=renderSvc35;
  window.serviceReset35=function(){draft35={items:[],discount:0,paid:null,payment:'نقدی',partyId:'',notes:'',jobStatus:'تحویل شد'}};

  window.svc35SetCat=function(c){cat35=c;renderSvc35(true)};
  window.svc35Add=function(id){const s=svc35(id);if(!s)return;const x=draft35.items.find(i=>i.serviceId===id);if(x)x.qty=n(x.qty)+1;else draft35.items.push({serviceId:s.id,name:s.name,unit:s.unit,qty:1,price:n(s.sell),cost:n(s.cost),category:s.cat||s.category||'سایر خدمات'});renderSvc35(true)};

  window.svc35SetCost=function(i,v){if(!draft35.items[i])return;draft35.items[i].cost=Math.max(0,n(v));renderSvc35(false)};

  window.serviceCommit35=function(print=true){
    try{
      const c=calcSvc35(); if(!draft35.items.length)return alert('هنوز خدمتی انتخاب نشده است'); if(c.total<=0)return alert('مبلغ نهایی باید بیشتر از صفر باشد');

  window.svc35Export=function(){const rows=activeSvc35();const h=['تاریخ','شماره','مشتری','خدمات','وضعیت','پرداخت','مبلغ','دریافتی','مانده','سود','شرح'];const csv=[h,...rows.map(r=>[r.date,r.no,r.partyName,(r.items||[]).map(i=>i.name+' x '+i.qty).join(' | '),r.jobStatus,r.paymentType,r.total,r.paid,r.remaining,r.profit||0,r.notes||''])].map(a=>a.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n');if(typeof downloadText==='function')downloadText('خدمات-آبرنگ-'+todayISO()+'.csv',csv);};

  // Override old service page and service add/commit paths with the stable V35 implementation.

<script>
(function(){

    try{x=Object.assign(x,JSON.parse(localStorage.getItem(settingsKey)||'{}'))}catch(e){}

    x.retention=Math.max(3,Math.min(50,Number(x.retention)||14));
    x.enabled=x.enabled!==false; x.autoOnSave=x.autoOnSave===true;
    return x;
  }
  function last(){try{return JSON.parse(localStorage.getItem(lastKey)||'null')}catch(e){return null}}
  function fdate(iso){if(!iso)return '—';try{return new Intl.DateTimeFormat('fa-IR',{dateStyle:'short',timeStyle:'short'}).format(new Date(iso))}catch(e){return String(iso)}}
  function bytes(v){v=Number(v)||0;if(v<1024)return v+' B';if(v<1048576)return (v/1024).toFixed(1)+' KB';return (v/1048576).toFixed(2)+' MB'}
  function db(){
    if(dbPromise)return dbPromise;
    dbPromise=new Promise(function(resolve,reject){
      if(!window.indexedDB){reject(new Error('IndexedDB در دسترس نیست'));return}
      var r=indexedDB.open(dbName,1);
      r.onupgradeneeded=function(){var d=r.result;if(!d.objectStoreNames.contains(store))d.createObjectStore(store,{keyPath:'id'})};
      r.onsuccess=function(){resolve(r.result)}; r.onerror=function(){reject(r.error||new Error('DB error'))};
    }); return dbPromise;
  }
  async function loadHandle(){
    if(dirHandle)return dirHandle;
    try{var d=await db();var row=await new Promise(function(resolve,reject){var tx=d.transaction(store,'readonly'),q=tx.objectStore(store).get('folder');q.onsuccess=function(){resolve(q.result)};q.onerror=function(){reject(q.error)}});if(row&&row.handle)dirHandle=row.handle}catch(e){}
    return dirHandle;
  }
  async function saveHandle(h){
    var d=await db();await new Promise(function(resolve,reject){var tx=d.transaction(store,'readwrite');tx.objectStore(store).put({id:'folder',handle:h,at:new Date().toISOString()});tx.oncomplete=resolve;tx.onerror=function(){reject(tx.error||new Error('save failed'))}});dirHandle=h;

    await loadHandle(); if(!dirHandle)return 'none';

    }catch(e){if(e.name!=='AbortError')alert('انتخاب پوشه ناموفق بود: '+(e.message||e))}
  }
  function payload(reason){
    var p={format:'ABRANG-BACKUP-39',app:'حسابداری فروشگاهی آبرنگ',appVersion:'39.0',desktopBuild:'39-desktop',exportedAt:new Date().toISOString(),source:String(reason||'external'),data:clone(data)};
    p.summary={products:(data.products||[]).length,sales:(data.sales||[]).length,services:(data.serviceSales||[]).length,purchases:(data.purchases||[]).length,parties:(data.parties||[]).length,expenses:(data.expenses||[]).length};return p;
  }
  function fname(reason){return (reason==='auto'||reason==='auto-save'?'abrang-auto-backup-':'abrang-backup-')+new Date().toISOString().replace(/[:.]/g,'-')+'.json'}
  async function prune(){
    try{var c=cfg(),arr=[];for await(var e of dirHandle.values()){if(e.kind!=='file'||!/^abrang-(auto-)?backup-.*\.json$/i.test(e.name))continue;try{var f=await e.getFile();arr.push({name:e.name,last:f.lastModified||0})}catch(x){}}
      arr.sort(function(a,b){return b.last-a.last});for(var i=c.retention;i<arr.length;i++){try{await dirHandle.removeEntry(arr[i].name)}catch(x){}}

  }
  async function writeBackup(reason){

  }
  async function manualBackup(){var r=await writeBackup('manual');if(r.ok){alert('پشتیبان ذخیره شد:\n'+r.file);if(page==='ab39center')renderCenter()}else if(r.error==='no-folder'){alert('اول محل ذخیره پشتیبان را انتخاب کن.')}else if(r.error==='permission'){alert('مجوز نوشتن فعال نیست؛ «اعطای مجوز» را بزن.')}else alert('ذخیره پشتیبان ناموفق بود: '+r.error)}
  async function listFiles(){await loadHandle();if(!dirHandle)return [];var a=[];try{for await(var e of dirHandle.values()){if(e.kind==='file'&&/^abrang-(auto-)?backup-.*\.json$/i.test(e.name)){try{var f=await e.getFile();a.push({name:e.name,size:f.size,last:f.lastModified})}catch(x){}}}a.sort(function(x,y){return y.last-x.last})}catch(e){}return a}
  async function restoreFile(name){

  async function restoreUploaded(e){var f=e.target.files&&e.target.files[0];if(!f)return;try{var raw=JSON.parse(await f.text());if(!raw||!raw.data||!Array.isArray(raw.data.products)||!Array.isArray(raw.data.sales)||!Array.isArray(raw.data.purchases))throw new Error('فایل پشتیبان آبرنگ نیست');if(!confirm('اطلاعات فعلی با این فایل جایگزین شود؟'))return;data=normalize(clone(raw.data));save(true);createLocalSnapshot();render();alert('بازیابی فایل انجام شد')}catch(x){alert('بازیابی ناموفق بود: '+(x.message||x))}finally{e.target.value=''}}
  async function autoMaybe(){var c=cfg();if(!c.enabled)return;await loadHandle();if(!dirHandle)return;var l=last(),ms=c.intervalHours*3600000;if(!l||Date.now()-l.at>=ms)await writeBackup('auto')}
  function schedule(){clearTimeout(timer);var c=cfg();if(!c.enabled)return;var l=last(),ms=c.intervalHours*3600000,due=l&&l.at?Math.max(15000,ms-(Date.now()-l.at)):60000;timer=setTimeout(async function(){await autoMaybe();schedule()},Math.min(due,600000))}
  function health(){var ps=data.products||[],issues=[],codes={},bars={};ps.forEach(function(p,i){if(!String(p.name||'').trim())issues.push('کالای ردیف '+(i+1)+' نام ندارد');if(Number(p.stock)<0)issues.push('موجودی منفی: '+(p.name||p.code||'بدون نام'));if(p.code)codes[String(p.code)]=(codes[String(p.code)]||0)+1;if(p.barcode)bars[String(p.barcode)]=(bars[String(p.barcode)]||0)+1});Object.keys(codes).forEach(function(k){if(codes[k]>1)issues.push('کد تکراری: '+k)});Object.keys(bars).forEach(function(k){if(bars[k]>1)issues.push('بارکد تکراری: '+k)});return issues}
