</style>
<script id="abrangV54Accounting">
(function(){
  'use strict';
  const BUILD='54.0';
  const STORE='ABRANG_ACCOUNTING_V54';
  const defaultAccounts=[
    {code:'101',name:'صندوق',type:'asset',active:true,system:true},
    {code:'102',name:'بانک و کارتخوان',type:'asset',active:true,system:true},
    {code:'103',name:'حساب‌های دریافتنی مشتریان',type:'asset',active:true,system:true},
    {code:'104',name:'موجودی کالا',type:'asset',active:true,system:true},
    {code:'105',name:'سایر دارایی‌ها',type:'asset',active:true,system:true},
    {code:'201',name:'حساب‌های پرداختنی تأمین‌کنندگان',type:'liability',active:true,system:true},
    {code:'202',name:'سایر بدهی‌ها',type:'liability',active:true,system:true},
    {code:'301',name:'سرمایه مالک',type:'equity',active:true,system:true},
    {code:'302',name:'سود و زیان انباشته / افتتاحیه',type:'equity',active:true,system:true},
    {code:'401',name:'فروش کالا',type:'revenue',active:true,system:true},
    {code:'402',name:'درآمد خدمات کافی‌نت',type:'revenue',active:true,system:true},
    {code:'403',name:'سایر درآمدها',type:'revenue',active:true,system:true},
    {code:'404',name:'تخفیفات و برگشت فروش',type:'contraRevenue',active:true,system:true},
    {code:'501',name:'بهای تمام‌شده کالای فروش‌رفته',type:'expense',active:true,system:true},
    {code:'502',name:'هزینه‌های فروش و اداری',type:'expense',active:true,system:true},
    {code:'503',name:'سایر هزینه‌ها',type:'expense',active:true,system:true}
  ];
  function nn(v){try{return typeof n==='function'?n(v):Number(String(v??'').replace(/[٬,]/g,''))||0}catch(e){return Number(v)||0}}
  function fmtm(v){try{return typeof money==='function'?money(v):new Intl.NumberFormat('fa-IR').format(Math.round(nn(v)))+' تومان'}catch(e){return String(Math.round(nn(v)))} }
  function q(v){try{return typeof qty==='function'?qty(v):new Intl.NumberFormat('fa-IR').format(nn(v))}catch(e){return String(nn(v))}}
  function es(v){try{return typeof esc==='function'?esc(v):String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}catch(e){return String(v??'')}}
  function isoToday(){try{return todayISO()}catch(e){return new Date().toISOString().slice(0,10)}}
  function faToday(){try{return faDate()}catch(e){return isoToday()}}
  function uidx(){try{return uid()}catch(e){return 'u54_'+Date.now()+'_'+Math.random().toString(36).slice(2)}}
  function init(){
    data.accounting=data.accounting&&typeof data.accounting==='object'?data.accounting:{};
    if(!Array.isArray(data.accounting.accounts)||!data.accounting.accounts.length)data.accounting.accounts=clone(defaultAccounts);
    const byCode=new Map(data.accounting.accounts.map(a=>[String(a.code),a]));
    defaultAccounts.forEach(a=>{if(!byCode.has(a.code))data.accounting.accounts.push({...a})});
    if(!Array.isArray(data.accounting.manualJournals))data.accounting.manualJournals=[];
    if(!data.accounting.settings)data.accounting.settings={openingDone:false};
    data.accounting.schemaVersion=54;
    try{localStorage.setItem(STORE,JSON.stringify({schema:54,updatedAt:new Date().toISOString()}))}catch(e){}
  }
  function acc(code){return (data.accounting.accounts||[]).find(a=>String(a.code)===String(code))||{code:String(code),name:'حساب '+code,type:'asset',active:true}}
  function codeName(code){const a=acc(code);return a.name||code}
  function typeLabel(t){return ({asset:'دارایی',liability:'بدهی',equity:'سرمایه',revenue:'درآمد',contraRevenue:'کاهنده درآمد',expense:'هزینه'})[t]||t}
  function paymentAccount(method){const s=String(method||'').replace(/ي/g,'ی').replace(/ك/g,'ک');return /کارتخوان|کارت‌به‌کارت|کارت به کارت|بانک|واریز|درگاه|دستگاه/.test(s)?'102':'101'}
  function activeSales(){return (data.sales||[]).filter(s=>s&&s.status!=='cancelled')}
  function activeServices(){return (data.serviceSales||[]).filter(s=>s&&s.status!=='cancelled')}
  function saleCost(s){return (s.items||[]).reduce((a,i)=>a+nn(i.qty)*nn(i.buy),0)}
  function saleReturnedCost(s){return (s.items||[]).reduce((a,i)=>a+nn(i.returnedQty)*nn(i.buy),0)}
  function cashByRef(ref,typeMatch){return (data.cash||[]).filter(x=>String(x.ref||'')===String(ref)&&(!typeMatch||String(x.type||'').includes(typeMatch)))}
  function paymentAmountForSale(s){
    const rows=cashByRef(s.no,'');
    let inAmt=0,outAmt=0;for(const r of rows){if(nn(r.amount)>=0)inAmt+=nn(r.amount);else outAmt+=-nn(r.amount)}
    return {inAmt,outAmt};
  }
  function autoJournals(){
    const out=[];
    for(const s of activeSales()){
      const total=Math.max(0,nn(s.total));const paid=Math.max(0,nn(s.paid));const rem=Math.max(0,nn(s.remaining));
      const pLines=[];if(paid)pLines.push({account:paymentAccount(s.paymentType),debit:paid,credit:0,partyId:s.partyId||'',partyName:s.partyName||'متفرقه'});if(rem&&s.partyId)pLines.push({account:'103',debit:rem,credit:0,partyId:s.partyId,partyName:s.partyName||''});
      if(total>0)pLines.push({account:'401',debit:0,credit:total,partyId:s.partyId||'',partyName:s.partyName||'متفرقه'});
      if(pLines.length){out.push({id:'sale:'+s.id,no:'س-'+s.no,isoDate:String(s.isoDate||isoToday()).slice(0,10),date:s.date||faToday(),type:'auto',source:'sale',ref:s.no,description:'ثبت فروش کالا '+s.no,lines:pLines});}
      const cost=saleCost(s);if(cost>0)out.push({id:'cogs:'+s.id,no:'ه-'+s.no,isoDate:String(s.isoDate||isoToday()).slice(0,10),date:s.date||faToday(),type:'auto',source:'sale-cogs',ref:s.no,description:'ثبت بهای تمام‌شده فروش '+s.no,lines:[{account:'501',debit:cost,credit:0},{account:'104',debit:0,credit:cost}]});
      const returned=nn(s.returnedAmount||s.returned);if(returned>0){
        const cr=[];const cashRows=(data.cash||[]).filter(x=>String(x.ref||'')===String(s.no)&&/(برگشت وجه|لغو فاکتور)/.test(String(x.type||'')));
        let refund=0;for(const r of cashRows)refund+=Math.max(0,-nn(r.amount));
        const ar=Math.max(0,returned-refund);if(refund)cr.push({account:paymentAccount(s.paymentType),debit:0,credit:refund,partyId:s.partyId||'',partyName:s.partyName||''});if(ar&&s.partyId)cr.push({account:'103',debit:0,credit:ar,partyId:s.partyId,partyName:s.partyName||''});
        cr.unshift({account:'404',debit:returned,credit:0,partyId:s.partyId||'',partyName:s.partyName||''});
        out.push({id:'return:'+s.id,no:'م-'+s.no,isoDate:isoToday(),date:faToday(),type:'auto',source:'sale-return',ref:s.no,description:'برگشت/لغو فروش '+s.no,lines:cr});
        const rc=saleReturnedCost(s);if(rc>0)out.push({id:'return-cogs:'+s.id,no:'م‌ه-'+s.no,isoDate:isoToday(),date:faToday(),type:'auto',source:'sale-return-cogs',ref:s.no,description:'برگشت بهای تمام‌شده '+s.no,lines:[{account:'104',debit:rc,credit:0},{account:'501',debit:0,credit:rc}]});
      }
    }
    for(const s of activeServices()){
      const total=Math.max(0,nn(s.total));const paid=Math.max(0,nn(s.paid));const rem=Math.max(0,nn(s.remaining));const lines=[];
      if(paid)lines.push({account:paymentAccount(s.paymentType),debit:paid,credit:0,partyId:s.partyId||'',partyName:s.partyName||'متفرقه'});if(rem&&s.partyId)lines.push({account:'103',debit:rem,credit:0,partyId:s.partyId,partyName:s.partyName||''});if(total)lines.push({account:'402',debit:0,credit:total,partyId:s.partyId||'',partyName:s.partyName||'متفرقه'});
      if(lines.length)out.push({id:'service:'+s.id,no:'خ-'+s.no,isoDate:String(s.isoDate||isoToday()).slice(0,10),date:s.date||faToday(),type:'auto',source:'service',ref:s.no,description:'ثبت درآمد خدمات '+s.no,lines});
    }
    for(const p of (data.purchases||[])){
      if(!p||p.status==='cancelled')continue;const total=Math.max(0,nn(p.total));const paid=Math.max(0,nn(p.paid));const rem=Math.max(0,nn(p.remaining));const lines=[{account:'104',debit:total,credit:0,partyId:p.partyId||'',partyName:p.partyName||'متفرقه'}];if(paid)lines.push({account:paymentAccount(p.paymentType),debit:0,credit:paid,partyId:p.partyId||'',partyName:p.partyName||''});if(rem&&p.partyId)lines.push({account:'201',debit:0,credit:rem,partyId:p.partyId,partyName:p.partyName||''});
      out.push({id:'purchase:'+p.id,no:'خ-'+p.no,isoDate:String(p.isoDate||isoToday()).slice(0,10),date:p.date||faToday(),type:'auto',source:'purchase',ref:p.no,description:'ثبت خرید کالا '+p.no,lines});
    }
    for(const e of (data.expenses||[])){
      if(!e||nn(e.amount)<=0)continue;const a=Math.max(0,nn(e.amount));out.push({id:'expense:'+e.id,no:'هز-'+e.id.slice(-6),isoDate:String(e.isoDate||isoToday()).slice(0,10),date:e.date||faToday(),type:'auto',source:'expense',ref:e.id,description:'ثبت هزینه '+(e.title||''),lines:[{account:'502',debit:a,credit:0},{account:paymentAccount(e.payment),debit:0,credit:a}]});
    }
    const linkedRefs=new Set();(data.sales||[]).forEach(s=>linkedRefs.add(String(s.no)));(data.purchases||[]).forEach(p=>linkedRefs.add(String(p.no)));(data.serviceSales||[]).forEach(s=>linkedRefs.add(String(s.no)));(data.expenses||[]).forEach(e=>linkedRefs.add(String(e.id)));
    for(const c of (data.cash||[])){
      const ref=String(c.ref||'');if(ref&&linkedRefs.has(ref))continue;const amt=nn(c.amount);if(!amt)continue;const aid=paymentAccount(c.paymentType);let lines=null,desc=String(c.type||'دریافت/پرداخت دستی');
      if(/تسویه مشتری/.test(desc)&&amt>0)lines=[{account:aid,debit:amt,credit:0,partyName:c.partyName||''},{account:'103',debit:0,credit:amt,partyName:c.partyName||''}];
      else if(/پرداخت به تأمین‌کننده/.test(desc)&&amt<0)lines=[{account:'201',debit:-amt,credit:0,partyName:c.partyName||''},{account:aid,debit:0,credit:-amt,partyName:c.partyName||''}];
      else if(amt>0)lines=[{account:aid,debit:amt,credit:0,partyName:c.partyName||''},{account:'403',debit:0,credit:amt,partyName:c.partyName||''}];
      else lines=[{account:'503',debit:-amt,credit:0,partyName:c.partyName||''},{account:aid,debit:0,credit:-amt,partyName:c.partyName||''}];
      if(lines)out.push({id:'cash:'+c.id,no:'ص-'+String(c.id).slice(-7),isoDate:String(c.isoDate||isoToday()).slice(0,10),date:c.date||faToday(),type:'auto',source:'cash',ref:c.ref||c.id,description:desc,lines});
    }
    return out;
  }
  function allJournals(){return [...autoJournals(),...(data.accounting.manualJournals||[]).filter(x=>x&&x.status!=='void')].sort((a,b)=>String(a.isoDate).localeCompare(String(b.isoDate))||String(a.no).localeCompare(String(b.no)))}
  function totals(){let d=0,c=0;for(const j of allJournals())for(const l of j.lines||[]){d+=nn(l.debit);c+=nn(l.credit)}return {d,c,diff:d-c,count:allJournals().length}}
  function accountTotals(from,to){const m=new Map();for(const j of allJournals()){const dt=String(j.isoDate||'').slice(0,10);if(from&&dt<from)continue;if(to&&dt>to)continue;for(const l of j.lines||[]){const a=m.get(l.account)||{debit:0,credit:0,count:0};a.debit+=nn(l.debit);a.credit+=nn(l.credit);a.count++;m.set(l.account,a)}}return m}
  function accountBalance(code,map){const x=map.get(code)||{debit:0,credit:0,count:0};return (acc(code).type==='asset'||acc(code).type==='expense')?x.debit-x.credit:x.credit-x.debit}
  function accountRows(from,to){const m=accountTotals(from,to);return (data.accounting.accounts||[]).filter(a=>a.active!==false).map(a=>({...a,...(m.get(a.code)||{debit:0,credit:0,count:0}),balance:accountBalance(a.code,m)}));}
  function balanceSheet(from,to){const rows=accountRows(from,to);const asset=rows.filter(a=>a.type==='asset').reduce((s,a)=>s+a.balance,0);const liab=rows.filter(a=>a.type==='liability').reduce((s,a)=>s+a.balance,0);const eq=rows.filter(a=>a.type==='equity').reduce((s,a)=>s+a.balance,0);const rev=rows.filter(a=>a.type==='revenue'||a.type==='contraRevenue').reduce((s,a)=>s+a.balance,0);const exp=rows.filter(a=>a.type==='expense').reduce((s,a)=>s+a.balance,0);const profit=rev-exp;return {asset,liab,eq,profit,totalRight:liab+eq+profit,diff:asset-(liab+eq+profit)} }
  function pnl(from,to){const rows=accountRows(from,to);const revenues=rows.filter(a=>a.type==='revenue').reduce((s,a)=>s+a.balance,0);const contra=rows.filter(a=>a.type==='contraRevenue').reduce((s,a)=>s+a.balance,0);const expenses=rows.filter(a=>a.type==='expense').reduce((s,a)=>s+a.balance,0);return {revenues,contra,netRevenue:revenues-contra,expenses,profit:revenues-contra-expenses}}
  function htmlTabs(active){const ts=[['overview','نمای کلی'],['journals','اسناد حسابداری'],['accounts','کدینگ حساب‌ها'],['trial','تراز آزمایشی'],['ledger','دفتر معین'],['pnl','سود و زیان'],['balance','ترازنامه'],['opening','افتتاحیه']];return `<div class="v54tabs">${ts.map(x=>`<button class="v54tab ${active===x[0]?'active':''}" onclick="v54Tab('${x[0]}')">${x[1]}</button>`).join('')}</div>`}
  function rangeControls(){return `<div class="sectionbox"><div class="formgrid"><div class="field"><label>از تاریخ میلادی/سیستمی</label><input id="v54From" class="input" value="${es(window.__v54From||'')}" placeholder="2026-09-01"></div><div class="field"><label>تا تاریخ</label><input id="v54To" class="input" value="${es(window.__v54To||isoToday())}" placeholder="2026-09-30"></div><div class="field"><label>حساب</label><select id="v54AccFilter" class="select"><option value="">همه حساب‌ها</option>${data.accounting.accounts.map(a=>`<option value="${es(a.code)}" ${window.__v54AccFilter===a.code?'selected':''}>${es(a.code)} · ${es(a.name)}</option>`).join('')}</select></div><div class="field"><label>طرف حساب</label><input id="v54PartyFilter" class="input" value="${es(window.__v54PartyFilter||'')}" placeholder="نام مشتری/تأمین‌کننده"></div></div><div class="actions" style="margin-top:8px"><button class="btn" onclick="v54ApplyFilters()">اعمال فیلتر</button><button class="btn sec" onclick="v54ClearFilters()">پاک‌کردن فیلتر</button></div></div>`}
  function overview(){const t=totals(),bs=balanceSheet(window.__v54From||'',window.__v54To||isoToday()),pr=pnl(window.__v54From||'',window.__v54To||isoToday());return `<div class="v54hero"><h2>📚 هسته حسابداری حرفه‌ای آبرنگ — نسخه ۵۴</h2><p>این نسخه فروش، خرید، خدمات، هزینه و عملیات صندوق را به اسناد دوطرفه تبدیل می‌کند و تراز آزمایشی، دفتر معین، سود و زیان و ترازنامه می‌سازد.</p><div class="actions" style="margin-top:10px"><button class="btn green" onclick="v54Tab('journals')">+ ثبت سند دستی</button><button class="btn sec" onclick="v54Tab('trial')">تراز آزمایشی</button><button class="btn sec" onclick="v54RebuildNotice()">بازسازی اسناد خودکار</button></div></div><div class="v54cards"><div class="v54card"><div class="muted">جمع بدهکار</div><b>${fmtm(t.d)}</b></div><div class="v54card"><div class="muted">جمع بستانکار</div><b>${fmtm(t.c)}</b></div><div class="v54card"><div class="muted">اختلاف</div><b class="${Math.abs(t.diff)<1?'v54credit':'v54debit'}">${fmtm(t.diff)}</b></div><div class="v54card"><div class="muted">اسناد مؤثر</div><b>${q(t.count)}</b></div><div class="v54card"><div class="muted">سود دوره</div><b>${fmtm(pr.profit)}</b></div><div class="v54card"><div class="muted">تراز دارایی</div><b>${fmtm(bs.asset)}</b></div></div>${Math.abs(t.diff)<1?'<div class="v54ok" style="margin-top:10px">✅ تراز اسناد حسابداری برابر است؛ جمع بدهکار و بستانکار یکسان است.</div>':'<div class="v54bad" style="margin-top:10px">⚠️ تراز حسابداری اختلاف دارد. سندهای دستی و داده‌های ثبت‌شده را بررسی کن.</div>'}<div class="grid2 section"><div class="panel"><div class="toolbar"><b>موتور خودکار</b></div><div class="pad"><div class="row"><span>فروش کالا</span><b>${q(activeSales().length)} فاکتور</b></div><div class="row"><span>خدمات</span><b>${q(activeServices().length)} رسید</b></div><div class="row"><span>خرید</span><b>${q((data.purchases||[]).length)} فاکتور</b></div><div class="row"><span>هزینه</span><b>${q((data.expenses||[]).length)} ثبت</b></div><div class="row"><span>سند دستی</span><b>${q((data.accounting.manualJournals||[]).length)}</b></div></div></div><div class="panel"><div class="toolbar"><b>وضعیت ترازنامه</b></div><div class="pad"><div class="row"><span>دارایی‌ها</span><b>${fmtm(bs.asset)}</b></div><div class="row"><span>بدهی‌ها</span><b>${fmtm(bs.liab)}</b></div><div class="row"><span>حقوق مالکانه</span><b>${fmtm(bs.eq)}</b></div><div class="row"><span>سود دوره</span><b>${fmtm(bs.profit)}</b></div><div class="row"><span>اختلاف</span><b class="${Math.abs(bs.diff)<1?'v54credit':'v54debit'}">${fmtm(bs.diff)}</b></div></div></div></div>`}
  function journals(){const js=allJournals().reverse();return `<div class="panel"><div class="toolbar"><div class="left"><b>اسناد حسابداری</b><span class="tag g">اسناد فروش/خرید/هزینه خودکار تولید می‌شوند</span></div><div class="right"><button class="btn" onclick="v54OpenManual(false)">+ سند دستی</button><button class="btn blue" onclick="v54OpenManual(true)">+ سند افتتاحیه</button></div></div>${rangeControls()}<div class="pad v54table"><table><tr><th>تاریخ</th><th>شماره</th><th>شرح</th><th>نوع</th><th>بدهکار</th><th>بستانکار</th><th>عملیات</th></tr>${js.filter(j=>{const d=j.isoDate||'';if(window.__v54From&&d<window.__v54From)return false;if(window.__v54To&&d>window.__v54To)return false;return true}).map(j=>{const td=j.lines.reduce((s,l)=>s+nn(l.debit),0),tc=j.lines.reduce((s,l)=>s+nn(l.credit),0);return `<tr><td>${es(j.date||j.isoDate)}</td><td class="v54code">${es(j.no)}</td><td>${es(j.description)}</td><td><span class="tag ${j.type==='auto'?'b':'g'}">${j.type==='auto'?'خودکار':'دستی'}</span></td><td>${fmtm(td)}</td><td>${fmtm(tc)}</td><td><button class="btn sec" onclick="v54ViewJournal('${es(j.id)}')">مشاهده</button>${j.type!=='auto'?` <button class="btn red" onclick="v54VoidJournal('${es(j.id)}')">ابطال</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="7" class="empty">سندی در این بازه پیدا نشد.</td></tr>'}</table></div></div>`}
  function accounts(){return `<div class="panel"><div class="toolbar"><div class="left"><b>کدینگ حساب‌ها</b><span class="tag b">سطح پایه ۵۴</span></div><div class="right"><button class="btn" onclick="v54NewAccount()">+ حساب جدید</button></div></div><div class="pad v54table"><table><tr><th>کد</th><th>نام حساب</th><th>ماهیت</th><th>وضعیت</th><th>بدهکار</th><th>بستانکار</th><th>مانده</th><th>عملیات</th></tr>${accountRows(window.__v54From||'',window.__v54To||isoToday()).map(a=>`<tr><td class="v54code">${es(a.code)}</td><td><b>${es(a.name)}</b></td><td>${typeLabel(a.type)}</td><td><span class="tag ${a.active!==false?'g':'r'}">${a.active!==false?'فعال':'غیرفعال'}</span></td><td>${fmtm(a.debit)}</td><td>${fmtm(a.credit)}</td><td class="${a.balance>=0?'v54credit':'v54debit'}">${fmtm(a.balance)}</td><td><button class="btn sec" onclick="v54EditAccount('${es(a.code)}')">ویرایش</button></td></tr>`).join('')}</table></div></div>`}
  function trial(){const rs=accountRows(window.__v54From||'',window.__v54To||isoToday());const td=rs.reduce((s,a)=>s+nn(a.debit),0),tc=rs.reduce((s,a)=>s+nn(a.credit),0);return `<div class="panel"><div class="toolbar"><div><b>تراز آزمایشی</b><div class="v54small">بر اساس گردش اسناد در بازه انتخاب‌شده</div></div><div class="right"><button class="btn sec" onclick="v54PrintTable('v54TrialTable','تراز آزمایشی')">🖨️ چاپ</button></div></div>${rangeControls()}<div class="pad v54table"><table id="v54TrialTable"><tr><th>کد</th><th>حساب</th><th>ماهیت</th><th>بدهکار</th><th>بستانکار</th><th>مانده</th></tr>${rs.map(a=>`<tr><td class="v54code">${es(a.code)}</td><td>${es(a.name)}</td><td>${typeLabel(a.type)}</td><td>${fmtm(a.debit)}</td><td>${fmtm(a.credit)}</td><td>${fmtm(a.balance)}</td></tr>`).join('')}<tr><th colspan="3">جمع</th><th>${fmtm(td)}</th><th>${fmtm(tc)}</th><th>${fmtm(td-tc)}</th></tr></table></div></div>`}
  function ledger(){const code=window.__v54AccFilter||'101';const from=window.__v54From||'',to=window.__v54To||isoToday();const rows=[];let bal=0;for(const j of allJournals()){const dt=String(j.isoDate||'').slice(0,10);if(from&&dt<from||to&&dt>to)continue;for(const l of j.lines||[]){if(l.account!==code)continue;if(window.__v54PartyFilter&&String(l.partyName||'').includes(window.__v54PartyFilter)===false)continue;bal+=nn(l.debit)-nn(l.credit);rows.push({j,l,bal})}}return `<div class="panel"><div class="toolbar"><div><b>دفتر معین حساب</b><div class="v54small">مانده تجمیعی: ${fmtm(accountBalance(code,accountTotals(from,to)))}</div></div><div class="right"><select class="select" style="width:300px" onchange="window.__v54AccFilter=this.value;v54Render()">${data.accounting.accounts.map(a=>`<option value="${es(a.code)}" ${a.code===code?'selected':''}>${es(a.code+' · '+a.name)}</option>`).join('')}</select></div></div>${rangeControls()}<div class="pad v54table"><table><tr><th>تاریخ</th><th>شماره</th><th>شرح</th><th>طرف حساب</th><th>بدهکار</th><th>بستانکار</th><th>مانده</th></tr>${rows.reverse().map(x=>`<tr><td>${es(x.j.date||x.j.isoDate)}</td><td>${es(x.j.no)}</td><td>${es(x.j.description)}</td><td>${es(x.l.partyName||'')}</td><td>${x.l.debit?fmtm(x.l.debit):'—'}</td><td>${x.l.credit?fmtm(x.l.credit):'—'}</td><td>${fmtm(x.bal)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">گردشی برای این حساب پیدا نشد.</td></tr>'}</table></div></div>`}
  function pnlPage(){const p=pnl(window.__v54From||'',window.__v54To||isoToday());return `<div class="panel"><div class="toolbar"><b>صورت سود و زیان</b><button class="btn sec" onclick="v54PrintTable('v54Pnl','صورت سود و زیان')">🖨️ چاپ</button></div>${rangeControls()}<div class="pad v54table"><table id="v54Pnl"><tr><th>شرح</th><th>مبلغ</th></tr><tr><td>درآمد فروش کالا</td><td>${fmtm(p.revenues)}</td></tr><tr><td>کاهنده درآمد / برگشت فروش</td><td>${fmtm(p.contra)}</td></tr><tr><td><b>درآمد خالص</b></td><td><b>${fmtm(p.netRevenue)}</b></td></tr><tr><td>کل هزینه‌ها</td><td>${fmtm(p.expenses)}</td></tr><tr><td><b>سود (زیان) دوره</b></td><td class="${p.profit>=0?'v54credit':'v54debit'}"><b>${fmtm(p.profit)}</b></td></tr></table></div></div>`}
  function balancePage(){const b=balanceSheet(window.__v54From||'',window.__v54To||isoToday());const rows=accountRows(window.__v54From||'',window.__v54To||isoToday());return `<div class="v54reportGrid"><div class="panel"><div class="toolbar"><b>دارایی‌ها</b></div><div class="pad v54table"><table id="v54BalanceA"><tr><th>حساب</th><th>مانده</th></tr>${rows.filter(a=>a.type==='asset').map(a=>`<tr><td>${es(a.name)}</td><td>${fmtm(a.balance)}</td></tr>`).join('')}<tr><th>جمع دارایی</th><th>${fmtm(b.asset)}</th></tr></table></div></div><div class="panel"><div class="toolbar"><b>بدهی و حقوق مالکانه</b></div><div class="pad v54table"><table id="v54BalanceB"><tr><th>حساب</th><th>مانده</th></tr>${rows.filter(a=>a.type==='liability'||a.type==='equity').map(a=>`<tr><td>${es(a.name)}</td><td>${fmtm(a.balance)}</td></tr>`).join('')}<tr><td>سود دوره</td><td>${fmtm(b.profit)}</td></tr><tr><th>جمع بدهی + حقوق مالکانه</th><th>${fmtm(b.totalRight)}</th></tr></table></div></div></div><div class="${Math.abs(b.diff)<1?'v54ok':'v54bad'}" style="margin-top:10px">${Math.abs(b.diff)<1?'✅ ترازنامه متوازن است.':'⚠️ ترازنامه متوازن نیست؛ اختلاف '+fmtm(b.diff)}</div>`}
  function opening(){return `<div class="panel"><div class="toolbar"><div><b>ثبت مانده افتتاحیه</b><div class="v54small">مثلاً صندوق افتتاحیه در برابر سرمایه مالک</div></div></div><div class="pad"><div class="notice">برای شروع حسابداری، یک سند افتتاحیه متوازن ثبت کن. خود برنامه مساوی نبودن بدهکار و بستانکار را اجازه نمی‌دهد.</div><div class="actions"><button class="btn blue" onclick="v54OpenManual(true)">+ سند افتتاحیه جدید</button><button class="btn sec" onclick="v54Tab('accounts')">مشاهده کدینگ</button></div></div></div>`}
  function journalDetail(j){if(!j)return alert('سند پیدا نشد');const rows=(j.lines||[]).map(l=>`<tr><td>${es(l.account)}</td><td>${es(codeName(l.account))}</td><td>${es(l.partyName||'')}</td><td>${l.debit?fmtm(l.debit):'—'}</td><td>${l.credit?fmtm(l.credit):'—'}</td></tr>`).join('');modal('سند '+es(j.no),`<div class="miniGrid"><div class="mini">شماره<b>${es(j.no)}</b></div><div class="mini">تاریخ<b>${es(j.date||j.isoDate)}</b></div><div class="mini">نوع<b>${j.type==='auto'?'خودکار':'دستی'}</b></div><div class="mini">شرح<b>${es(j.description)}</b></div></div><div class="tablewrap" style="margin-top:10px"><table><tr><th>کد</th><th>حساب</th><th>طرف حساب</th><th>بدهکار</th><th>بستانکار</th></tr>${rows}</table></div>`)}
  function modal(title,body){document.getElementById('modal').innerHTML=`<div class="modal"><div class="modalbox"><div class="modalhead"><b>${title}</b><button class="close" onclick="closeModal()">×</button></div>${body}</div></div>`}
  function openManual(opening){const date=faToday();let rows=[{account:'101',debit:'',credit:''},{account:'301',debit:'',credit:''}];window.__v54Draft={opening,rows,date,description:opening?'مانده افتتاحیه':'سند حسابداری دستی'};modal(opening?'ثبت سند افتتاحیه':'ثبت سند حسابداری',`<div class="formgrid"><div class="field"><label>تاریخ</label><input id="v54JDate" class="input" value="${es(date)}"></div><div class="field" style="grid-column:span 3"><label>شرح سند</label><input id="v54JDesc" class="input" value="${es(window.__v54Draft.description)}"></div></div><div class="sectionbox" style="margin-top:10px"><h3>ردیف‌های سند</h3><div id="v54Rows" class="v54journalRows"></div><div class="actions"><button class="btn sec" onclick="v54AddRow()">+ افزودن ردیف</button></div></div><div id="v54JPreview" class="hint"></div><div class="actions"><button class="btn green" onclick="v54SaveManual()">ثبت سند</button><button class="btn sec" onclick="closeModal()">انصراف</button></div>`);v54DrawRows();}
  function v54AddRow(){window.__v54Draft.rows.push({account:'101',debit:'',credit:''});v54DrawRows()}
  function v54DrawRows(){const el=document.getElementById('v54Rows');if(!el)return;el.innerHTML=window.__v54Draft.rows.map((r,i)=>`<div class="v54jr"><div class="field"><label>حساب</label><select id="v54ra${i}" class="select" onchange="v54RowUpdate(${i},'account',this.value)">${data.accounting.accounts.map(a=>`<option value="${es(a.code)}" ${r.account===a.code?'selected':''}>${es(a.code+' · '+a.name)}</option>`).join('')}</select></div><div class="field"><label>بدهکار</label><input id="v54rd${i}" class="input" inputmode="numeric" value="${es(r.debit)}" oninput="v54RowUpdate(${i},'debit',this.value);v54Preview()"></div><div class="field"><label>بستانکار</label><input id="v54rc${i}" class="input" inputmode="numeric" value="${es(r.credit)}" oninput="v54RowUpdate(${i},'credit',this.value);v54Preview()"></div><button class="btn red" ${window.__v54Draft.rows.length<=2?'disabled':''} onclick="v54DeleteRow(${i})">×</button></div>`).join('');v54Preview()}
  function v54RowUpdate(i,k,v){window.__v54Draft.rows[i][k]=k==='account'?v:nn(v)}
  function v54DeleteRow(i){window.__v54Draft.rows.splice(i,1);v54DrawRows()}
  function v54Preview(){const d=window.__v54Draft?.rows?.reduce((s,r)=>s+nn(r.debit),0)||0,c=window.__v54Draft?.rows?.reduce((s,r)=>s+nn(r.credit),0)||0;const el=document.getElementById('v54JPreview');if(el)el.innerHTML=Math.abs(d-c)<1?`<span class="v54credit">✅ متوازن: بدهکار ${fmtm(d)} · بستانکار ${fmtm(c)}</span>`:`<span class="v54debit">⚠️ اختلاف ${fmtm(d-c)} · سند هنوز قابل ثبت نیست.</span>`}
  function v54SaveManual(){const dr=window.__v54Draft;if(!dr)return;const rows=(dr.rows||[]).map(r=>({account:String(r.account),debit:nn(r.debit),credit:nn(r.credit)})).filter(r=>r.debit||r.credit);const d=rows.reduce((s,r)=>s+r.debit,0),c=rows.reduce((s,r)=>s+r.credit,0);if(!rows.length)return alert('حداقل دو ردیف ثبت کن');if(rows.some(r=>r.debit&&r.credit))return alert('یک ردیف نمی‌تواند هم‌زمان بدهکار و بستانکار باشد');if(Math.abs(d-c)>0.5)return alert('سند متوازن نیست');if(rows.length<2)return alert('سند حداقل دو ردیف نیاز دارد');const no='J'+String((data.accounting.manualJournals||[]).length+1).padStart(6,'0');const j={id:uidx(),no,isoDate:isoToday(),date:val('v54JDate')||faToday(),type:'manual',source:dr.opening?'opening':'manual',description:val('v54JDesc')||'',lines:rows};data.accounting.manualJournals.push(j);if(dr.opening)data.accounting.settings.openingDone=true;try{audit(dr.opening?'ثبت سند افتتاحیه':'ثبت سند حسابداری دستی',no+' · '+j.description)}catch(e){}closeModal();save();v54Render()}
  function v54Tab(t){window.__v54Tab=t;v54Render()}
  function v54Render(){init();const t=window.__v54Tab||'overview';setTitle('مرکز حسابداری حرفه‌ای');active('accounting');const map={overview:overview,journals:journals,accounts:accounts,trial:trial,ledger:ledger,pnl:pnlPage,balance:balancePage,opening:opening};document.getElementById('content').innerHTML=`<div class="panel">${htmlTabs(t)}</div>`+(map[t]||overview)();}
  function setTitle(t){const e=document.getElementById('title');if(e)e.textContent=t;const s=document.getElementById('subtitle');if(s)s.textContent=data.settings.shopName+' · '+data.settings.address+' · '+data.settings.phone}
  function active(p){document.querySelectorAll('#nav button[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p===p))}
  function v54ApplyFilters(){window.__v54From=(document.getElementById('v54From')?.value||'').trim();window.__v54To=(document.getElementById('v54To')?.value||isoToday()).trim();window.__v54AccFilter=(document.getElementById('v54AccFilter')?.value||window.__v54AccFilter||'101');window.__v54PartyFilter=(document.getElementById('v54PartyFilter')?.value||'').trim();v54Render()}
  function v54ClearFilters(){window.__v54From='';window.__v54To=isoToday();window.__v54PartyFilter='';v54Render()}
  function v54RebuildNotice(){alert('اسناد خودکار آبرنگ از فروش، خرید، خدمات، هزینه و صندوق در زمان گزارش‌گیری بازسازی می‌شوند؛ داده اصلی دست‌کاری نمی‌شود.')}
  function v54ViewJournal(id){const j=allJournals().find(x=>x.id===id);journalDetail(j)}
  function v54VoidJournal(id){const j=(data.accounting.manualJournals||[]).find(x=>x.id===id);if(!j)return;if(confirm('این سند دستی باطل شود؟ سابقه آن حذف نمی‌شود.')){j.status='void';j.voidedAt=new Date().toISOString();try{audit('ابطال سند حسابداری',j.no)}catch(e){}save();v54Render()}}
  function v54NewAccount(){modal('افزودن حساب جدید',`<div class="formgrid"><div class="field"><label>کد</label><input id="v54ac" class="input" placeholder="مثلاً 106"></div><div class="field"><label>نام</label><input id="v54an" class="input" placeholder="مثلاً ودیعه"></div><div class="field"><label>ماهیت</label><select id="v54at" class="select"><option value="asset">دارایی</option><option value="liability">بدهی</option><option value="equity">سرمایه</option><option value="revenue">درآمد</option><option value="contraRevenue">کاهنده درآمد</option><option value="expense">هزینه</option></select></div><div class="field"><label>وضعیت</label><select id="v54aa" class="select"><option value="1">فعال</option><option value="0">غیرفعال</option></select></div></div><div class="actions" style="margin-top:10px"><button class="btn green" onclick="v54SaveAccount()">ذخیره</button><button class="btn sec" onclick="closeModal()">انصراف</button></div>`)}
  function v54EditAccount(code){const a=acc(code);if(a.system)return alert('حساب‌های سیستمی در نسخه ۵۴ کد ثابت دارند؛ نام و ساختارشان در نسخه بعدی قابل سفارشی‌سازی خواهد بود.');modal('ویرایش حساب '+es(code),`<div class="formgrid"><div class="field"><label>نام</label><input id="v54en" class="input" value="${es(a.name)}"></div><div class="field"><label>ماهیت</label><select id="v54et" class="select">${['asset','liability','equity','revenue','contraRevenue','expense'].map(t=>`<option value="${t}" ${a.type===t?'selected':''}>${typeLabel(t)}</option>`).join('')}</select></div></div><div class="actions" style="margin-top:10px"><button class="btn green" onclick="v54UpdateAccount('${es(code)}')">ذخیره</button></div>`)}
  function v54SaveAccount(){const code=String(val('v54ac')||'').trim(),name=String(val('v54an')||'').trim();if(!code||!name)return alert('کد و نام الزامی است');if(data.accounting.accounts.some(a=>String(a.code)===code))return alert('این کد قبلاً ثبت شده است');data.accounting.accounts.push({code,name,type:val('v54at')||'asset',active:val('v54aa')!=='0',system:false});save();closeModal();v54Render()}

<script id="v57script">
(function(){
'use strict';
const V57='57';
function N57(v){try{return typeof n==='function'?n(v):Number(String(v??'').replace(/[٬,]/g,''))||0}catch(e){return Number(v)||0}}
function M57(v){try{return typeof money==='function'?money(v):new Intl.NumberFormat('fa-IR').format(Math.round(N57(v)))+' تومان'}catch(e){return String(Math.round(N57(v)))}}
function E57(v){try{return typeof esc==='function'?esc(v):String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m])}catch(e){return String(v??'')}}
function Q57(v){try{return typeof qty==='function'?qty(v):new Intl.NumberFormat('fa-IR').format(N57(v))}catch(e){return String(v??'')}}
function J57(v){try{return typeof faDate==='function'?faDate(v):String(v||'')}catch(e){return String(v||'')}}
function U57(){try{return uid()}catch(e){return '57_'+Date.now()+'_'+Math.random().toString(36).slice(2,8)}}
function init57(){
  data.warehouse57=data.warehouse57&&typeof data.warehouse57==='object'?data.warehouse57:{};
  if(!Array.isArray(data.warehouse57.warehouses)||!data.warehouse57.warehouses.length)data.warehouse57.warehouses=[{id:'main57',code:'WH-01',name:'انبار اصلی',address:'فروشگاه آبرنگ',active:true}];
  if(!Array.isArray(data.warehouse57.movements))data.warehouse57.movements=[];
  if(!data.warehouse57.balances||typeof data.warehouse57.balances!=='object')data.warehouse57.balances={};
  if(!data.warehouse57.settings)data.warehouse57.settings={valuation:'average',defaultWarehouse:'main57'};
  if(!data.warehouse57.reservations||typeof data.warehouse57.reservations!=='object')data.warehouse57.reservations={};
  if(!data.warehouse57.transit||typeof data.warehouse57.transit!=='object')data.warehouse57.transit={};
  if(!data.warehouse57.seeded){
    const w=data.warehouse57.warehouses[0];
    (data.products||[]).forEach(p=>{const k=w.id+'::'+p.id;if(!data.warehouse57.balances[k])data.warehouse57.balances[k]={onHand:N57(p.stock),reserved:0,inTransit:0}});
    data.warehouse57.seeded=true;
  }
  syncGlobal57();
  data.warehouse57.schemaVersion=57;
}
function wh57(id){return (data.warehouse57.warehouses||[]).find(x=>x.id===id)}
function key57(wid,pid){return String(wid)+'::'+String(pid)}
function bal57(wid,pid){const k=key57(wid,pid);if(!data.warehouse57.balances[k])data.warehouse57.balances[k]={onHand:0,reserved:0,inTransit:0};return data.warehouse57.balances[k]}
function allBalances57(pid){return (data.warehouse57.warehouses||[]).filter(w=>w.active!==false).map(w=>bal57(w.id,pid))}
function totalOnHand57(pid){return allBalances57(pid).reduce((a,x)=>a+N57(x.onHand),0)}
function totalReserved57(pid){return allBalances57(pid).reduce((a,x)=>a+N57(x.reserved),0)}
function totalTransit57(pid){return allBalances57(pid).reduce((a,x)=>a+N57(x.inTransit),0)}
function available57(wid,pid){const b=bal57(wid,pid);return Math.max(0,N57(b.onHand)-N57(b.reserved))}
function syncGlobal57(){
  initNoSync57();
  const def=data.warehouse57.warehouses.find(w=>w.id===data.warehouse57.settings.defaultWarehouse)||data.warehouse57.warehouses[0];
  for(const p of (data.products||[])){
    const total=totalOnHandNoRec57(p.id), diff=N57(p.stock)-total;
    if(Math.abs(diff)>0.000001){const b=balNoRec57(def.id,p.id);b.onHand=N57(b.onHand)+diff;}
  }
}
function initNoSync57(){
  if(!data.warehouse57.warehouses)data.warehouse57.warehouses=[];
}
function balNoRec57(wid,pid){const k=key57(wid,pid);if(!data.warehouse57.balances[k])data.warehouse57.balances[k]={onHand:0,reserved:0,inTransit:0};return data.warehouse57.balances[k]}
function totalOnHandNoRec57(pid){return (data.warehouse57.warehouses||[]).reduce((a,w)=>a+N57(balNoRec57(w.id,pid).onHand),0)}
function recalcProductStock57(pid){const p=(data.products||[]).find(x=>x.id===pid);if(p)p.stock=totalOnHand57(pid)}
function logMove57(x){data.warehouse57.movements.push({...x,id:U57(),isoDate:new Date().toISOString().slice(0,10),date:J57(),createdAt:new Date().toISOString()});if(data.warehouse57.movements.length>5000)data.warehouse57.movements=data.warehouse57.movements.slice(-5000)}
function listWarehouseStats57(){init57();return (data.warehouse57.warehouses||[]).filter(w=>w.active!==false).map(w=>{let units=0,res=0,trans=0,value=0;for(const p of (data.products||[])){const b=bal57(w.id,p.id);units+=N57(b.onHand);res+=N57(b.reserved);trans+=N57(b.inTransit);value+=N57(b.onHand)*N57(p.avgBuy||p.buy||p.cost)}return {...w,units,res,trans,value}})}
function sold30_57(pid){let q=0;const from=Date.now()-30*86400000;for(const s of (data.sales||[]).filter(s=>s.status!=='cancelled')){const d=new Date(s.isoDate||s.date||0).getTime();if(d && d>=from)for(const i of (s.items||[]))if(i.productId===pid)q+=N57(i.qty)}return q}
function fifoValue57(pid,stock){
  let lots=[];for(const pch of (data.purchases||[]))for(const it of (pch.items||[]))if(it.productId===pid){const q=N57(it.qty||it.quantity),price=N57(it.price||it.unitPrice||it.buyPrice||it.cost);if(q>0)lots.push({q,price,date:String(pch.isoDate||pch.date||'')})}
  lots.sort((a,b)=>String(a.date).localeCompare(String(b.date)));let rem=N57(stock),val=0;for(let i=lots.length-1;i>=0&&rem>0;i--){const use=Math.min(rem,lots[i].q);val+=use*lots[i].price;rem-=use}if(rem>0){const p=(data.products||[]).find(x=>x.id===pid);val+=rem*N57(p?.avgBuy||p?.buy||p?.cost)}return val
}
function val57(pid,stock){const p=(data.products||[]).find(x=>x.id===pid);if(!p)return 0;if(data.warehouse57.settings.valuation==='fifo')return fifoValue57(pid,stock);return N57(stock)*N57(p.avgBuy||p.buy||p.cost)}
function low57(p,wid){const b=bal57(wid,p.id);const d=sold30_57(p.id)/30;const min=N57(p.minStock);return N57(b.onHand)<=min || (d>0&&available57(wid,p.id)/d<Math.max(1,N57(p.reorderDays||14))/2)}
function warehouse57Page(){init57();const st=listWarehouseStats57(),prods=data.products||[];const units=st.reduce((a,x)=>a+x.units,0),res=st.reduce((a,x)=>a+x.res,0),tr=st.reduce((a,x)=>a+x.trans,0),val=prods.reduce((a,p)=>a+val57(p.id,totalOnHand57(p.id)),0),low=prods.filter(p=>st.some(w=>low57(p,w.id))).length;
return `<div class="v57Hero"><h2>🏭 انبار حرفه‌ای — نسخه ۵۷</h2><p>مدیریت چند انبار، کاردکس، موجودی رزروشده، کالای در راه، انتقال بین انبارها، نقطه سفارش و ارزش‌گذاری موجودی.</p><div class="v57Actions"><button class="btn green" onclick="v57OpenMove('in')">+ ثبت ورود</button><button class="btn red" onclick="v57OpenMove('out')">− ثبت خروج</button><button class="btn blue" onclick="v57OpenTransfer()">⇄ انتقال بین انبارها</button><button class="btn sec" onclick="v57OpenReserve()">🔒 رزرو کالا</button><button class="btn sec" onclick="v57OpenTransit()">🚚 کالای در راه</button><button class="btn sec" onclick="v57AddWarehouse()">＋ انبار جدید</button></div></div>
<div class="v57KpiGrid"><div class="v57Kpi">کل موجودی<b>${Q57(units)}</b></div><div class="v57Kpi">رزروشده<b>${Q57(res)}</b></div><div class="v57Kpi">در راه<b>${Q57(tr)}</b></div><div class="v57Kpi">ارزش موجودی<b>${M57(val)}</b></div></div>
<div class="v57Tabs"><button class="active" onclick="v57Tab('dashboard')">داشبورد</button><button onclick="v57Tab('kardex')">کاردکس</button><button onclick="v57Tab('warehouses')">انبارها</button><button onclick="v57Tab('stock')">موجودی کالا</button><button onclick="v57Tab('settings')">ارزش‌گذاری و تنظیمات</button></div>
<div class="grid2"><div class="panel"><div class="toolbar"><b>انبارها</b></div><div class="pad">${st.map(x=>`<div class="v57Row"><b>${E57(x.name)}</b><span>${E57(x.code)}</span><span>موجودی: ${Q57(x.units)}</span><span>رزرو: ${Q57(x.res)}</span><span>در راه: ${Q57(x.trans)}</span><b>${M57(x.value)}</b></div>`).join('')||'<div class="empty">انبار فعالی وجود ندارد.</div>'}</div></div><div class="panel"><div class="toolbar"><b>هشدار انبار</b><span class="v57Badge ${low?'o':'g'}">${low?Q57(low)+' کالا نیازمند بررسی':'وضعیت مناسب'}</span></div><div class="pad">${prods.slice(0,18).map(p=>{const w=(data.warehouse57.warehouses||[]).find(x=>low57(p,x.id));return w?`<div class="v57Warn">${E57(p.name)} — ${E57(w.name)} — موجودی ${Q57(bal57(w.id,p.id).onHand)} — حداقل ${Q57(p.minStock)}</div>`:''}).filter(Boolean).join('')||'<div class="v57Ok">هشدار مهمی برای موجودی پیدا نشد.</div>'}</div></div></div>
<div class="panel section"><div class="toolbar"><b>آخرین حرکات انبار</b><div class="v57Actions"><button class="btn sec" onclick="v57Tab('kardex')">کاردکس کامل</button><button class="btn sec" onclick="v57ExportCSV()">📤 خروجی CSV</button></div></div><div class="pad tablewrap"><table><tr><th>تاریخ</th><th>نوع</th><th>انبار</th><th>کالا</th><th>تعداد</th><th>توضیح</th></tr>${(data.warehouse57.movements||[]).slice().reverse().slice(0,20).map(m=>{const p=(data.products||[]).find(x=>x.id===m.productId),w=wh57(m.warehouseId);return `<tr><td>${E57(m.date)}</td><td><span class="tag b">${E57(m.type)}</span></td><td>${E57(w?.name||'—')}</td><td>${E57(p?.name||'—')}</td><td>${Q57(m.qty)}</td><td>${E57(m.note||'')}</td></tr>`}).join('')||'<tr><td colspan="6" class="empty">هنوز حرکتی ثبت نشده است.</td></tr>'}</table></div></div>`}
function stock57Page(){init57();return `<div class="panel"><div class="toolbar"><div><b>📦 موجودی کالا به تفکیک انبار</b><div class="muted">موجودی فیزیکی، رزرو، قابل فروش و ارزش موجودی</div></div><input id="v57StockSearch" class="input" style="max-width:320px" placeholder="جستجوی نام، کد یا بارکد" oninput="v57RenderStock()"></div><div class="pad tablewrap"><table id="v57StockTable"></table></div></div>`}
function v57RenderStock(){init57();const q=String(document.getElementById('v57StockSearch')?.value||'').toLowerCase().trim();const ps=(data.products||[]).filter(p=>!q||[p.name,p.code,p.barcode,p.brand,p.cat].some(v=>String(v||'').toLowerCase().includes(q)));const rows=ps.map(p=>{const ws=(data.warehouse57.warehouses||[]).filter(w=>w.active!==false);const total=totalOnHand57(p.id),res=totalReserved57(p.id),tr=totalTransit57(p.id);return `<tr><td><b>${E57(p.name)}</b><div class="muted">${E57(p.code||'')} · ${E57(p.barcode||'')}</div></td><td>${Q57(total)}</td><td>${Q57(res)}</td><td>${Q57(Math.max(0,total-res))}</td><td>${Q57(tr)}</td><td>${M57(val57(p.id,total))}</td><td>${M57(fifoValue57(p.id,total))}</td><td><button class="btn sec" onclick="v57Kardex('${String(p.id).replace(/'/g,"\\'")}')">کاردکس</button></td></tr>`}).join('');document.getElementById('v57StockTable').innerHTML=`<tr><th>کالا</th><th>موجودی</th><th>رزرو</th><th>قابل فروش</th><th>در راه</th><th>ارزش میانگین</th><th>FIFO تقریبی</th><th>عملیات</th></tr>${rows||'<tr><td colspan="8" class="empty">کالایی پیدا نشد.</td></tr>'}`}
function kardex57Page(pid){init57();const p=(data.products||[]).find(x=>x.id===pid),mov=(data.warehouse57.movements||[]).filter(m=>m.productId===pid).slice().reverse();if(!p)return '<div class="empty">کالا پیدا نشد.</div>';return `<div class="panel"><div class="toolbar"><div><b>📑 کاردکس کالا: ${E57(p.name)}</b><div class="muted">کد ${E57(p.code||'—')} · بارکد ${E57(p.barcode||'—')}</div></div><div class="v57Actions"><button class="btn green" onclick="v57OpenMove('in','${String(pid).replace(/'/g,"\\'")}')">ورود</button><button class="btn red" onclick="v57OpenMove('out','${String(pid).replace(/'/g,"\\'")}')">خروج</button></div></div><div class="pad"><div class="v57KpiGrid"><div class="v57Kpi">کل موجودی<b>${Q57(totalOnHand57(pid))}</b></div><div class="v57Kpi">رزرو<b>${Q57(totalReserved57(pid))}</b></div><div class="v57Kpi">در راه<b>${Q57(totalTransit57(pid))}</b></div><div class="v57Kpi">ارزش FIFO تقریبی<b>${M57(fifoValue57(pid,totalOnHand57(pid)))}</b></div></div><div class="section tablewrap"><table><tr><th>تاریخ</th><th>نوع</th><th>انبار</th><th>قبل</th><th>تعداد</th><th>بعد</th><th>مرجع</th><th>توضیح</th></tr>${mov.map(m=>`<tr><td>${E57(m.date)}</td><td>${E57(m.type)}</td><td>${E57(wh57(m.warehouseId)?.name||'—')}</td><td>${Q57(m.before)}</td><td>${Q57(m.qty)}</td><td>${Q57(m.after)}</td><td>${E57(m.reference||'—')}</td><td>${E57(m.note||'')}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">حرکتی ثبت نشده است.</td></tr>'}</table></div></div></div>`}
function warehouses57Page(){init57();return `<div class="panel"><div class="toolbar"><b>🏭 مدیریت انبارها</b><button class="btn green" onclick="v57AddWarehouse()">+ انبار جدید</button></div><div class="pad tablewrap"><table><tr><th>کد</th><th>نام</th><th>آدرس</th><th>وضعیت</th><th>موجودی</th><th>عملیات</th></tr>${(data.warehouse57.warehouses||[]).map(w=>`<tr><td>${E57(w.code)}</td><td>${E57(w.name)}</td><td>${E57(w.address||'')}</td><td><span class="v57Badge ${w.active!==false?'g':'r'}">${w.active!==false?'فعال':'غیرفعال'}</span></td><td>${Q57((data.products||[]).reduce((a,p)=>a+N57(bal57(w.id,p.id).onHand),0))}</td><td><button class="btn sec" onclick="v57ToggleWarehouse('${w.id}')">${w.active!==false?'غیرفعال‌سازی':'فعال‌سازی'}</button></td></tr>`).join('')}</table></div></div>`}
function settings57Page(){init57();return `<div class="panel"><div class="toolbar"><b>⚙️ تنظیمات ارزش‌گذاری و انبار</b></div><div class="pad"><div class="v57Form"><div class="field"><label>روش ارزش‌گذاری</label><select id="v57Valuation" class="select" onchange="v57SaveSettings()"><option value="average" ${data.warehouse57.settings.valuation==='average'?'selected':''}>میانگین موزون</option><option value="fifo" ${data.warehouse57.settings.valuation==='fifo'?'selected':''}>FIFO</option></select></div><div class="field"><label>انبار پیش‌فرض</label><select id="v57DefaultWh" class="select" onchange="v57SaveSettings()">${(data.warehouse57.warehouses||[]).map(w=>`<option value="${w.id}" ${w.id===data.warehouse57.settings.defaultWarehouse?'selected':''}>${E57(w.name)}</option>`).join('')}</select></div></div><div class="v57Info" style="margin-top:12px">ارزش میانگین از قیمت خرید میانگین کالا استفاده می‌کند. FIFO در این نسخه بر اساس سوابق خرید موجود، یک ارزش تقریبی برای موجودی پایانی محاسبه می‌کند و برای ثبت حسابداری قطعی، بعداً به لایه بهای تمام‌شده متصل خواهد شد.</div></div></div>`}
function addWarehouse57(){modal('افزودن انبار',`<div class="v57Form"><div class="field"><label>کد</label><input id="v57WhCode" class="input" value="WH-${String((data.warehouse57.warehouses||[]).length+1).padStart(2,'0')}"></div><div class="field"><label>نام انبار</label><input id="v57WhName" class="input" placeholder="مثلاً انبار پشتیبان"></div><div class="field v57Wide"><label>آدرس/توضیح</label><input id="v57WhAddr" class="input"></div></div><div class="actions" style="margin-top:10px"><button class="btn green" onclick="v57SaveWarehouse()">ذخیره</button><button class="btn sec" onclick="closeModal()">انصراف</button></div>`)}
function saveWarehouse57(){const code=String(document.getElementById('v57WhCode')?.value||'').trim(),name=String(document.getElementById('v57WhName')?.value||'').trim();if(!code||!name)return alert('کد و نام انبار الزامی است');const w={id:U57(),code,name,address:String(document.getElementById('v57WhAddr')?.value||''),active:true};data.warehouse57.warehouses.push(w);data.warehouse57.settings.defaultWarehouse ||= w.id;save();closeModal();v57Tab('warehouses')}
function moveForm57(kind,pid=''){init57();const dir=kind==='in'?'ورود':'خروج';return `<div class="v57Form"><div class="field"><label>انبار</label><select id="v57MoveWh" class="select">${(data.warehouse57.warehouses||[]).filter(w=>w.active!==false).map(w=>`<option value="${w.id}">${E57(w.name)}</option>`).join('')}</select></div><div class="field v57Wide"><label>کالا</label><select id="v57MovePid" class="select">${(data.products||[]).map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${E57(p.name)} — موجودی کل ${Q57(totalOnHand57(p.id))}</option>`).join('')}</select></div><div class="field"><label>تعداد</label><input id="v57MoveQty" class="input" inputmode="numeric" value="1"></div><div class="field"><label>مرجع</label><input id="v57MoveRef" class="input" placeholder="شماره خرید/سند"></div><div class="field v57Wide"><label>توضیح</label><input id="v57MoveNote" class="input" placeholder="شرح حرکت انبار"></div></div><div class="actions" style="margin-top:10px"><button class="btn ${kind==='in'?'green':'red'}" onclick="v57CommitMove('${kind}')">ثبت ${dir}</button><button class="btn sec" onclick="closeModal()">انصراف</button></div>`}
function openMove57(kind,pid=''){modal(kind==='in'?'ثبت ورود انبار':'ثبت خروج انبار',moveForm57(kind,pid))}
function commitMove57(kind){try{init57();const wid=String(document.getElementById('v57MoveWh')?.value||''),pid=String(document.getElementById('v57MovePid')?.value||''),q=N57(document.getElementById('v57MoveQty')?.value),ref=String(document.getElementById('v57MoveRef')?.value||''),note=String(document.getElementById('v57MoveNote')?.value||'');if(!wid||!pid||q<=0)throw new Error('انبار، کالا و تعداد معتبر الزامی است');const b=bal57(wid,pid),before=N57(b.onHand),after=kind==='in'?before+q:before-q;if(kind==='out'&&q>available57(wid,pid))throw new Error('موجودی قابل فروش این انبار کافی نیست');b.onHand=after;recalcProductStock57(pid);logMove57({type:kind==='in'?'ورود':'خروج',warehouseId:wid,productId:pid,qty:q,before,after,reference:ref,note});audit?.('حرکت انبار ۵۷',(kind==='in'?'ورود ':'خروج ')+pid+' · '+q);save();closeModal();v57Tab('dashboard');}catch(e){alert(e.message||'ثبت حرکت ناموفق بود')}}
function openTransfer57(){init57();modal('انتقال بین انبارها',`<div class="v57Form"><div class="field"><label>از انبار</label><select id="v57FromWh" class="select">${(data.warehouse57.warehouses||[]).filter(w=>w.active!==false).map(w=>`<option value="${w.id}">${E57(w.name)}</option>`).join('')}</select></div><div class="field"><label>به انبار</label><select id="v57ToWh" class="select">${(data.warehouse57.warehouses||[]).filter(w=>w.active!==false).map(w=>`<option value="${w.id}">${E57(w.name)}</option>`).join('')}</select></div><div class="field v57Wide"><label>کالا</label><select id="v57TransPid" class="select">${(data.products||[]).map(p=>`<option value="${p.id}">${E57(p.name)}</option>`).join('')}</select></div><div class="field"><label>تعداد</label><input id="v57TransQty" class="input" inputmode="numeric" value="1"></div><div class="field v57Wide"><label>توضیح</label><input id="v57TransNote" class="input"></div></div><div class="actions" style="margin-top:10px"><button class="btn blue" onclick="v57CommitTransfer()">ثبت انتقال</button><button class="btn sec" onclick="closeModal()">انصراف</button></div>`)}
function commitTransfer57(){try{const f=String(document.getElementById('v57FromWh')?.value||''),t=String(document.getElementById('v57ToWh')?.value||''),pid=String(document.getElementById('v57TransPid')?.value||''),q=N57(document.getElementById('v57TransQty')?.value),note=String(document.getElementById('v57TransNote')?.value||'');if(!f||!t||f===t)throw new Error('مبدأ و مقصد باید متفاوت باشند');if(q<=0)throw new Error('تعداد معتبر نیست');if(q>available57(f,pid))throw new Error('موجودی قابل انتقال کافی نیست');const bf=bal57(f,pid),bt=bal57(t,pid),beforeF=N57(bf.onHand),beforeT=N57(bt.onHand);bf.onHand-=q;bt.onHand+=q;const ref='TR-'+Date.now();logMove57({type:'انتقال خروج',warehouseId:f,productId:pid,qty:q,before:beforeF,after:bf.onHand,reference:ref,note});logMove57({type:'انتقال ورود',warehouseId:t,productId:pid,qty:q,before:beforeT,after:bt.onHand,reference:ref,note});recalcProductStock57(pid);audit?.('انتقال بین انبارها ۵۷',ref+' · '+q);save();closeModal();v57Tab('dashboard')}catch(e){alert(e.message||'انتقال ناموفق بود')}}
function reserveForm57(){init57();return `<div class="v57Form"><div class="field"><label>انبار</label><select id="v57ResWh" class="select">${(data.warehouse57.warehouses||[]).filter(w=>w.active!==false).map(w=>`<option value="${w.id}">${E57(w.name)}</option>`).join('')}</select></div><div class="field v57Wide"><label>کالا</label><select id="v57ResPid" class="select">${(data.products||[]).map(p=>`<option value="${p.id}">${E57(p.name)}</option>`).join('')}</select></div><div class="field"><label>تعداد رزرو</label><input id="v57ResQty" class="input" inputmode="numeric" value="1"></div><div class="field"><label>نوع</label><select id="v57ResType" class="select"><option value="reserve">رزرو</option><option value="release">آزادسازی رزرو</option></select></div></div><div class="actions" style="margin-top:10px"><button class="btn green" onclick="v57CommitReserve()">ثبت</button><button class="btn sec" onclick="closeModal()">انصراف</button></div>`}
function openReserve57(){modal('رزرو / آزادسازی کالا',reserveForm57())}
function commitReserve57(){try{const wid=String(document.getElementById('v57ResWh')?.value||''),pid=String(document.getElementById('v57ResPid')?.value||''),q=N57(document.getElementById('v57ResQty')?.value),type=document.getElementById('v57ResType')?.value||'reserve';const b=bal57(wid,pid);if(q<=0)throw new Error('تعداد معتبر نیست');if(type==='reserve'){if(q>available57(wid,pid))throw new Error('موجودی قابل رزرو کافی نیست');b.reserved=N57(b.reserved)+q}else{if(q>N57(b.reserved))throw new Error('رزرو کافی برای آزادسازی وجود ندارد');b.reserved=N57(b.reserved)-q}logMove57({type:type==='reserve'?'رزرو':'آزادسازی رزرو',warehouseId:wid,productId:pid,qty:q,before:N57(b.reserved)+(type==='reserve'?-q:q),after:N57(b.reserved),reference:'RES-'+Date.now(),note:'رزرو موجودی'});save();closeModal();v57Tab('dashboard')}catch(e){alert(e.message||'ثبت رزرو ناموفق بود')}}
function transitForm57(){init57();return `<div class="v57Form"><div class="field"><label>انبار</label><select id="v57TrWh" class="select">${(data.warehouse57.warehouses||[]).filter(w=>w.active!==false).map(w=>`<option value="${w.id}">${E57(w.name)}</option>`).join('')}</select></div><div class="field v57Wide"><label>کالا</label><select id="v57TrPid" class="select">${(data.products||[]).map(p=>`<option value="${p.id}">${E57(p.name)}</option>`).join('')}</select></div><div class="field"><label>تعداد</label><input id="v57TrQty" class="input" inputmode="numeric" value="1"></div><div class="field"><label>عملیات</label><select id="v57TrType" class="select"><option value="add">افزایش در راه</option><option value="receive">دریافت از راه</option></select></div></div><div class="actions" style="margin-top:10px"><button class="btn blue" onclick="v57CommitTransit()">ثبت</button><button class="btn sec" onclick="closeModal()">انصراف</button></div>`}
function openTransit57(){modal('کالای در راه',transitForm57())}
function commitTransit57(){try{const wid=String(document.getElementById('v57TrWh')?.value||''),pid=String(document.getElementById('v57TrPid')?.value||''),q=N57(document.getElementById('v57TrQty')?.value),type=document.getElementById('v57TrType')?.value||'add';const b=bal57(wid,pid);if(q<=0)throw new Error('تعداد معتبر نیست');if(type==='add')b.inTransit=N57(b.inTransit)+q;else{if(q>N57(b.inTransit))throw new Error('موجودی در راه کافی نیست');b.inTransit-=q;b.onHand=N57(b.onHand)+q;recalcProductStock57(pid)}logMove57({type:type==='add'?'افزایش در راه':'دریافت کالای در راه',warehouseId:wid,productId:pid,qty:q,before:type==='add'?N57(b.inTransit)-q:N57(b.onHand)-q,after:type==='add'?N57(b.inTransit):N57(b.onHand),reference:'TRN-'+Date.now(),note:'کالای در راه'});save();closeModal();v57Tab('dashboard')}catch(e){alert(e.message||'ثبت کالای در راه ناموفق بود')}}
function toggleWarehouse57(id){const w=wh57(id);if(!w)return;if(data.warehouse57.warehouses.filter(x=>x.active!==false).length<=1&&w.active!==false)return alert('حداقل یک انبار باید فعال بماند');w.active=w.active===false;save();v57Tab('warehouses')}
function saveSettings57(){init57();data.warehouse57.settings.valuation=document.getElementById('v57Valuation')?.value||'average';data.warehouse57.settings.defaultWarehouse=document.getElementById('v57DefaultWh')?.value||data.warehouse57.settings.defaultWarehouse;save()}
function exportCSV57(){init57();const h=['کد کالا','نام کالا','انبار','موجودی','رزرو','قابل فروش','در راه','ارزش میانگین','FIFO تقریبی'];const rows=[];for(const p of (data.products||[]))for(const w of (data.warehouse57.warehouses||[])){const b=bal57(w.id,p.id);rows.push([p.code,p.name,w.name,b.onHand,b.reserved,Math.max(0,N57(b.onHand)-N57(b.reserved)),b.inTransit,val57(p.id,b.onHand),fifoValue57(p.id,b.onHand)])}const csv='\ufeff'+[h,...rows].map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='abrang-warehouse-v57.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function tab57(t,pid){window.__v57Tab=t;window.__v57Pid=pid||window.__v57Pid||'';render57()}
function set57Title(t){const e=document.getElementById('title');if(e)e.textContent=t}function active57(){document.querySelectorAll('#nav button[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p==='warehouse57'))}
function render57(){init57();ensureNav57();const t=window.__v57Tab||'dashboard';if(t==='dashboard'){set57Title('🏭 انبار حرفه‌ای ۵۷');active57();document.getElementById('content').innerHTML=warehouse57Page();return}if(t==='kardex'){set57Title('📑 کاردکس انبار');active57();document.getElementById('content').innerHTML=window.__v57Pid?kardex57Page(window.__v57Pid):`<div class="panel"><div class="pad"><div class="field"><label>انتخاب کالا</label><select id="v57KardexPick" class="select">${(data.products||[]).map(p=>`<option value="${p.id}">${E57(p.name)}</option>`).join('')}</select></div><div class="actions" style="margin-top:10px"><button class="btn" onclick="v57ShowKardex()">نمایش کاردکس</button></div></div></div>`;return}if(t==='warehouses'){set57Title('🏭 انبارها');active57();document.getElementById('content').innerHTML=warehouses57Page();return}if(t==='stock'){set57Title('📦 موجودی کالا');active57();document.getElementById('content').innerHTML=stock57Page();setTimeout(v57RenderStock,0);return}set57Title('⚙️ تنظیمات انبار');active57();document.getElementById('content').innerHTML=settings57Page()}
function showKardex57(){const id=document.getElementById('v57KardexPick')?.value||'';if(id)tab57('kardex',id)}
function ensureNav57(){const nav=document.getElementById('nav');if(!nav)return;if(!nav.querySelector('button[data-p="warehouse57"]')){const b=document.createElement('button');b.type='button';b.dataset.p='warehouse57';b.textContent='🏭 انبار حرفه‌ای ۵۷';b.onclick=()=>tab57('dashboard');nav.appendChild(b)}}
window.v57Tab=tab57;window.v57ShowKardex=showKardex57;window.v57Kardex=(id)=>tab57('kardex',id);window.v57OpenMove=openMove57;window.v57CommitMove=commitMove57;window.v57OpenTransfer=openTransfer57;window.v57CommitTransfer=commitTransfer57;window.v57OpenReserve=openReserve57;window.v57CommitReserve=commitReserve57;window.v57OpenTransit=openTransit57;window.v57CommitTransit=commitTransit57;window.v57AddWarehouse=addWarehouse57;window.v57SaveWarehouse=saveWarehouse57;window.v57ToggleWarehouse=toggleWarehouse57;window.v57SaveSettings=saveSettings57;window.v57ExportCSV=exportCSV57;window.v57RenderStock=v57RenderStock;
init57();ensureNav57();
const oldRender57=window.render;
window.render=function(){if(page==='warehouse57'){render57();return}if(typeof oldRender57==='function')return oldRender57.apply(this,arguments)};

(--red);background:#fff8f8}.v62Insight.watch{border-right:4px solid var(--orange);background:#fffcf6}.v62Insight.good{border-right:4px solid var(--green);background:#f8fffa}.v62Insight b{font-size:11px}.v62Insight p{margin:4px 0 0;font-size:10px;line-height:1.85;color:#475467}.v62Chip{display:inline-block;border-radius:999px;padding:3px 7px;font-size:9px;font-weight:800;background:#f2f4f7;color:#475467}.v62Chip.a{background:#eef2ff;color:#3730a3}.v62Chip.b{background:#eff6ff;color:#1d4ed8}.v62Chip.c{background:#fff7ed;color:#9a3412}.v62Chip.bad{background:#fef2f2;color:#b42318}.v62Chip.ok{background:#ecfdf3;color:#166534}.v62Mono{font-family:Consolas,monospace;direction:ltr}.v62Note{padding:9px 11px;border:1px dashed #c7d2fe;border-radius:10px;background:#eef2ff;color:#3730a3;font-size:10px;line-height:1.8}.v62Empty{padding:26px;text-align:center;color:var(--muted)}

<script id="abrangV62Smart">
(function(){
'use strict';
const E=window.ABRANG62_ENGINE; const V62='62.0'; const STORE62='abrang_smart62_v1';
let tab62='overview'; let state62=null;
function n62(v){return Number(v)||0}
function m62(v){try{return typeof money==='function'?money(v):new Intl.NumberFormat('fa-IR').format(Math.round(n62(v)))+' تومان'}catch(e){return String(v)} }
function q62(v){try{return typeof qty==='function'?qty(v):new Intl.NumberFormat('fa-IR').format(n62(v))}catch(e){return String(v)} }
function f62(v,d=1){return n62(v).toLocaleString('fa-IR',{maximumFractionDigits:d})}
function esc62(v){try{return typeof esc==='function'?esc(v):String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}catch(e){return String(v??'')}}
function load62(){try{return JSON.parse(localStorage.getItem(STORE62)||'null')}catch(e){return null}}
function init62(){state62=load62()||{range:30,forecastDays:14,deadDays:45,discountWarn:15,anomalySigma:2.2,lastAt:null,pinned:[]};state62=Object.assign({range:30,forecastDays:14,deadDays:45,discountWarn:15,anomalySigma:2.2,lastAt:null,pinned:[]},state62);localStorage.setItem(STORE62,JSON.stringify(state62));return state62}
function save62(){localStorage.setItem(STORE62,JSON.stringify(state62))}
function current62(){if(!state62)state62=init62();return state62}
function guard62(){return !!window.v60SessionReady&&window.v60SessionReady()&&(!window.v60HasOp||window.v60HasOp('op.analytics.view'))}
function ensurePerm62(){try{const sec=data.security60;if(!sec||!sec.roles)return;const perms=['page.smart62','op.analytics.view'];['manager','accountant'].forEach(r=>{if(!Array.isArray(sec.roles[r]))sec.roles[r]=[];perms.forEach(p=>{if(!sec.roles[r].includes(p))sec.roles[r].push(p)})});if(typeof localStorage!=='undefined')localStorage.setItem('abrang_accounting_v13',JSON.stringify(data));}catch(e){}}
function open62(){if(!guard62()){alert('برای استفاده از هوش فروشگاه ۶۲ مجوز تحلیل مدیریتی لازم است.');return}page='smart62';tab62='overview';render62()}
function setTab62(t){if(!guard62())return;tab62=t;render62()}
function range62(){return Math.max(7,Math.min(365,n62(document.getElementById('v62Range')?.value)||current62().range||30))}
function dataset62(){return (typeof data==='object'&&data)?data:{products:[],sales:[],parties:[],purchases:[],serviceSales:[],expenses:[],cash:[]}}
function analysis62(){const d=dataset62(),st=current62(),days=st.range;const today=E.todayISO62?E.todayISO62():new Date().toISOString().slice(0,10);const series=E.dailySeries(d,days,today);const stats=E.stats(d,days,today);const products=E.abc(E.productMetrics(d,days,today));const customers=E.customerMetrics(d,days,today);const forecast=E.forecast(series,st.forecastDays);const anomalies=E.anomalies(series,st.anomalySigma);const low=products.filter(x=>x.stock<=x.minStock);const dead=products.filter(x=>x.stock>0&&(!x.lastDate||x.units===0||x.coverage===Infinity||E.daysBetween(x.lastDate,today)>=st.deadDays));const reorder=products.map(x=>Object.assign({},x,{target:Math.ceil(x.avgDaily*(Math.max(7,n62(data.settings?.reorderLeadDays)||14)+7)),suggested:Math.max(0,Math.ceil(x.avgDaily*(Math.max(7,n62(data.settings?.reorderLeadDays)||14)+7)-x.stock))})).filter(x=>x.suggested>0).sort((a,b)=>b.suggested-a.suggested);const marginLow=products.filter(x=>x.revenue>0&&x.margin<10).sort((a,b)=>a.margin-b.margin);const noMargin=products.filter(x=>x.units>0&&x.profit<=0);const discountSales=(E.filterSales(d,days,today)).filter(s=>{const base=n62(s.subtotal)||n62(s.total);return base>0&&(n62(s.discount)/base*100)>=st.discountWarn});const cSeg={};customers.forEach(c=>cSeg[c.segment]=(cSeg[c.segment]||0)+1);const pay=stats.pay||{};const totalPay=Object.values(pay).reduce((a,x)=>a+n62(x),0)||1;return {today,days,series,stats,products,customers,forecast,anomalies,low,dead,reorder,marginLow,noMargin,discountSales,cSeg,pay,totalPay}}
function tone62(type){return type==='urgent'?'urgent':type==='good'?'good':'watch'}
function trend62(a){if(!a||!Array.isArray(a.series)||a.series.length<14)return null;const recent=a.series.slice(-7).reduce((x,y)=>x+y.sales,0);const prev=a.series.slice(-14,-7).reduce((x,y)=>x+y.sales,0);if(prev<=0)return null;return (recent/prev-1)*100}
function insights62(a){const out=[];if(a.low.length)out.push({t:'urgent',title:'کمبود موجودی',text:`${q62(a.low.length)} کالا در محدوده کم‌موجودی یا زیر حداقل قرار دارد. ابتدا کالاهایی را بررسی کن که فروش روزانه بالاتر و پوشش کمتر دارند.`});if(a.dead.length)out.push({t:'watch',title:'سرمایه خوابیده',text:`${q62(a.dead.length)} کالا موجودی دارند اما در ${q62(current62().deadDays)} روز اخیر گردش کافی نداشته‌اند. قیمت، چیدمان، دسته‌بندی یا فروش ترکیبی آنها را بازبینی کن.`});if(a.marginLow.length)out.push({t:'watch',title:'حاشیه سود پایین',text:`${q62(a.marginLow.length)} کالا حاشیه سود زیر ۱۰٪ دارند. قیمت خرید جدید، قیمت فروش و تخفیف‌های ثبت‌شده را بررسی کن.`});if(a.noMargin.length)out.push({t:'urgent',title:'فروش کم‌سود یا زیان‌ده',text:`${q62(a.noMargin.length)} کالا در بازه انتخاب‌شده با سود صفر/منفی دیده شده‌اند. قبل از فروش بعدی قیمت و هزینه واقعی آنها را کنترل کن.`});if(a.discountSales.length)out.push({t:'watch',title:'تخفیف‌های قابل بررسی',text:`${q62(a.discountSales.length)} فاکتور تخفیفی در این بازه از آستانه ${f62(current62().discountWarn)}٪ عبور کرده‌اند.`});if(a.anomalies.length)out.push({t:'good',title:'روزهای فروش غیرمعمول',text:`${q62(a.anomalies.length)} روز با فروش به‌طور غیرعادی بالاتر از الگوی معمول شناسایی شد. این روزها را برای بررسی کمپین، مناسبت یا خرید عمده نگه دار.`});const trend=trend62(a);if(trend!==null&&trend<=-15)out.push({t:'urgent',title:'افت روند فروش',text:`فروش هفت روز اخیر حدود ${f62(Math.abs(trend))}٪ پایین‌تر از هفت روز قبل است. علت افت را از کالا، مشتری، ساعت/روز فروش یا موجودی دنبال کن.`});if(!out.length)out.push({t:'good',title:'وضعیت پایدار',text:'در بازه انتخاب‌شده هشدار مهمی از قواعد فعلی تحلیل‌گر داخلی پیدا نشد. داده را مرتباً به‌روزرسانی کن تا الگوها قابل اتکاتر شوند.'});return out.slice(0,8)}
function lineChart62(values,label,moneyMode=true){if(!values.length)return '<div class="v62Empty">داده کافی برای نمودار وجود ندارد.</div>';const w=760,h=250,pad=34;const max=Math.max(...values,1),min=Math.min(...values,0);const pts=values.map((v,i)=>{const x=pad+i*(w-pad*2)/Math.max(1,values.length-1);const y=h-pad-(v-min)/(max-min||1)*(h-pad*2);return [x,y]});const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');const area='M '+pts[0][0]+' '+(h-pad)+' '+pts.map(p=>'L '+p[0]+' '+p[1]).join(' ')+' L '+pts[pts.length-1][0]+' '+(h-pad)+' Z';const grid=[0,.25,.5,.75,1].map(r=>{const y=pad+r*(h-pad*2);const val=max-(max-min)*r;return `<line x1="${pad}" x2="${w-pad}" y1="${y}" y2="${y}" stroke="#e5e7eb" stroke-width="1"/><text x="${w-pad+3}" y="${y+4}" font-size="9" fill="#667085">${moneyMode?esc62(m62(val)):esc62(f62(val))}</text>`}).join('');const labels=[0,Math.floor(values.length/2),values.length-1].filter((v,i,a)=>a.indexOf(v)===i).map(i=>`<text x="${pts[i][0]}" y="${h-7}" text-anchor="middle" font-size="9" fill="#667085">${esc62(values[i].date||'')}</text>`).join('');return `<svg class="v62Chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc62(label)}">${grid}<path d="${area}" fill="#eef2ff"></path><path d="${path}" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>${pts.slice(-7).map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="#4f46e5"></circle>`).join('')}${labels}</svg>`}
function kpi62(label,val,sub=''){return `<div class="v62Card"><div class="lab">${esc62(label)}</div><div class="big">${val}</div><div class="sub">${esc62(sub)}</div></div>`}
function overview62(a){const trend=trend62(a);const actions=insights62(a);const top=a.products.filter(x=>x.units>0).slice().sort((x,y)=>y.revenue-x.revenue).slice(0,8);const seg=Object.entries(a.cSeg).sort((x,y)=>y[1]-x[1]);return `<div class="v62Hero" dir="rtl"><h2>🧠 هوش فروشگاه آبرنگ ۶۲</h2><p>تحلیل‌گر داخلی آبرنگ بر پایه فروش، سود، موجودی، مشتری، پرداخت و روندهای ثبت‌شده کار می‌کند. تحلیل‌ها آفلاین هستند و هیچ داده‌ای به سرویس هوش مصنوعی خارجی ارسال نمی‌شود.</p><div class="actions" style="margin-top:11px"><button class="btn green" onclick="window.v62Refresh()">↻ به‌روزرسانی تحلیل</button><button class="btn blue" onclick="window.v62Export('overview')">📥 خروجی تحلیل</button><button class="btn sec" onclick="go('pos')">فروش سریع</button><button class="btn sec" onclick="go('smartbuy')">خرید هوشمند</button></div></div><div class="panel"><div class="v62Toolbar"><div class="v62Filters"><span class="muted">بازه تحلیل</span><select id="v62Range" class="select" onchange="window.v62ApplyRange(this.value)"><option value="7" ${a.days===7?'selected':''}>۷ روز</option><option value="30" ${a.days===30?'selected':''}>۳۰ روز</option><option value="90" ${a.days===90?'selected':''}>۹۰ روز</option><option value="180" ${a.days===180?'selected':''}>۱۸۰ روز</option><option value="365" ${a.days===365?'selected':''}>۳۶۵ روز</option></select><span class="muted">پیش‌بینی</span><select id="v62Forecast" class="select" onchange="window.v62ApplyForecast(this.value)"><option value="7" ${current62().forecastDays===7?'selected':''}>۷ روز</option><option value="14" ${current62().forecastDays===14?'selected':''}>۱۴ روز</option><option value="30" ${current62().forecastDays===30?'selected':''}>۳۰ روز</option></select></div><div class="muted">آخرین تحلیل: ${esc62(current62().lastAt||'—')}</div></div></div><div class="section v62Grid">${kpi62('فروش خالص',m62(a.stats.sales),`بازۀ ${q62(a.days)} روز`)}${kpi62('سود خالص',m62(a.stats.profit),`حاشیه ${f62(a.stats.margin)}٪`)}${kpi62('تعداد فاکتور',q62(a.stats.count),`میانگین ${m62(a.stats.avgInvoice)}`)}${kpi62('تعداد اقلام',q62(a.stats.units),'واحد فروخته‌شده')}${kpi62('کم‌موجودی',q62(a.stats.low),'کالا نیازمند بررسی')}${kpi62('مطالبات مشتریان',m62(a.stats.receivables),'مانده فعلی')}</div><div class="section v62Grid2"><div class="panel"><div class="toolbar"><b>📈 روند فروش روزانه</b><span class="tag ${trend!==null&&trend<0?'r':'g'}">${trend===null?'مقایسه کافی نیست':`${trend>=0?'+':''}${f62(trend)}٪ نسبت به هفت روز قبل`}</span></div><div class="pad">${lineChart62(a.series,'فروش روزانه',true)}</div></div><div class="panel"><div class="toolbar"><b>💡 پیشنهادهای هوشمند</b><span class="shortcut">Rule-based</span></div><div class="pad">${actions.map(x=>`<div class="v62Insight ${tone62(x.t)}"><b>${esc62(x.title)}</b><p>${esc62(x.text)}</p></div>`).join('')}</div></div></div><div class="section v62Grid2"><div class="panel"><div class="toolbar"><b>🏆 محصولات پربازده در بازه</b><button class="btn sec" onclick="window.v62Tab('products')">تحلیل کالا</button></div><div class="pad">${top.length?top.map((x,i)=>`<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;font-size:10px"><span>${esc62(x.name)}</span><b>${m62(x.revenue)}</b></div><div class="v62Bar"><i style="width:${top[0].revenue?Math.max(4,Math.round(x.revenue/top[0].revenue*100)):0}%"></i></div><div class="muted" style="margin-top:3px">${q62(x.units)} واحد · سود ${m62(x.profit)} · حاشیه ${f62(x.margin)}٪</div></div>`).join(''):'<div class="v62Empty">فروشی برای تحلیل کالا وجود ندارد.</div>'}</div></div><div class="panel"><div class="toolbar"><b>👥 وضعیت مشتریان</b><button class="btn sec" onclick="window.v62Tab('customers')">تحلیل مشتری</button></div><div class="pad">${seg.length?seg.map(([name,count])=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eef2f6;font-size:10px"><span>${esc62(name)}</span><b>${q62(count)}</b></div>`).join(''):'<div class="v62Empty">داده مشتری کافی نیست.</div>'}<div class="v62Note" style="margin-top:10px">بخش‌بندی مشتری بر اساس تازه‌بودن خرید، تکرار خرید و مبلغ خرید در بازه انتخاب‌شده محاسبه می‌شود.</div></div></div></div>`}
function products62(a){const rows=a.products.slice().sort((x,y)=>y.revenue-x.revenue).slice(0,200);return `<div class="v62Section"><div class="v62Toolbar"><div><b>📦 تحلیل کالاها</b><div class="muted">ABC، گردش، حاشیه سود، پوشش موجودی و پیشنهاد سفارش</div></div><button class="btn blue" onclick="window.v62Export('products')">خروجی CSV</button></div><div class="v62Pad"><div class="v62Note">ABC بر اساس سهم تجمعی فروش محاسبه می‌شود: A تا حدود ۸۰٪، B تا حدود ۹۵٪ و C بقیه. «پیشنهاد سفارش» فقط یک محاسبۀ داخلی بر مبنای فروش روزانه و موجودی فعلی است.</div></div><div class="tablewrap"><table><tr><th>کالا</th><th>گروه</th><th>ABC</th><th>فروش</th><th>سود</th><th>حاشیه</th><th>واحد</th><th>موجودی</th><th>پوشش</th><th>پیشنهاد سفارش</th><th>وضعیت</th></tr>${rows.map(x=>{const cov=x.coverage===Infinity?'∞':f62(x.coverage,1)+' روز';const status=x.stock<=x.minStock?'کم‌موجودی':x.units===0?'بدون گردش':x.profit<=0?'سود صفر/منفی':x.margin<10?'حاشیه پایین':'عادی';return `<tr><td><b>${esc62(x.name)}</b></td><td>${esc62(x.cat)}</td><td><span class="v62Chip ${x.abc==='A'?'a':x.abc==='B'?'b':'c'}">${x.abc}</span></td><td>${m62(x.revenue)}</td><td>${m62(x.profit)}</td><td>${f62(x.margin)}٪</td><td>${q62(x.units)}</td><td>${q62(x.stock)}</td><td>${cov}</td><td>${q62(x.suggested||0)}</td><td><span class="v62Chip ${status==='عادی'?'ok':'bad'}">${status}</span></td></tr>`}).join('')||'<tr><td colspan="11" class="v62Empty">کالایی برای تحلیل وجود ندارد.</td></tr>'}</table></div></div>`}
function inventory62(a){const top=a.reorder.slice(0,40),dead=a.dead.slice().sort((x,y)=>y.stock-x.stock).slice(0,40);return `<div class="v62Grid3"><div class="panel"><div class="toolbar"><b>⚠️ کم‌موجودی</b><span class="tag r">${q62(a.low.length)}</span></div><div class="pad">${a.low.slice(0,20).map(x=>`<div class="v62Insight urgent"><b>${esc62(x.name)}</b><p>موجودی ${q62(x.stock)} · حداقل ${q62(x.minStock)} · فروش روزانه ${f62(x.avgDaily)} واحد</p></div>`).join('')||'<div class="v62Empty">کم‌موجودی مهمی ثبت نشده است.</div>'}</div></div><div class="panel"><div class="toolbar"><b>🛒 پیشنهاد سفارش</b><span class="tag o">${q62(top.length)}</span></div><div class="pad">${top.map(x=>`<div style="padding:8px 0;border-bottom:1px solid #eef2f6"><div style="display:flex;justify-content:space-between;font-size:10px"><b>${esc62(x.name)}</b><span>${q62(x.suggested)} واحد</span></div><div class="muted">فروش روزانه ${f62(x.avgDaily)} · موجودی ${q62(x.stock)} · پوشش ${x.coverage===Infinity?'∞':f62(x.coverage)} روز</div></div>`).join('')||'<div class="v62Empty">پیشنهاد سفارشی ایجاد نشده است.</div>'}</div></div><div class="panel"><div class="toolbar"><b>💤 کالاهای کم‌گردش</b><span class="tag o">${q62(dead.length)}</span></div><div class="pad">${dead.map(x=>`<div style="padding:8px 0;border-bottom:1px solid #eef2f6"><div style="display:flex;justify-content:space-between;font-size:10px"><b>${esc62(x.name)}</b><span>موجودی ${q62(x.stock)}</span></div><div class="muted">آخرین فروش: ${esc62(x.lastDate||'—')} · حاشیه ${f62(x.margin)}٪</div></div>`).join('')||'<div class="v62Empty">کالای کم‌گردش تشخیص داده نشد.</div>'}</div></div></div>`}

function anomalies62(a){return `<div class="v62Grid2"><div class="panel"><div class="toolbar"><b>🚨 روزهای غیرعادی فروش</b><span class="muted">آستانه ${f62(current62().anomalySigma)}σ</span></div><div class="tablewrap"><table><tr><th>تاریخ</th><th>فروش</th><th>فاصله از میانگین</th><th>بررسی پیشنهادی</th></tr>${a.anomalies.map(x=>`<tr><td>${esc62(x.date)}</td><td>${m62(x.sales)}</td><td>${f62(x.z)}σ</td><td>کمپین، مناسبت، خرید عمده یا ثبت اشتباه را بررسی کن.</td></tr>`).join('')||'<tr><td colspan="4" class="v62Empty">رویداد غیرعادی از آستانه فعلی عبور نکرده است.</td></tr>'}</table></div></div><div class="panel"><div class="toolbar"><b>💳 ترکیب پرداخت</b></div><div class="pad">${Object.entries(a.pay).map(([k,v])=>`<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;font-size:10px"><span>${esc62(k)}</span><b>${m62(v)}</b></div><div class="v62Bar"><i style="width:${Math.max(2,Math.round(v/a.totalPay*100))}%"></i></div></div>`).join('')||'<div class="v62Empty">داده پرداختی نیست.</div>'}</div></div></div>`}

function export62(type){const a=analysis62();let rows=[];if(type==='products')rows=[['کالا','دسته','ABC','فروش','سود','حاشیه','واحد','موجودی','پوشش','پیشنهاد سفارش'],...a.products.map(x=>[x.name,x.cat,x.abc,x.revenue,x.profit,x.margin,x.units,x.stock,x.coverage===Infinity?'INF':x.coverage,x.suggested||0])];else if(type==='customers')rows=[['مشتری','تازگی روز','دفعات','مبلغ','بخش'],...a.customers.map(x=>[((data.parties||[]).find(p=>String(p.id)===String(x.id))?.name)||'مشتری',x.recency,x.frequency,x.monetary,x.segment])];else rows=[['شاخص','مقدار'],['فروش خالص',a.stats.sales],['سود خالص',a.stats.profit],['حاشیه سود',a.stats.margin],['فاکتور',a.stats.count],['اقلام',a.stats.units],['کم‌موجودی',a.stats.low],['مطالبات',a.stats.receivables],['برآورد '+current62().forecastDays+' روز',a.forecast.total],['ناهنجاری فروش',a.anomalies.length]];const csv=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n');const name='abrang-smart-'+type+'-'+new Date().toISOString().slice(0,10)+'.csv';if(typeof downloadText==='function')downloadText(name,csv);else if(typeof download61==='function')download61(csv,name,'text/csv;charset=utf-8');}

<script>
