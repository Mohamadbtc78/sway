  async function req(path,opt={}){const h=Object.assign({'Content-Type':'application/json'},opt.headers||{});if(token)h.Authorization='Bearer '+token;const r=await fetch(apiBase()+path,Object.assign({},opt,{headers:h}));let body=null;try{body=await r.json()}catch(_){}if(!r.ok)throw Object.assign(new Error(body?.error||('HTTP '+r.status)),{status:r.status,body});return body}
  async function getLocalToken(){if(!loopback())return null;try{const r=await req('/api/v1/auth/local',{method:'POST',body:JSON.stringify({client:'desktop64',version:CORE64.version})});token=r.token;return token}catch(e){return null}}
  async function health(){try{const x=await req('/api/v1/health');online=true;return x}catch(e){online=false;return null}}
  async function bootstrap(){if(!isHttp())return null;const h=await health();if(!h)return null;try{const b=await req('/api/v1/core/bootstrap');return Object.assign({health:h},b)}catch(e){return null}}
  function statusText(){if(!isHttp())return 'حالت محلی HTML';if(!online)return 'هسته مرکزی در دسترس نیست';if(conflict)return 'تعارض داده؛ نیازمند بررسی';return 'متصل به هسته مرکزی ۶۴'}
  function open(){
    if($('abrangCore64Modal')){$('abrangCore64Modal').classList.remove('hide');refreshPanel();return}
    const el=document.createElement('div');el.id='abrangCore64Modal';el.className='modal';
    el.innerHTML=`<div class="modalbox" style="max-width:1180px"><div class="modalhead"><div><b style="font-size:16px">هسته مرکزی آبرنگ · معماری ۶۴</b><div class="muted">Database مرکزی + API + همگام‌سازی + کنترل Revision</div></div><button class="close" onclick="abrangCore64Close()">×</button></div>
      <div class="sectionbox"><div class="miniGrid"><div class="mini">وضعیت<b id="core64Status">—</b></div><div class="mini">Revision مرکزی<b id="core64Rev">—</b></div><div class="mini">نسخه هسته<b>64.0</b></div><div class="mini">منبع اجرا<b id="core64Origin">—</b></div></div></div>
      <div class="sectionbox"><h3>کنترل همگام‌سازی</h3><div class="notice">در Windows، هسته مرکزی روی همین رایانه اجرا می‌شود و اطلاعات اصلی در Database مرکزی آبرنگ نگهداری می‌شود. برای Android یا رایانه دیگر، آدرس همین سرور را در شبکه وارد کن و با کاربر حسابداری وارد شو.</div>
      <div class="formgrid" id="core64LoginBox"><div class="field"><label>کاربر API</label><input id="core64User" class="input" value="admin" autocomplete="username"></div><div class="field"><label>رمز API</label><input id="core64Pass" class="input" type="password" autocomplete="current-password" placeholder="رمز کاربر"></div><div class="field" style="align-self:end"><button class="btn blue" onclick="abrangCore64Login()">🔐 ورود به سرور</button></div></div>
      <div class="actions"><button class="btn green" onclick="abrangCore64Push()">⬆️ ارسال به مرکز</button><button class="btn blue" onclick="abrangCore64Pull()">⬇️ دریافت از مرکز</button><button class="btn sec" onclick="abrangCore64Refresh()">🔄 بررسی اتصال</button><button class="btn sec" onclick="abrangCore64Export()">💾 خروجی پایگاه</button><button class="btn sec" onclick="abrangCore64Backup()">🛡️ پشتیبان مرکزی</button><label class="btn sec" for="core64Legacy">📥 مهاجرت از نسخه قبل</label><input id="core64Legacy" class="hide" type="file" accept="application/json,.json" onchange="abrangCore64ImportLegacy(event)"></div></div>
      <div class="sectionbox"><h3>وضعیت نسخه و داده</h3><div class="miniGrid"><div class="mini">حجم محلی<b id="core64LocalSize">—</b></div><div class="mini">Hash محلی<b id="core64LocalHash" style="font-size:9px;word-break:break-all">—</b></div><div class="mini">Hash مرکزی<b id="core64RemoteHash" style="font-size:9px;word-break:break-all">—</b></div><div class="mini">دستگاه<b id="core64Device">—</b></div></div></div>
      <div class="sectionbox"><h3>وضعیت امنیتی API</h3><div class="muted">توکن نشست در localStorage ذخیره نمی‌شود. درخواست‌های نوشتن با Revision کنترل می‌شوند تا دو دستگاه هم‌زمان نتوانند بدون تشخیص تعارض روی داده یکدیگر بنویسند.</div></div>
      <div id="core64Log" class="sectionbox"><div class="muted">هنوز عملیاتی انجام نشده است.</div></div></div>`;
    document.body.appendChild(el);refreshPanel();
  }
  function close(){const el=$('abrangCore64Modal');if(el)el.classList.add('hide')}
  async function refreshPanel(){
    const raw=getLocal();
    let lh='—';try{lh=await sha256(raw)}catch(_){ }
    lastLocalHash=lh;
    $('core64Status')?.replaceChildren(document.createTextNode(statusText()));
    $('core64Origin')?.replaceChildren(document.createTextNode(location.origin||location.protocol));
    $('core64LocalSize')?.replaceChildren(document.createTextNode((raw.length/1024).toFixed(1)+' KB'));
    $('core64LocalHash')?.replaceChildren(document.createTextNode(lh));
    $('core64Rev')?.replaceChildren(document.createTextNode(String(rev||'—')));
    $('core64RemoteHash')?.replaceChildren(document.createTextNode(window.__abrangCore64RemoteHash||'—'));
    $('core64Device')?.replaceChildren(document.createTextNode(deviceId()));
  }
  function log(msg,kind=''){const p=$('core64Log');if(!p)return;p.innerHTML=`<div class="${kind==='bad'?'danger':kind==='ok'?'ok':'hint'}">${esc64(msg)}</div>`}
  function deviceId(){try{let x=sessionStorage.getItem('abrang_core64_device');if(!x){x='PC-'+crypto.getRandomValues(new Uint32Array(2)).join('').slice(-10);sessionStorage.setItem('abrang_core64_device',x)}return x}catch(e){return 'PC-LOCAL'}}
  async function remoteLogin(){if(!isHttp())return false;const u=$('core64User')?.value?.trim()||'admin';const p=$('core64Pass')?.value||'';if(!p){log('رمز API را وارد کن.','bad');return false}try{const r=await req('/api/v1/auth/login',{method:'POST',body:JSON.stringify({Username:u,Password:p})});token=r.token;online=true;conflict=false;log('ورود API موفق شد. نقش: '+r.role,'ok');if(r.mustChange)log('هشدار: رمز اولیه کاربر هنوز تغییر نکرده است.','bad');await refreshPanel();return true}catch(e){log('ورود API ناموفق: '+e.message,'bad');return false}}
  async function ensureSession(){if(token)return true;if(!isHttp())return false;if(loopback())return !!(await getLocalToken());return false}
  async function push(manual=true){
    if(!token && !loopback()) { if(!(await remoteLogin())) return; }
    if(!isHttp()){log('این فایل مستقیماً با file:// باز شده است؛ برای ارسال به Database مرکزی، برنامه Windows/Server ۶۴ را اجرا کن.','bad');return}
    if(!(await ensureSession())){log('نشست هسته مرکزی برقرار نشد.','bad');return}
    const raw=getLocal();if(!raw){log('داده محلی وجود ندارد.','bad');return}
    try{
      const state=JSON.parse(raw);const r=await req('/api/v1/state',{method:'POST',body:JSON.stringify({expectedRevision:rev||0,state,deviceId:deviceId(),source:'abrang-web64',manual})});
      rev=r.revision||rev;online=true;conflict=false;window.__abrangCore64RemoteHash=r.hash||'';log('داده با موفقیت در Database مرکزی ذخیره شد. Revision جدید: '+rev,'ok');await refreshPanel();
    }catch(e){if(e.status===409){conflict=true;log('تعارض داده شناسایی شد؛ ابتدا «دریافت از مرکز» را بررسی کن و در صورت اطمینان نسخه مناسب را نگه دار.','bad')}else log('ارسال ناموفق: '+e.message,'bad');await refreshPanel()}
  }
  async function pull(){
    if(!token && !loopback()) { if(!(await remoteLogin())) return; }
    if(!isHttp()){log('برای دریافت از مرکز، برنامه را از طریق Server ۶۴ اجرا کن.','bad');return}
    if(!(await ensureSession())){log('نشست هسته مرکزی برقرار نشد.','bad');return}
    try{
      const r=await req('/api/v1/state');rev=r.revision||0;window.__abrangCore64RemoteHash=r.hash||'';online=true;
      const current=getLocal();const curHash=await sha256(current);if(r.hash&&r.hash===curHash){conflict=false;log('داده محلی و مرکزی یکسان هستند.');await refreshPanel();return}
      if(!confirm('نسخه مرکزی جایگزین اطلاعات فعلی مرورگر شود؟ قبل از جایگزینی یک پشتیبان محلی ساخته می‌شود.'))return;
      try{localStorage.setItem('abrang_before_core64_pull_'+Date.now(),current)}catch(_){ }
      const ok=setLocal(JSON.stringify(r.state));if(!ok)throw new Error('ذخیره محلی ممکن نیست');
      conflict=false;log('داده مرکزی دریافت شد؛ برنامه برای بارگذاری داده جدید بازخوانی می‌شود.','ok');setTimeout(()=>location.reload(),350);
    }catch(e){log('دریافت ناموفق: '+e.message,'bad')}
  }
  async function exportDb(){if(!token&&!loopback()){if(!(await remoteLogin()))return}try{const r=await req('/api/v1/backup/export');const blob=new Blob([JSON.stringify(r,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='abrang-central64-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);log('خروجی پایگاه مرکزی دانلود شد.','ok')}catch(e){log('خروجی ناموفق: '+e.message,'bad')}}
  async function backup(){if(!token&&!loopback()){if(!(await remoteLogin()))return}try{const r=await req('/api/v1/backup/create',{method:'POST',body:JSON.stringify({reason:'manual-ui'})});log('پشتیبان مرکزی ایجاد شد: '+r.file,'ok')}catch(e){log('پشتیبان‌گیری ناموفق: '+e.message,'bad')}}
  async function boot(){
    if(bootDone)return;bootDone=true;
    window.ABRANG_ARCH_VERSION='65.0';
    if(!isHttp()){addButton();return}
    const b=await bootstrap();if(!b)return;
    rev=b.revision||0;window.__abrangCore64RemoteHash=b.hash||'';
    if(b.state){
      const local=getLocal();const lh=await sha256(local);if(b.hash&&b.hash!==lh){
        try{setLocal(JSON.stringify(b.state));sessionStorage.setItem('abrang_core64_bootstrap','central');location.reload();return}catch(_){}
      }
    }else{
      const raw=getLocal();if(raw){try{await ensureSession();await push(false)}catch(_){} }
    }
    patchSave();addButton();await refreshPanel();
  }
  let originalSet=Storage.prototype.setItem;
  function patchSave(){
    if(Storage.prototype.setItem.__abrang64)return;
    let timer=null,active=true;
    function wrapped(k,v){const out=originalSet.call(this,k,v);if(active&&this===localStorage&&k===CORE64.key&&isHttp()){clearTimeout(timer);timer=setTimeout(()=>push(false),CORE64.autoDelay)}return out}
    wrapped.__abrang64=true;Storage.prototype.setItem=wrapped;
  }
  function addButton(){
    if(document.getElementById('abrangCore64Btn'))return;
    const b=document.createElement('button');b.id='abrangCore64Btn';b.className='btn dark';b.style.position='fixed';b.style.left='14px';b.style.bottom='14px';b.style.zIndex='95';b.textContent='🧩 هسته مرکزی ۶۴';b.onclick=open;document.body.appendChild(b);
  }
  async function importLegacy(ev){const f=ev.target.files?.[0];if(!f)return;try{if(!isHttp()||(!loopback()&&!token)) { if(!loopback()&&!(await remoteLogin())) throw new Error('ورود API لازم است'); } else if(!(await ensureSession()))throw new Error('هسته مرکزی در دسترس نیست');const raw=JSON.parse(await f.text());const st=raw?.data||raw?.state||raw?.db?.state||null;if(!st||typeof st!=='object')throw new Error('ساختار پشتیبان آبرنگ شناسایی نشد');if(!confirm('اطلاعات این فایل به Database مرکزی آبرنگ منتقل شود؟ قبل از جایگزینی، پشتیبان مرکزی ساخته می‌شود.'))return;await backup();const r=await req('/api/v1/state',{method:'POST',body:JSON.stringify({expectedRevision:rev||0,state:st,deviceId:deviceId(),source:'legacy-migration',manual:true})});rev=r.revision||rev;window.__abrangCore64RemoteHash=r.hash||'';setLocal(JSON.stringify(st));conflict=false;log('مهاجرت اطلاعات با موفقیت انجام شد؛ برنامه برای بارگذاری اطلاعات مهاجرت‌شده بازخوانی می‌شود.','ok');setTimeout(()=>location.reload(),350)}catch(e){log('مهاجرت ناموفق: '+e.message,'bad')}finally{ev.target.value=''}}
  window.abrangCore64Open=open;window.abrangCore64Close=close;window.abrangCore64Login=remoteLogin;window.abrangCore64Push=()=>push(true);window.abrangCore64Pull=pull;window.abrangCore64Refresh=async()=>{const h=await health();log(h?('هسته آنلاین است · Revision '+(h.revision||0)): 'هسته در دسترس نیست',h?'ok':'bad');rev=h?.revision||rev;await refreshPanel()};window.abrangCore64Export=exportDb;window.abrangCore64Backup=backup;window.abrangCore64ImportLegacy=importLegacy;
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else setTimeout(boot,0);
})();
</script>

<script id="abrangSales65">(function(){
'use strict';
const KEY='abrang_sales_pro65_v1';
const clone=x=>JSON.parse(JSON.stringify(x));
const N=v=>{const z=Number(v);return Number.isFinite(z)?z:0};
const esc65=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const today65=()=>new Date().toISOString().slice(0,10);
const fa65=()=>{try{return new Intl.DateTimeFormat('fa-IR',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}catch(_){return today65()}};
const uid65=()=>{try{if(typeof uid==='function')return uid()}catch(_){ }return '65-'+Date.now()+'-'+Math.random().toString(36).slice(2,9)};
const money65=v=>{try{if(typeof money==='function')return money(v)}catch(_){ }return Number(v||0).toLocaleString('fa-IR')};
const qty65=v=>{try{if(typeof qty==='function')return qty(v)}catch(_){ }return Number(v||0).toLocaleString('fa-IR')};
const prod=id=>{try{if(typeof product==='function')return product(id)}catch(_){ }return (data.products||[]).find(p=>p.id===id)};
const party65=id=>(data.parties||[]).find(p=>p.id===id);
function audit65(a,d){try{if(typeof audit==='function')audit(a,d)}catch(_){}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(st));if(typeof save==='function')save(true);else localStorage.setItem('abrang_accounting_v13',JSON.stringify(data))}catch(e){console.error(e)}}
function defaults(){return {schemaVersion:65,tab:'home',quotes:[],orders:[],consignIn:[],consignOut:[],gifts:[],wastage:[],priceLists:[{id:'retail',name:'عادی',priority:1},{id:'partner',name:'همکار',priority:2},{id:'wholesale',name:'عمده',priority:3},{id:'special',name:'ویژه',priority:4}],policies:[],seq:{quote:1,order:1,consign:1,gift:1,wastage:1},settings:{round:1000,defaultPriceList:'retail',autoPolicy:true}}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');const d=defaults();if(!x)return d;Object.keys(x).forEach(k=>{if(k==='seq')d.seq=Object.assign(d.seq,x.seq||{});else if(k==='settings')d.settings=Object.assign(d.settings,x.settings||{});else if(Array.isArray(x[k]))d[k]=x[k]});return d}catch(_){return defaults()}}
let st=load();
function round65(v){const r=Math.max(1,N(st.settings.round)||1);return Math.round(N(v)/r)*r}
function basePrice65(p,level){const x=p?.prices||{};const lv=level==='bulk'?'partner':level;if(lv==='special'&&N(x.special)>0)return N(x.special);if(lv==='partner'&&N(x.partner)>0)return N(x.partner);if(lv==='wholesale'&&N(x.wholesale)>0)return N(x.wholesale);if(lv==='partner'&&N(p.partnerSell)>0)return N(p.partnerSell);if(lv==='wholesale'&&N(p.wholesaleSell)>0)return N(p.wholesaleSell);return N(x.retail)||N(p.sell)}
function matches65(r,p,qty,partyId){if(r.active===false)return false;if(r.category&&r.category!==p.cat)return false;if(r.productId&&r.productId!==p.id)return false;if(r.partyType){const pa=party65(partyId),g=pa?.customerGroup||pa?.group||'';if(g!==r.partyType)return false}if(N(r.minQty)>0&&qty<N(r.minQty))return false;if(N(r.maxQty)>0&&qty>N(r.maxQty))return false;const d=today65();if(r.from&&d<r.from)return false;if(r.to&&d>r.to)return false;return true}
function price65(p,level='retail',qty=1,partyId=''){if(!p)return 0;let price=basePrice65(p,level);if(!st.settings.autoPolicy)return round65(price);for(const r of st.policies.slice().sort((a,b)=>N(a.priority)-N(b.priority))){if(!matches65(r,p,qty,partyId))continue;const mode=r.mode||'markup';if(mode==='markup')price=price*(1+N(r.percent)/100)+N(r.fixed);else if(mode==='discount')price=price*(1-N(r.percent)/100)+N(r.fixed);else if(mode==='costplus')price=N(p.avgBuy||p.buy)+N(r.percent)*N(p.avgBuy||p.buy)/100+N(r.fixed);else if(mode==='fixed')price=N(r.fixed);price=round65(Math.max(0,price));if(r.stop)break}return Math.max(0,round65(price))}
function newNo(kind){const map={quote:'PF-',order:'SO-',consign:'AM-',gift:'AS-',wastage:'ZA-'};const no=(map[kind]||'65-')+String(st.seq[kind]++).padStart(6,'0');localStorage.setItem(KEY,JSON.stringify(st));return no}
function ensurePriceFields(){(data.products||[]).forEach(p=>{p.prices=p.prices||{};if(p.prices.retail==null)p.prices.retail=N(p.sell);if(p.prices.partner==null)p.prices.partner=N(p.partnerSell||p.sell);if(p.prices.wholesale==null)p.prices.wholesale=N(p.wholesaleSell||p.sell)})}
function tab(t){st.tab=t;localStorage.setItem(KEY,JSON.stringify(st));render65()}
function val(id){return document.getElementById(id)?.value||''}
function addQuote(){ensurePriceFields();window.__v65Draft={items:[]};const body=`<div class="hint">پیش‌فاکتور موجودی را کم نمی‌کند. بعداً می‌تواند به سفارش و سپس فاکتور تبدیل شود.</div><div class="formgrid"><div class="field"><label>مشتری</label><select id="v65QParty" class="select"><option value="">متفرقه</option>${(data.parties||[]).filter(p=>p.type==='customer').map(p=>`<option value="${esc65(p.id)}">${esc65(p.name)}</option>`).join('')}</select></div><div class="field"><label>سطح قیمت</label><select id="v65QLevel" class="select">${st.priceLists.map(x=>`<option value="${esc65(x.id)}">${esc65(x.name)}</option>`).join('')}</select></div><div class="field"><label>تخفیف</label><input id="v65QDisc" class="input" type="number" min="0" value="0"></div><div class="field"><label>اعتبار تا</label><input id="v65QValid" class="input" type="date"></div></div><div class="sectionbox" style="margin-top:10px"><h3>اقلام</h3><div id="v65QLines"></div><div class="actions"><select id="v65QProduct" class="select" style="max-width:360px"><option value="">انتخاب کالا</option>${(data.products||[]).map(p=>`<option value="${esc65(p.id)}">${esc65(p.name)}</option>`).join('')}</select><input id="v65QQty" class="input" style="width:90px" type="number" min="1" value="1"><button class="btn" onclick="window.v65QAdd()">+ کالا</button><button class="btn sec" onclick="window.v65QGift()">+ اشانتیون</button></div></div><div class="actions"><button class="btn green" onclick="window.v65SaveQuote()">ذخیره پیش‌فاکتور</button><button class="btn sec" onclick="closeModal()">انصراف</button></div>`;modal('پیش‌فاکتور جدید',body);document.getElementById('v65QLevel').addEventListener('change',renderQLines);renderQLines()}
function renderQLines(){const box=document.getElementById('v65QLines');if(!box)return;const partyId=val('v65QParty'),level=val('v65QLevel')||'retail';box.innerHTML=window.__v65Draft.items.length?window.__v65Draft.items.map((i,idx)=>{const p=prod(i.productId);const auto=i.isGift?0:price65(p,level,i.qty,partyId);const pr=i.manual?N(i.price):auto;if(!i.manual)i.price=pr;return `<div class="sectionbox"><div class="line" style="display:grid;grid-template-columns:2fr .6fr .9fr .7fr .7fr 34px;gap:6px;align-items:center"><div><b>${esc65(p?.name||i.name)}</b><div class="v65muted">${i.isGift?'اشانتیون':'فروش'}</div></div><input class="input" type="number" min="1" value="${i.qty}" onchange="window.__v65Draft.items[${idx}].qty=Math.max(1,N(this.value));window.__v65Draft.items[${idx}].manual=false;window.v65RenderQLines()"><input class="input" type="number" value="${pr}" ${i.isGift?'disabled':''} onchange="window.__v65Draft.items[${idx}].price=Math.max(0,N(this.value));window.__v65Draft.items[${idx}].manual=true"><input class="input" type="number" value="${i.discount||0}" onchange="window.__v65Draft.items[${idx}].discount=Math.max(0,N(this.value))"><span>${money65(Math.max(0,i.qty*pr-N(i.discount)))}</span><button class="btn red" onclick="window.__v65Draft.items.splice(${idx},1);window.v65RenderQLines()">×</button></div></div>`}).join(''):'<div class="empty">قلمی اضافه نشده است.</div>'}
function qAdd(gift){const p=prod(val('v65QProduct'));const q=Math.max(1,N(val('v65QQty')));if(!p)return alert('کالا را انتخاب کن');window.__v65Draft.items.push({id:uid65(),productId:p.id,name:p.name,qty:q,price:gift?0:price65(p,val('v65QLevel')||'retail',q,val('v65QParty')||''),discount:0,isGift:!!gift,manual:false});renderQLines()}
function saveQuote(){const d=window.__v65Draft;if(!d?.items?.length)return alert('حداقل یک قلم لازم است');const pa=party65(val('v65QParty')),disc=Math.max(0,N(val('v65QDisc'))),sub=d.items.reduce((s,i)=>s+Math.max(0,N(i.qty)*N(i.price)-N(i.discount)),0),total=Math.max(0,sub-disc);const q={id:uid65(),no:newNo('quote'),date:fa65(),isoDate:today65(),validTo:val('v65QValid'),partyId:pa?.id||'',partyName:pa?.name||'متفرقه',level:val('v65QLevel')||'retail',items:clone(d.items),subtotal:sub,discount:disc,total,status:'open',createdAt:new Date().toISOString()};st.quotes.unshift(q);audit65('ثبت پیش‌فاکتور',q.no);persist();closeModal();render65()}
function printQuote(id){const q=st.quotes.find(x=>x.id===id);if(!q)return;const rows=q.items.map(i=>`<tr><td>${esc65(i.name)}</td><td>${qty65(i.qty)}</td><td>${money65(i.price)}</td><td>${money65(Math.max(0,N(i.qty)*N(i.price)-N(i.discount)))}</td></tr>`).join('');const w=window.open('','_blank','width=900,height=900');if(!w)return alert('مرورگر اجازه چاپ نداد');w.document.write(`<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><title>${esc65(q.no)}</title><style>body{font-family:Tahoma;padding:24px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:8px}</style><h2>${esc65(data.settings?.shopName||'آبرنگ')}</h2><p>پیش‌فاکتور ${esc65(q.no)} · ${esc65(q.date)} · ${esc65(q.partyName)}</p><table><tr><th>کالا</th><th>تعداد</th><th>فی</th><th>جمع</th></tr>${rows}</table><h3>مبلغ نهایی: ${money65(q.total)}</h3></html>`);w.document.close();setTimeout(()=>{try{w.focus();w.print()}catch(_){ }},150)}
function quoteToOrder(id){const q=st.quotes.find(x=>x.id===id);if(!q||q.status!=='open')return;const o={id:uid65(),no:newNo('order'),quoteId:q.id,date:fa65(),isoDate:today65(),partyId:q.partyId,partyName:q.partyName,level:q.level,items:clone(q.items),subtotal:q.subtotal,discount:q.discount,total:q.total,status:'open',fulfilledTotal:0,createdAt:new Date().toISOString()};st.orders.unshift(o);q.status='converted';q.orderId=o.id;audit65('تبدیل پیش‌فاکتور به سفارش',q.no+' → '+o.no);persist();render65()}
function addDirectOrder(){ensurePriceFields();window.__v65Draft={items:[]};const body=`<div class="hint">سفارش فروش موجودی را در لحظه کم نمی‌کند. بعداً می‌توان آن را کامل یا مرحله‌ای به فاکتور تبدیل کرد.</div><div class="formgrid"><div class="field"><label>مشتری</label><select id="v65QParty" class="select"><option value="">متفرقه</option>${(data.parties||[]).filter(p=>p.type==='customer').map(p=>`<option value="${esc65(p.id)}">${esc65(p.name)}</option>`).join('')}</select></div><div class="field"><label>سطح قیمت</label><select id="v65QLevel" class="select">${st.priceLists.map(x=>`<option value="${esc65(x.id)}">${esc65(x.name)}</option>`).join('')}</select></div><div class="field"><label>تخفیف</label><input id="v65QDisc" class="input" type="number" min="0" value="0"></div><div class="field"><label>موعد تحویل</label><input id="v65QValid" class="input" type="date"></div></div><div class="sectionbox" style="margin-top:10px"><h3>اقلام سفارش</h3><div id="v65QLines"></div><div class="actions"><select id="v65QProduct" class="select" style="max-width:360px"><option value="">انتخاب کالا</option>${(data.products||[]).map(p=>`<option value="${esc65(p.id)}">${esc65(p.name)}</option>`).join('')}</select><input id="v65QQty" class="input" style="width:90px" type="number" min="1" value="1"><button class="btn" onclick="window.v65QAdd()">+ کالا</button><button class="btn sec" onclick="window.v65QGift()">+ اشانتیون</button></div></div><div class="actions"><button class="btn blue" onclick="window.v65SaveDirectOrder()">ثبت سفارش</button><button class="btn sec" onclick="closeModal()">انصراف</button></div>`;modal('سفارش مستقیم جدید',body);document.getElementById('v65QLevel').addEventListener('change',renderQLines);renderQLines()}
function saveDirectOrder(){const d=window.__v65Draft;if(!d?.items?.length)return alert('حداقل یک قلم لازم است');const pa=party65(val('v65QParty')),disc=Math.max(0,N(val('v65QDisc'))),sub=d.items.reduce((s,i)=>s+Math.max(0,N(i.qty)*N(i.price)-N(i.discount)),0),total=Math.max(0,sub-disc);const o={id:uid65(),no:newNo('order'),quoteId:'',date:fa65(),isoDate:today65(),partyId:pa?.id||'',partyName:pa?.name||'متفرقه',level:val('v65QLevel')||'retail',items:clone(d.items),subtotal:sub,discount:Math.min(disc,sub),total,status:'open',fulfilledTotal:0,invoiceDiscount:0,deliveryDate:val('v65QValid'),createdAt:new Date().toISOString()};st.orders.unshift(o);audit65('ثبت سفارش مستقیم',o.no);persist();closeModal();render65()}

function orderInvoice(id){const o=st.orders.find(x=>x.id===id);if(!o||o.status==='completed')return;const ready=[];for(const i of o.items){const p=prod(i.productId),rem=Math.max(0,N(i.qty)-N(i.fulfilledQty));if(rem<=0)continue;const ask=prompt('تعداد فاکتور برای «'+(p?.name||i.name)+'» از '+rem+':',String(rem));if(ask===null)return;const q=Math.min(rem,Math.max(0,N(ask)));if(q>0)ready.push({...i,qty:q})}if(!ready.length)return alert('مقدار معتبر وارد نشده است');for(const i of ready){const p=prod(i.productId);if(!p||N(p.stock)<N(i.qty))return alert('موجودی «'+(p?.name||i.name)+'» کافی نیست')}const sub=ready.reduce((s,i)=>s+Math.max(0,N(i.qty)*N(i.price)-N(i.discount)),0);const orderDiscBase=Math.max(0,N(o.subtotal)||0);const disc=Math.min(N(o.discount)||0,sub,orderDiscBase?sub*(N(o.discount)||0)/orderDiscBase:0);const total=Math.max(0,sub-disc);let sale;if(typeof createSale==='function'&&typeof applySale==='function'){sale=createSale(ready,o.partyId,o.partyName,sub,disc,total,total,'نقدی');applySale(sale)}else{data.sales=data.sales||[];sale={id:uid65(),no:'V65-'+Date.now(),isoDate:today65(),date:fa65(),partyId:o.partyId,partyName:o.partyName,items:clone(ready),subtotal:sub,discount:disc,total,paid:total,remaining:0,paymentType:'نقدی',profit:0,status:'active'};data.sales.push(sale);ready.forEach(i=>{prod(i.productId).stock-=N(i.qty)})}o.fulfilledTotal=N(o.fulfilledTotal)+total;o.invoiceDiscount=N(o.invoiceDiscount)+disc;o.invoiceIds=o.invoiceIds||[];o.invoiceIds.push(sale.no);o.items.forEach(src=>{src.fulfilledQty=N(src.fulfilledQty)+ready.filter(x=>x.id===src.id).reduce((s,x)=>s+N(x.qty),0)});o.status=o.items.every(i=>N(i.fulfilledQty)>=N(i.qty))?'completed':'partial';audit65('تبدیل سفارش به فاکتور',o.no+' → '+sale.no);persist();render65();alert('فاکتور '+sale.no+' ثبت شد')}

function addConsignIn(){modal('دریافت کالای امانی',`<div class="formgrid"><div class="field"><label>مالک/تأمین‌کننده</label><select id="v65CIparty" class="select"><option value="">انتخاب</option>${(data.parties||[]).filter(p=>p.type==='supplier').map(p=>`<option value="${esc65(p.id)}">${esc65(p.name)}</option>`).join('')}</select></div><div class="field"><label>کالا</label><select id="v65CIprod" class="select">${(data.products||[]).map(p=>`<option value="${esc65(p.id)}">${esc65(p.name)}</option>`).join('')}</select></div><div class="field"><label>تعداد</label><input id="v65CIqty" class="input" type="number" min="1" value="1"></div><div class="field"><label>بهای تسویه واحد</label><input id="v65CIcost" class="input" type="number" min="0" value="0"></div></div><div class="field" style="margin-top:8px"><label>شرح</label><textarea id="v65CInote" class="textarea"></textarea></div><div class="actions"><button class="btn green" onclick="window.v65SaveConsignIn()">ثبت</button><button class="btn sec" onclick="closeModal()">انصراف</button></div>`)}
function saveConsignIn(){const p=prod(val('v65CIprod'));if(!p)return;const q=Math.max(1,N(val('v65CIqty'))),pa=party65(val('v65CIparty'));const r={id:uid65(),no:newNo('consign'),partyId:pa?.id||'',partyName:pa?.name||'مالک نامشخص',productId:p.id,productName:p.name,receivedQty:q,soldQty:0,availableQty:q,settlementDue:0,cost:N(val('v65CIcost')),note:val('v65CInote'),status:'open',date:fa65(),isoDate:today65()};st.consignIn.unshift(r);audit65('دریافت امانی',r.no+' · '+p.name+' · '+q);persist();closeModal();render65()}
function sellConsignIn(id){const r=st.consignIn.find(x=>x.id===id);if(!r)return;const p=prod(r.productId),q=Math.max(0,Math.min(N(r.availableQty),N(prompt('تعداد فروش امانی از '+r.availableQty+':',String(r.availableQty)))));if(!q)return;const price=Math.max(0,N(prompt('قیمت فروش هر واحد:',String(p?.sell||0))));if(!price)return;const total=q*price;r.availableQty-=q;r.soldQty+=q;r.settlementDue+=q*N(r.cost);if(!r.availableQty)r.status='soldout';data.sales=data.sales||[];const sale={id:uid65(),no:'AMF-'+String(N(data.seq?.sale)||1).padStart(6,'0'),isoDate:today65(),date:fa65(),partyId:'',partyName:'فروش امانی / '+r.partyName,items:[{productId:p.id,name:p?.name||r.productName,qty:q,buy:N(r.cost||p?.avgBuy||p?.buy),price,discount:0,lineTotal:total,consignment:true}],subtotal:total,discount:0,total,paid:total,remaining:0,paymentType:'نقدی',profit:q*(price-N(r.cost||p?.avgBuy||p?.buy)),status:'active',consignment:true,sourceConsignmentId:r.id,createdAt:new Date().toISOString()};data.sales.push(sale);if(typeof cashAdd==='function')cashAdd('فروش امانی',total,'نقدی',sale.partyName,sale.no);if(data.seq)data.seq.sale=N(data.seq.sale)+1;audit65('فروش امانی دریافتی',r.no+' → '+sale.no);persist();render65()}
function addConsignOut(){modal('ارسال کالای امانی به مشتری',`<div class="formgrid"><div class="field"><label>مشتری</label><select id="v65COparty" class="select"><option value="">انتخاب</option>${(data.parties||[]).filter(p=>p.type==='customer').map(p=>`<option value="${esc65(p.id)}">${esc65(p.name)}</option>`).join('')}</select></div><div class="field"><label>کالا</label><select id="v65COprod" class="select">${(data.products||[]).map(p=>`<option value="${esc65(p.id)}">${esc65(p.name)} · موجودی ${qty65(p.stock)}</option>`).join('')}</select></div><div class="field"><label>تعداد</label><input id="v65COqty" class="input" type="number" min="1" value="1"></div></div><div class="actions"><button class="btn green" onclick="window.v65SaveConsignOut()">ثبت خروج امانی</button><button class="btn sec" onclick="closeModal()">انصراف</button></div>`)}
function saveConsignOut(){const p=prod(val('v65COprod')),q=Math.max(1,N(val('v65COqty'))),pa=party65(val('v65COparty'));if(!p)return;if(N(p.stock)<q)return alert('موجودی کافی نیست');const b=N(p.stock);p.stock-=q;const r={id:uid65(),no:newNo('consign'),partyId:pa?.id||'',partyName:pa?.name||'مشتری نامشخص',productId:p.id,productName:p.name,qty:q,returnedQty:0,soldQty:0,status:'open',note:'',outAt:today65()};st.consignOut.unshift(r);data.moves.push({id:uid65(),isoDate:today65(),date:fa65(),type:'خروج امانی',productId:p.id,qty:-q,before:b,after:p.stock,ref:r.no});audit65('خروج امانی',r.no+' · '+p.name+' · '+q);persist();closeModal();render65()}
function sellConsignOut(id){const r=st.consignOut.find(x=>x.id===id);if(!r)return;const remaining=Math.max(0,N(r.qty)-N(r.returnedQty)-N(r.soldQty));if(!remaining)return;const p=prod(r.productId),q=Math.max(0,Math.min(remaining,N(prompt('تعداد فروش از '+remaining+':',String(remaining)))));if(!q)return;const price=Math.max(0,N(prompt('قیمت فروش هر واحد:',String(p?.sell||0))));if(!price)return;const total=q*price;r.soldQty+=q;r.status=(N(r.returnedQty)+N(r.soldQty)>=N(r.qty))?'closed':'open';data.sales=data.sales||[];const cost=N(p?.avgBuy||p?.buy);const sale={id:uid65(),no:'AMF-'+String(N(data.seq?.sale)||1).padStart(6,'0'),isoDate:today65(),date:fa65(),partyId:r.partyId||'',partyName:r.partyName,items:[{productId:p.id,name:p?.name||r.productName,qty:q,buy:cost,price,discount:0,lineTotal:total,consignment:true}],subtotal:total,discount:0,total,paid:total,remaining:0,paymentType:'نقدی',profit:q*(price-cost),status:'active',consignment:true,sourceConsignmentId:r.id,createdAt:new Date().toISOString()};data.sales.push(sale);if(typeof cashAdd==='function')cashAdd('فروش امانی',total,'نقدی',r.partyName,sale.no);if(data.seq)data.seq.sale=N(data.seq.sale)+1;audit65('فروش امانی خروجی',r.no+' → '+sale.no);persist();render65()}
function consignReturn(id){const r=st.consignOut.find(x=>x.id===id);if(!r)return;const remaining=Math.max(0,N(r.qty)-N(r.returnedQty)-N(r.soldQty));if(!remaining)return;const q=Math.max(0,Math.min(remaining,N(prompt('تعداد برگشت از '+remaining+':',String(remaining)))));if(!q)return;const p=prod(r.productId),b=N(p.stock);p.stock+=q;r.returnedQty+=q;r.status=(N(r.returnedQty)+N(r.soldQty)>=N(r.qty))?'closed':'open';data.moves.push({id:uid65(),isoDate:today65(),date:fa65(),type:'برگشت امانی',productId:p.id,qty:q,before:b,after:p.stock,ref:r.no});audit65('برگشت امانی',r.no+' · '+q);persist();render65()}

function addWastage(){modal('ثبت ضایعات / کسری',`<div class="formgrid"><div class="field"><label>کالا</label><select id="v65Wprod" class="select">${(data.products||[]).map(p=>`<option value="${esc65(p.id)}">${esc65(p.name)} · موجودی ${qty65(p.stock)}</option>`).join('')}</select></div><div class="field"><label>تعداد</label><input id="v65Wqty" class="input" type="number" min="1" value="1"></div><div class="field"><label>نوع</label><select id="v65Wtype" class="select"><option>خرابی</option><option>کسری انبار</option><option>آسیب</option><option>مفقودی</option><option>سایر</option></select></div><div class="field"><label>بهای واحد</label><input id="v65Wcost" class="input" type="number" value="0"></div></div><div class="field" style="margin-top:8px"><label>شرح</label><textarea id="v65Wnote" class="textarea"></textarea></div><div class="actions"><button class="btn red" onclick="window.v65SaveWastage()">ثبت ضایعات</button><button class="btn sec" onclick="closeModal()">انصراف</button></div>`)}

        const keyP=p ? p : '';
        if(p && seenP.has(keyP)){btn.remove();return;}
        if(id && idMap[id] && seenId.has(id)){btn.remove();return;}
        if(p)seenP.add(keyP); if(id)seenId.add(id);
      });
      // Keep only known navigational buttons; remove any legacy root-level ungrouped button.
      [...nav.children].forEach(el=>{ if(el.matches?.('button') && !el.closest('.navGroup')) el.remove(); });
    }finally{busy=false;}
  }
  window.abrangOrganizeNav65=organize;
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',organize,{once:true});
  else organize();
  window.addEventListener('load',organize,{once:true});
  try{
    const nav=document.getElementById('nav');
    if(nav){
      const obs=new MutationObserver(()=>{if(!busy)requestAnimationFrame(organize)});
      obs.observe(nav,{childList:true,subtree:true});
      window.addEventListener('beforeunload',()=>obs.disconnect(),{once:true});
    }
  }catch(e){}
})();
</script>

<script id="abrangPrivacyTheme65Script">
(function(){
  'use strict';
  const THEME_KEY='abrang_ui_theme_65';
  function getTheme(){try{return localStorage.getItem(THEME_KEY)||'light'}catch(e){return 'light'}}
  function saveTheme(t){try{localStorage.setItem(THEME_KEY,t)}catch(e){}}
  function applyTheme(t){
    t=t==='dark'?'dark':'light';
    const root=document.documentElement;
    if(root.dataset.theme!==t){root.dataset.theme=t;saveTheme(t);}
    const label=t==='dark'?'☀️ حالت روشن':'🌙 حالت تیره';
    document.querySelectorAll('[data-abrang-theme-label]').forEach(el=>{if(el.textContent!==label)el.textContent=label});
    const f=document.getElementById('abrangThemeFloat65');
    if(f){const icon=t==='dark'?'☀️':'🌙';if(f.textContent!==icon)f.textContent=icon;}
  }
  window.abrangToggleTheme65=function(){applyTheme(getTheme()==='dark'?'light':'dark')};
  window.abrangSetTheme65=applyTheme;
  applyTheme(getTheme());

  function ensureThemeUI(){
    const side=document.querySelector('.side');
    if(side && !document.getElementById('abrangUiTools65')){
      const tools=document.createElement('div');tools.id='abrangUiTools65';tools.className='abrangUiTools65';
      tools.innerHTML='<button type="button" class="abrangThemeBtn65" onclick="window.abrangToggleTheme65()"><span data-abrang-theme-label>🌙 حالت تیره</span></button><button type="button" class="abrangHomeBtn65" onclick="window.abrangShowHome65()">🏠 خانه آبرنگ</button>';
      const logo=side.querySelector('.logoBox'); if(logo&&logo.parentNode)logo.parentNode.insertBefore(tools,logo.nextSibling); else side.prepend(tools);
    }
    if(!document.getElementById('abrangThemeFloat65')){
      const f=document.createElement('button');f.id='abrangThemeFloat65';f.className='abrangThemeFloat65';f.type='button';f.title='تغییر تم روشن/تیره';f.setAttribute('aria-label','تغییر تم روشن و تیره');f.onclick=window.abrangToggleTheme65;document.body.appendChild(f);
    }
    applyTheme(getTheme());
  }

  function showLoginLogo(){
    const overlay=document.getElementById('v60Overlay');
    const head=overlay?.querySelector('.v60AuthHead');
    if(head && !head.querySelector('.abrangLoginLogo65')){
      const src=document.querySelector('.logoBox img')?.src;
      if(src){const img=document.createElement('img');img.className='abrangLoginLogo65';img.alt='آبرنگ';img.src=src;head.prepend(img)}
    }
  }

  function showHome(){
    ensureThemeUI();
    document.body.classList.add('abrangHomeMode65');
    const title=document.getElementById('title'); if(title)title.textContent='آبرنگ';
    const sub=document.getElementById('subtitle'); if(sub)sub.textContent='سامانه مدیریت فروشگاه';
    document.querySelectorAll('#nav button[data-p]').forEach(b=>b.classList.toggle('active',false));
    const content=document.getElementById('content');
    const src=document.querySelector('.logoBox img')?.src||'';
    if(content)content.innerHTML='<div class="abrangPrivateHome65"><div class="abrangPrivateCard65"><img class="abrangPrivateLogo65" alt="آبرنگ" src="'+src+'"><div class="abrangPrivateTitle65">آبرنگ</div><div class="abrangPrivateSub65">تحریر و اکسسوری آبرنگ</div><div class="abrangPrivateBadge65">🔒 اطلاعات فروشگاه در صفحه اصلی نمایش داده نمی‌شود</div><div class="abrangPrivateHint65">برای شروع، یکی از بخش‌های منوی کناری را انتخاب کنید.</div></div></div>';
    document.querySelectorAll('.navGroup').forEach(g=>{
      g.classList.add('collapsed');
      const t=g.querySelector('.navGroupTitle');
      if(t)t.setAttribute('aria-expanded','false');
    });
  }
  window.abrangShowHome65=showHome;

  function leaveHome(){document.body.classList.remove('abrangHomeMode65');document.querySelectorAll('.navGroupBody').forEach(x=>x.style.display='block');}

  function hook(){
    ensureThemeUI();showLoginLogo();
    // Wrap successful v60 login so first screen after authentication is the privacy-safe home.
    if(window.v60Login && !window.__abrangPrivacyLoginWrapped65){
      const oldLogin=window.v60Login;
      window.v60Login=async function(){
        const r=await oldLogin.apply(this,arguments);
        setTimeout(()=>{
          const ov=document.getElementById('v60Overlay');
          if(ov && ov.style.display==='none')showHome();
          ensureThemeUI();
        },80);
        return r;
      };
      window.__abrangPrivacyLoginWrapped65=true;
    }
    if(window.v60Logout && !window.__abrangPrivacyLogoutWrapped65){
      const oldLogout=window.v60Logout;
      window.v60Logout=function(){leaveHome();const r=oldLogout.apply(this,arguments);setTimeout(()=>{showLoginLogo();ensureThemeUI()},30);return r};
      window.__abrangPrivacyLogoutWrapped65=true;
    }
    if(window.go && !window.__abrangPrivacyGoWrapped65){
      const oldGo=window.go;
      window.go=function(p){leaveHome();return oldGo.apply(this,arguments)};
      window.__abrangPrivacyGoWrapped65=true;
    }
    // Make dashboard itself a privacy-safe home entry point.
    const db=document.querySelector('#nav button[data-p="dashboard"]');
    if(db){db.textContent='🏠 خانه آبرنگ';db.onclick=function(e){if(e)e.preventDefault();showHome();};}
  }
  hook();
  let settleTimer=null;
  const obs=new MutationObserver(()=>{
    clearTimeout(settleTimer);
    settleTimer=setTimeout(()=>{
      if(!document.getElementById('abrangUiTools65'))ensureThemeUI();
      if(!document.querySelector('.abrangLoginLogo65'))showLoginLogo();
    },60);
  });
  obs.observe(document.body,{childList:true,subtree:true});
  window.addEventListener('beforeunload',()=>{clearTimeout(settleTimer);obs.disconnect()},{once:true});
  window.addEventListener('load',hook,{once:true});
})();
</script>
