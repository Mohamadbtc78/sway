}

.top h1{font-size:22px;letter-spacing:-.35px}.muted{color:#718096}
.actions{gap:8px}
.btn{padding:9px 13px;border-radius:11px;font-size:11px;box-shadow:var(--shadow-sm);transition:transform .14s,box-shadow .14s}
.btn:hover{transform:translateY(-1px);box-shadow:0 7px 16px rgba(24,38,63,.10)}
.btn.sec{background:#fff;border-color:#e0e6ef}.btn.dark{background:#22314d}
.cards{grid-template-columns:repeat(6,minmax(145px,1fr));gap:12px}
.card,.panel{border-radius:17px;border-color:#e4e9f0;box-shadow:var(--shadow);overflow:hidden}
.card{padding:15px}.metric .big{font-size:22px;letter-spacing:-.25px}.metric .small{font-size:10px;color:#7a879a}
.grid2,.grid3{gap:13px}.section{margin-top:14px}
.toolbar{padding:13px 15px;background:linear-gradient(180deg,#fff,#fbfcfe);border-bottom-color:#e7ebf2}
.pad{padding:15px}.tablewrap{border-radius:0 0 17px 17px}
table{min-width:820px}th,td{padding:10px 10px;font-size:11px;border-bottom:1px solid #eef1f5}th{background:#f7f9fc;color:#5c6879;font-weight:800}tbody tr:nth-child(even){background:#fcfdff}tbody tr:hover{background:#f7f9ff}
.tag{padding:4px 8px;border:1px solid #e7ebf1;background:#f7f8fa}.tag.g{background:#edf9f3}.tag.r{background:#fff1f1}.tag.o{background:#fff6e8}.tag.b{background:#eef5ff}
.formgrid{gap:11px}.field label{font-size:10px;color:#66758a}.input,.select,.textarea{padding:9px 10px;border-radius:11px;border-color:#d9e0ea;box-shadow:inset 0 1px 2px rgba(20,30,45,.02)}
.input:focus,.select:focus,.textarea:focus{border-color:#7787df;box-shadow:0 0 0 3px rgba(79,103,216,.10)}
.sectionbox,.mini,.sumBox,.v20Card,.v20PriceBox,.v63Tile,.v63Job{border-color:#e3e8ef;border-radius:14px;box-shadow:0 3px 12px rgba(31,47,70,.03)}
.sectionbox{background:#fbfcfe}.mini{padding:10px}.sumBox{padding:11px}
.hint{border-radius:12px;background:#f5f6ff;border-color:#c9cdfb;color:#5b5f99}
.hero{gap:13px}.heroMain{padding:18px;border-radius:18px;background:linear-gradient(135deg,#f1f4ff 0%,#ffffff 72%);border-color:#e0e6f5}.heroMain h2{font-size:25px}
.v63Hero{border-radius:18px;padding:20px;background:linear-gradient(135deg,#1b2a46,#293a5d);box-shadow:0 14px 34px rgba(20,34,58,.17)}
.v63Tiles,.v63Quick{gap:12px}.v63Tile{transition:transform .16s,box-shadow .16s}.v63Tile:hover{transform:translateY(-3px);box-shadow:0 12px 25px rgba(31,47,70,.10)}
.v20Hero{border-radius:18px;padding:18px;background:linear-gradient(135deg,#1d2c48,#304363)}
.scan{border-radius:15px;background:linear-gradient(135deg,#17243a,#233652)}
.modal{background:rgba(12,21,35,.48);backdrop-filter:blur(3px)}.modalbox{border-radius:18px;box-shadow:0 22px 60px rgba(0,0,0,.18);padding:18px}
.close{border-radius:10px}.tabs{padding:9px}.tab{border-radius:10px;padding:8px 11px}.tab.active{box-shadow:0 5px 12px rgba(79,103,216,.18)}
.summary{gap:10px}.bar{background:#edf1f6}.bar i{background:linear-gradient(90deg,var(--primary),var(--lav))}
.posLines .line{gap:7px}.posLines .line .input,.posLines .line .select{border-radius:10px}
@media(max-width:1250px){.side{width:248px;min-width:248px}.cards{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.main{padding:14px}.top{top:8px}.side{width:230px;min-width:230px}.formgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.app{display:block}.side{position:relative;width:100%;min-width:0;height:auto;max-height:none}.nav{display:grid;grid-template-columns:1fr 1fr;gap:6px}.navGroup{margin:0}.navGroupBody button{font-size:10px}.main{padding:10px}.top{position:relative;top:0}.cards,.formgrid{grid-template-columns:1fr}.top{align-items:flex-start}.actions{width:100%}}
@media print{body{background:#fff}.side,.top{display:none!important}.main{padding:0;max-width:none}.card,.panel{box-shadow:none}.modal{background:#fff}}
</style>

function mixedServiceAdd(id){const sv=serviceById(id);if(!sv)return;const ex=mixedDraft.services.find(i=>i.serviceId===id);if(ex)ex.qty=n(ex.qty)+1;else mixedDraft.services.push({serviceId:id,name:sv.name,unit:sv.unit,qty:1,price:n(sv.sell),cost:n(sv.cost)});mixedRenderBody()}
function mixedCalc(){
  const goodsSub=mixedDraft.goods.reduce((a,i)=>a+Math.max(0,n(i.qty)*n(i.price)-n(i.discount)),0);
  const serviceSub=mixedDraft.services.reduce((a,i)=>a+Math.max(0,n(i.qty)*n(i.price)),0);
  const sub=goodsSub+serviceSub;
  const disc=Math.min(sub,Math.max(0,n(mixedDraft.discount)));
  const goodsDisc=sub?disc*(goodsSub/sub):0;
  const serviceDisc=disc-goodsDisc;
  const goodsTotal=Math.max(0,goodsSub-goodsDisc), serviceTotal=Math.max(0,serviceSub-serviceDisc), total=goodsTotal+serviceTotal;
  const paid=mixedDraft.payment==='نسیه'?0:(mixedDraft.paid===null?total:Math.min(total,Math.max(0,n(mixedDraft.paid))));
  const goodsPaid=Math.min(goodsTotal,paid), servicePaid=Math.max(0,paid-goodsPaid);
  return {goodsSub,serviceSub,sub,disc,goodsDisc,serviceDisc,goodsTotal,serviceTotal,total,paid,goodsPaid,servicePaid,rem:Math.max(0,total-paid),goodsRem:Math.max(0,goodsTotal-goodsPaid),serviceRem:Math.max(0,serviceTotal-servicePaid)};
}

function normalizeSearchText(v){return String(v??'').toLowerCase().trim().replace(/[يى]/g,'ی').replace(/[ك]/g,'ک').replace(/\u200c/g,' ').replace(/\s+/g,' ')}

function syncProductCodeSequence(x=data){
  x.seq=x.seq||{};
  const prefix=String(x.settings?.prefix||'A');
  let max=0;
  (x.products||[]).forEach(p=>{
    const m=String(p.code||'').match(new RegExp('^'+prefix+'(\\d+)$'));
    if(m)max=Math.max(max,Number(m[1])||0);
  });
  x.seq.productCode=Math.max(Number(x.seq.productCode)||1,max+1);
}
function nextProductCode(){
  syncProductCodeSequence(data);
  const prefix=String(data.settings.prefix||'A');
  let num=Math.max(1,Number(data.seq.productCode)||1),code='';
  do{code=prefix+String(num).padStart(6,'0');num++;}while(data.products.some(p=>String(p.code||'').trim()===code));
  data.seq.productCode=num;
  return code;
}
function digitsFa(v){return String(v??'').replace(/[۰-۹]/g,d=>String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d))).replace(/[٠-٩]/g,d=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)))}
function searchTokens(v){const t=normalizeSearchText(digitsFa(v));return t.split(/\s+/).filter(Boolean)}
function fuzzyScore(hay,query){const h=normalizeSearchText(digitsFa(hay)), qs=searchTokens(query);if(!qs.length)return 0;let score=0;for(const q of qs){if(!q)continue;if(h===q)score+=120;else if(h.startsWith(q))score+=90;else if(h.includes(' '+q))score+=80;else if(h.includes(q))score+=55;else{let qi=0;for(const ch of h){if(ch===q[qi])qi++;if(qi===q.length)break}if(qi===q.length)score+=30;}}return score}
function productSearchText(p){return [p.name,p.code,p.barcode,p.brand,p.cat,p.shelf,p.note].map(normalizeSearchText).join(' ')}
function searchProducts(query,opts={}){const q=normalizeSearchText(digitsFa(query));const cat=opts.cat||'',brand=opts.brand||'',stock=opts.stock||'all',hasBarcode=opts.hasBarcode||'',min=opts.min==null?'':opts.min,max=opts.max==null?'':opts.max,sort=opts.sort||'relevance';let arr=data.products.filter(p=>{if(cat&&p.cat!==cat)return false;if(brand&&p.brand!==brand)return false;if(stock==='low'&&n(p.stock)>n(p.minStock))return false;if(stock==='out'&&n(p.stock)>0)return false;if(stock==='available'&&n(p.stock)<=0)return false;if(hasBarcode==='yes'&&!p.barcode)return false;if(hasBarcode==='no'&&p.barcode)return false;if(min!==''&&n(p.sell)<n(min))return false;if(max!==''&&n(p.sell)>n(max))return false;return true}).map(p=>({p,score:q?fuzzyScore(productSearchText(p),q):1}));if(q)arr=arr.filter(x=>x.score>0);if(sort==='name')arr.sort((a,b)=>String(a.p.name).localeCompare(String(b.p.name),'fa'));else if(sort==='stock')arr.sort((a,b)=>n(b.p.stock)-n(a.p.stock));else if(sort==='priceAsc')arr.sort((a,b)=>n(a.p.sell)-n(b.p.sell));else if(sort==='priceDesc')arr.sort((a,b)=>n(b.p.sell)-n(a.p.sell));else arr.sort((a,b)=>b.score-a.score||String(a.p.name).localeCompare(String(b.p.name),'fa'));return arr}
function rememberSearch(q){const x=normalizeSearchText(q);if(!x)return;data.recentSearches=[x,...(data.recentSearches||[]).filter(v=>v!==x)].slice(0,10);save(true)}

function topProducts(ss,limit=10){const m={};ss.forEach(s=>s.items.forEach(i=>m[i.productId]=(m[i.productId]||0)+n(i.qty)));return Object.entries(m).map(([id,q])=>{const p=product(id);return {name:p?.name||'کالای حذف‌شده',qty:q}}).sort((a,b)=>b.qty-a.qty).slice(0,limit)}
function salesTable(rows){if(!rows.length)return '<div class="empty">فاکتوری ثبت نشده است.</div>';return `<div class="tablewrap"><table><tr><th>شماره</th><th>تاریخ</th><th>مشتری</th><th>مبلغ</th><th>نوع پرداخت / دریافتی</th><th>مانده</th><th>سود</th><th>وضعیت</th><th>عملیات</th></tr>${rows.map(s=>`<tr class="${s.status==='cancelled'?'danger':''}"><td>${esc(s.no)}</td><td>${esc(s.date)}</td><td>${esc(s.partyName||'متفرقه')}</td><td>${money(s.total)}</td><td><span class="tag b">${esc(s.paymentType||'نقدی')}</span> · ${money(s.paid)}</td><td>${money(s.remaining)}</td><td>${money(s.profit)}</td><td><span class="tag ${s.status==='cancelled'?'r':s.status==='returned'?'o':'g'}">${s.status==='cancelled'?'لغو':s.status==='returned'?'برگشتی':'فعال'}</span></td><td><button class="btn sec" onclick="viewSale('${s.id}')">جزئیات</button> <button class="btn sec" onclick="printSale('${s.id}',false)">A4</button> <button class="btn sec" onclick="printSale('${s.id}',true)">حرارتی</button>${s.status==='active'?` <button class="btn sec" onclick="editSale('${s.id}')">اصلاح فاکتور</button> <button class="btn orange" onclick="returnSale('${s.id}')">برگشت</button> <button class="btn red" onclick="cancelSale('${s.id}')">لغو</button>`:''}</td></tr>`).join('')}</table></div>`}

function posPage(){return `<div class="quickGrid"><div><div class="panel"><div class="toolbar"><div class="left"><b>فروش سریع</b><span class="shortcut">F8 جستجو</span><span class="shortcut">Enter افزودن</span></div><div class="right"><button class="btn sec" onclick="clearDraft()">فاکتور جدید</button><button class="btn green" onclick="commitDraft(true)">ثبت و چاپ</button><button class="btn blue" onclick="commitDraft(false)">ثبت بدون چاپ</button></div></div><div class="pad"><div class="sectionbox"><h3>فروش سریع کالاهای پرتکرار</h3><div class="v18chips">${v18TopProductButtons()}</div></div><div class="scan"><label>بارکد / کد کالا / نام کالا</label><div class="suggest"><input id="scan" class="input" autocomplete="off" placeholder="بارکد را اسکن کن یا نام کالا را بنویس..." oninput="suggestPOS()" onkeydown="scanKey(event)"><div id="suggestList" class="suggestList"></div></div></div><div class="sectionbox" style="margin-top:10px"><div class="formgrid"><div class="field"><label>مشتری</label><select id="posParty" class="select" onchange="draft.partyId=this.value"><option value="">متفرقه / نقدی</option>${data.parties.filter(p=>p.type==='customer').map(p=>`<option value="${p.id}" ${draft.partyId===p.id?'selected':''}>${esc(p.name)} · مانده ${money(p.balance)}</option>`).join('')}</select></div><div class="field"><label>پرداخت</label><select id="posPay" class="select" onchange="draft.payment=this.value;recalcPOS()"><option ${draft.payment==='نقدی'?'selected':''}>نقدی</option><option ${draft.payment==='کارتخوان'?'selected':''}>کارتخوان</option><option ${draft.payment==='کارت‌به‌کارت'?'selected':''}>کارت‌به‌کارت</option><option ${draft.payment==='نسیه'?'selected':''}>نسیه</option></select></div><div class="field"><label>تخفیف فاکتور</label><input id="posDisc" class="input" type="number" value="${draft.discount||0}" oninput="draft.discount=n(this.value);recalcPOS()"></div><div class="field"><label>دریافتی</label><input id="posPaid" class="input" type="number" value="${draft.paid===null?'':draft.paid}" placeholder="خالی = تسویه کامل" oninput="draft.paid=this.value===''?null:n(this.value);recalcPOS()"></div></div></div><div id="posLines">${posLinesHtml()}</div><div id="posSummary"></div></div></div></div><div><div class="panel"><div class="toolbar"><b>خلاصه فاکتور</b></div><div class="pad" id="posSide"></div></div><div class="panel section"><div class="toolbar"><b>میانبرهای سریع</b></div><div class="pad"><div class="actions"><button class="btn sec" onclick="openProduct()">+ کالای جدید</button><button class="btn sec" onclick="go('products')">لیست کالاها</button><button class="btn sec" onclick="go('parties')">مشتری‌ها</button></div><p class="muted" style="line-height:1.9;margin-top:10px">برای بارکدخوان USB، کافی است داخل کادر بارکد قرار داشته باشی. اکثر بارکدخوان‌ها پس از اسکن Enter می‌فرستند و کالا بلافاصله اضافه می‌شود.</p></div></div></div></div>`}
function posLinesHtml(){if(!draft.items.length)return '<div class="empty">برای شروع، بارکد کالا را اسکن کن یا نام کالا را جستجو کن.</div>';return `<div class="tablewrap posLines"><table><tr><th>کالا</th><th>موجودی</th><th>تعداد</th><th>قیمت</th><th>تخفیف ردیف</th><th>جمع</th><th></th></tr>${draft.items.map((i,idx)=>{const p=product(i.productId),stock=n(p?.stock);return `<tr><td><b>${esc(p?.name||i.name)}</b><div class="muted">${esc(p?.barcode||p?.code||'')}</div></td><td><span class="tag ${stock<i.qty?'r':'g'}">${qty(stock)}</span></td><td><input class="input" type="number" min="1" value="${i.qty}" onchange="draft.items[${idx}].qty=Math.max(1,n(this.value));renderPOSBody()"></td><td><input class="input" type="number" value="${i.price}" onchange="draft.items[${idx}].price=n(this.value);renderPOSBody()"></td><td><input class="input" type="number" value="${i.discount||0}" onchange="draft.items[${idx}].discount=n(this.value);renderPOSBody()"></td><td>${money(Math.max(0,i.qty*i.price-(i.discount||0)))}</td><td><button class="btn red" style="padding:5px 8px" onclick="draft.items.splice(${idx},1);renderPOSBody()">×</button></td></tr>`}).join('')}</table></div>`}
function renderPOSBody(){document.getElementById('posLines').innerHTML=posLinesHtml();recalcPOS();}
function posCalc(){const sub=draft.items.reduce((a,i)=>a+Math.max(0,n(i.qty)*n(i.price)-n(i.discount)),0);const disc=n(draft.discount);const total=Math.max(0,sub-disc);const paid=draft.paid===null?total:Math.min(total,n(draft.paid));return {sub,disc,total,paid,rem:Math.max(0,total-paid)}}
function recalcPOS(){if(!document.getElementById('posSummary'))return;const c=posCalc();document.getElementById('posSummary').innerHTML=`<div class="summary"><div class="sumBox">جمع کالاها<b>${money(c.sub)}</b></div><div class="sumBox">تخفیف<b>${money(c.disc)}</b></div><div class="sumBox">قابل پرداخت<b>${money(c.total)}</b></div><div class="sumBox">دریافتی<b>${money(c.paid)}</b></div><div class="sumBox">مانده<b>${money(c.rem)}</b></div><div class="sumBox">تعداد اقلام<b>${qty(draft.items.reduce((a,i)=>a+n(i.qty),0))}</b></div></div>`;const side=document.getElementById('posSide');if(side)side.innerHTML=`<div class="miniGrid"><div class="mini">جمع خرید مشتری<b>${money(c.total)}</b></div><div class="mini">تخفیف<b>${money(c.disc)}</b></div><div class="mini">دریافتی<b>${money(c.paid)}</b></div><div class="mini">مانده<b>${money(c.rem)}</b></div></div><div class="hint" style="margin-top:9px">مشتری متفرقه نیاز به پرونده ندارد. برای مشتری ثبت‌شده، مانده بدهی به‌صورت خودکار در حساب او ذخیره می‌شود.</div>`}
function suggestPOS(){const q=val('scan').trim(),box=document.getElementById('suggestList');if(!q){box.innerHTML='';return}const arr=searchProducts(q,{sort:'relevance'}).slice(0,12);box.innerHTML=arr.map(({p,score})=>`<div class="suggestItem" onclick="addDraft('${p.id}')"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(p.name)}</b><span>${money(p.sell)}</span></div><div class="muted">${esc(p.code||'-')} · ${esc(p.barcode||'-')} · ${esc(p.brand||'-')} · موجودی ${qty(p.stock)}${score?` · تطبیق ${score}`:''}</div></div>`).join('')||'<div class="suggestItem">یافت نشد</div>'}
function scanKey(e){if(e.key!=='Enter')return;e.preventDefault();const q=val('scan').trim();if(!q)return;let p=data.products.find(x=>String(x.barcode||'')===q)||data.products.find(x=>String(x.code||'')===q)||data.products.find(x=>(x.name||'').toLowerCase()===q.toLowerCase());if(!p){alert('کالا پیدا نشد');return}addDraft(p.id)}
function addDraft(id){const p=product(id);if(!p)return;const ex=draft.items.find(i=>i.productId===id);if(ex)ex.qty++;else draft.items.push({productId:id,name:p.name,qty:1,price:n(p.sell),discount:0});if(document.getElementById('scan'))document.getElementById('scan').value='';if(document.getElementById('suggestList'))document.getElementById('suggestList').innerHTML='';renderPOSBody()}
function clearDraft(){draft={items:[],discount:0,paid:null,payment:'نقدی',partyId:''};render()}
function commitDraft(print=true){const c=posCalc();if(!draft.items.length)return alert('فاکتور خالی است');for(const i of draft.items){const p=product(i.productId);if(!p||n(p.stock)<n(i.qty))return alert('موجودی '+(p?.name||'کالا')+' کافی نیست')}if(draft.payment==='نسیه' && !draft.partyId && c.paid<c.total)return alert('برای فروش نسیه یا دارای مانده، مشتری ثبت‌شده انتخاب کن');const pa=party(draft.partyId);const s=createSale(draft.items,pa?.id||'',pa?.name||'متفرقه',c.sub,c.disc,c.total,c.paid,draft.payment);applySale(s);draft={items:[],discount:0,paid:null,payment:'نقدی',partyId:''};save(true);if(print)printSale(s.id,false);render()}
function createSale(items,partyId,partyName,sub,discount,total,paid,payment){const no=data.settings.prefix+String(data.seq.sale++).padStart(6,'0');const enriched=items.map(i=>{const p=product(i.productId);return {...i,buy:n(p.avgBuy||p.buy),price:n(i.price),lineTotal:Math.max(0,n(i.qty)*n(i.price)-n(i.discount))}});const profit=enriched.reduce((a,i)=>a+n(i.qty)*(n(i.price)-n(i.buy))-n(i.discount),0)-n(discount);return {id:uid(),no,isoDate:todayISO(),date:faDate(),partyId,partyName,items:enriched,subtotal:sub,discount,total,paid:Math.min(total,paid),remaining:Math.max(0,total-paid),paymentType:payment,profit,status:'active',createdAt:new Date().toISOString()}}
function applySale(s){s.items.forEach(i=>{const p=product(i.productId),before=n(p.stock);p.stock-=n(i.qty);data.moves.push({id:uid(),isoDate:s.isoDate,date:s.date,type:'فروش',productId:p.id,qty:-n(i.qty),before,after:p.stock,ref:s.no})});data.sales.push(s);if(s.paid) cashAdd('دریافت فروش',s.paid,s.paymentType,s.partyName,s.no);if(s.remaining>0&&s.partyId){const p=party(s.partyId);p.balance=n(p.balance)+s.remaining}}

function salesPage(){return `<div class="panel"><div class="toolbar"><div class="left"><b>فاکتورها</b><span class="tag b">اصلاح پرداخت فعال است</span><input id="salesQ" class="input" style="width:230px" placeholder="شماره، مشتری یا بارکد" oninput="filterSales()"><input id="salesD" class="input" style="width:145px" placeholder="تاریخ شمسی" oninput="filterSales()"></div><div class="right"><button class="btn green" onclick="go('pos')">+ فروش جدید</button><button class="btn sec" onclick="printDayReport()">چاپ گزارش روز</button></div></div><div id="salesList">${salesTable(activeSales().slice().reverse())}</div></div>`}
function filterSales(){const q=val('salesQ').trim().toLowerCase(),d=val('salesD').trim();const arr=activeSales().filter(s=>(!q||String(s.no).toLowerCase().includes(q)||String(s.partyName).toLowerCase().includes(q)||s.items.some(i=>(product(i.productId)?.barcode||'').includes(q)))&&(!d||s.date.includes(d))).slice().reverse();document.getElementById('salesList').innerHTML=salesTable(arr)}
function viewSale(id){const s=data.sales.find(x=>x.id===id);if(!s)return;modal('جزئیات '+s.no,`<div class="miniGrid"><div class="mini">تاریخ<b>${esc(s.date)}</b></div><div class="mini">مشتری<b>${esc(s.partyName)}</b></div><div class="mini">فروش<b>${money(s.total)}</b></div><div class="mini">سود<b>${money(s.profit)}</b></div></div><div style="margin-top:10px">${s.items.map(i=>`<div class="sectionbox"><b>${esc(i.name)}</b> · ${qty(i.qty)} × ${money(i.price)} · جمع ${money(i.lineTotal)}</div>`).join('')}</div><div class="actions"><button class="btn" onclick="printSale('${s.id}',false)">چاپ A4</button><button class="btn dark" onclick="printSale('${s.id}',true)">چاپ حرارتی</button>${s.status==='active'?`<button class="btn blue" onclick="closeModal();editSale('${s.id}')">اصلاح فاکتور</button><button class="btn orange" onclick="closeModal();returnSale('${s.id}')">برگشت کالا</button>`:''}<button class="btn sec" onclick="closeModal()">بستن</button></div>`)}
function editSale(id){const s=data.sales.find(x=>x.id===id);if(!s||s.status!=='active')return alert('این فاکتور قابل اصلاح نیست');const body=`<div class="hint">برای اصلاح اشتباه بعد از ثبت فاکتور، روش پرداخت و مبلغ دریافتی را اصلاح کن. تخفیف و مشتری نیز قابل اصلاح‌اند؛ اقلام و قیمت‌های ردیف‌ها در این اصلاح‌گر تغییر نمی‌کنند تا موجودی و سابقه انبار امن بماند.</div><div class="miniGrid"><div class="mini">شماره فاکتور<b>${esc(s.no)}</b></div><div class="mini">مبلغ فعلی<b>${money(s.total)}</b></div><div class="mini">دریافتی فعلی<b>${money(s.paid)}</b></div><div class="mini">مانده فعلی<b>${money(s.remaining)}</b></div></div><div class="sectionbox" style="margin-top:10px"><div class="formgrid"><div class="field"><label>مشتری</label><select id="editParty" class="select"><option value="">متفرقه</option>${data.parties.filter(p=>p.type==='customer').map(p=>`<option value="${p.id}" ${s.partyId===p.id?'selected':''}>${esc(p.name)} · مانده ${money(p.balance)}</option>`).join('')}</select></div><div class="field"><label>روش پرداخت</label><select id="editPay" class="select"><option ${s.paymentType==='نقدی'?'selected':''}>نقدی</option><option ${s.paymentType==='کارتخوان'?'selected':''}>کارتخوان</option><option ${s.paymentType==='کارت‌به‌کارت'?'selected':''}>کارت‌به‌کارت</option><option ${s.paymentType==='نسیه'?'selected':''}>نسیه</option></select></div><div class="field"><label>تخفیف فاکتور</label><input id="editDisc" class="input" type="number" min="0" value="${n(s.discount)}"></div><div class="field"><label>دریافتی</label><input id="editPaid" class="input" type="number" min="0" value="${n(s.paid)}"></div></div><div id="editPreview" style="margin-top:10px"></div></div><div class="actions"><button class="btn green" onclick="saveSaleEdit('${id}')">ذخیره اصلاحات</button><button class="btn sec" onclick="closeModal()">انصراف</button></div>`;window.__editSaleCurrent=s;modal('اصلاح فاکتور — '+s.no,body);document.getElementById('editDisc').addEventListener('input',updateSaleEditPreview);document.getElementById('editPaid').addEventListener('input',updateSaleEditPreview);updateSaleEditPreview()}
function updateSaleEditPreview(){const el=document.getElementById('editPreview');if(!el)return;const t=window.__editSaleCurrent||null;const disc=Math.max(0,n(val('editDisc')));const s=t||{};const sub=n(s.subtotal);const total=Math.max(0,sub-disc);const paid=Math.min(total,Math.max(0,n(val('editPaid'))));const rem=Math.max(0,total-paid);el.innerHTML=`<div class="summary"><div class="sumBox">جمع قبل تخفیف<b>${money(sub)}</b></div><div class="sumBox">تخفیف<b>${money(disc)}</b></div><div class="sumBox">مبلغ نهایی<b>${money(total)}</b></div><div class="sumBox">دریافتی<b>${money(paid)}</b></div><div class="sumBox">مانده<b>${money(rem)}</b></div></div>`}
function saveSaleEdit(id){const s=data.sales.find(x=>x.id===id);if(!s||s.status!=='active')return alert('این فاکتور قابل اصلاح نیست');const sub=n(s.subtotal),disc=Math.min(sub,Math.max(0,n(val('editDisc')))),total=Math.max(0,sub-disc),paid=Math.min(total,Math.max(0,n(val('editPaid')))),rem=Math.max(0,total-paid),pay=val('editPay')||'نقدی',newParty=party(val('editParty'));if(rem>0&&!newParty)return alert('برای فاکتور دارای مانده، مشتری ثبت‌شده انتخاب کن');const oldParty=s.partyId?party(s.partyId):null,oldRem=n(s.remaining),oldPaid=n(s.paid);if(oldParty)oldParty.balance=n(oldParty.balance)-oldRem;if(newParty)newParty.balance=n(newParty.balance)+rem;const cashIdx=data.cash.findIndex(x=>x.ref===s.no&&x.type==='دریافت فروش');if(cashIdx>=0){if(paid>0){data.cash[cashIdx].amount=paid;data.cash[cashIdx].paymentType=pay;data.cash[cashIdx].partyName=newParty?.name||'متفرقه';data.cash[cashIdx].isoDate=s.isoDate||data.cash[cashIdx].isoDate;data.cash[cashIdx].date=s.date||data.cash[cashIdx].date}else data.cash.splice(cashIdx,1)}else if(paid>0){cashAdd('دریافت فروش',paid,pay,newParty?.name||'متفرقه',s.no)}s.discount=disc;s.total=total;s.paid=paid;s.remaining=rem;s.paymentType=pay;s.partyId=newParty?.id||'';s.partyName=newParty?.name||'متفرقه';s.profit=Math.max(0,s.items.reduce((a,i)=>a+n(i.qty)*(n(i.price)-n(i.buy))-n(i.discount),0)-disc);audit('اصلاح فاکتور',s.no+' · '+pay+' · '+paid);closeModal();save()}
function cancelSale(id){const s=data.sales.find(x=>x.id===id);if(!s||s.status!=='active')return;if(!confirm('فاکتور لغو شود و فقط بخش‌های برگشت‌نشده معکوس شوند؟'))return;reverseSaleAmounts(s);s.status='cancelled';audit('لغو فاکتور',s.no);save()}
function reverseSaleAmounts(s){let refund=0,profitBack=0;for(const i of s.items){const remaining=n(i.qty)-n(i.returnedQty);if(remaining<=0)continue;const p=product(i.productId);if(!p)continue;const before=n(p.stock);p.stock+=remaining;data.moves.push({id:uid(),isoDate:todayISO(),date:faDate(),type:'لغو فروش',productId:p.id,qty:remaining,before,after:p.stock,ref:s.no});refund+=remaining*n(i.price);profitBack+=remaining*(n(i.price)-n(i.buy))}const alreadyReturned=n(s.returnedAmount||s.returned||0);const originalPaid=n(s.paid);const cashRefund=Math.max(0,Math.min(refund,originalPaid-alreadyReturned));if(cashRefund)cashAdd('برگشت وجه لغو فاکتور',-cashRefund,s.paymentType,s.partyName,s.no);if(s.partyId&&s.remaining>0){const p=party(s.partyId);const debtReduction=Math.min(refund,s.remaining);p.balance=Math.max(0,n(p.balance)-debtReduction)}s.profit-=profitBack;s.returned=(s.returned||0)+refund;s.returnedAmount=(s.returnedAmount||0)+refund}
function returnSale(id){const s=data.sales.find(x=>x.id===id);if(!s||s.status!=='active')return;const body=`<div class="hint">تعداد برگشتی فقط تا سقف تعداد باقی‌مانده هر قلم قابل ثبت است. موجودی کالا برمی‌گردد و مبلغ برگشتی بر اساس قیمت همان فاکتور محاسبه می‌شود.</div><div class="tablewrap"><table><tr><th>کالا</th><th>فروش</th><th>تعداد اصلی</th><th>برگشتی قبلی</th><th>باقی‌مانده</th><th>برگشت جدید</th></tr>${s.items.map((i,idx)=>{const rem=Math.max(0,n(i.qty)-n(i.returnedQty));return `<tr><td>${esc(i.name)}</td><td>${money(i.price)}</td><td>${qty(i.qty)}</td><td>${qty(i.returnedQty||0)}</td><td>${qty(rem)}</td><td><input id="ret_${idx}" class="input" type="number" min="0" max="${rem}" value="0" ${rem===0?'disabled':''}></td></tr>`}).join('')}</table></div><div class="formgrid" style="margin-top:9px"><div class="field"><label>روش برگشت وجه</label><select id="retPay" class="select"><option>${esc(s.paymentType||'نقدی')}</option><option>نقدی</option><option>کارتخوان</option><option>کارت‌به‌کارت</option></select></div><div class="field"><label>شرح</label><input id="retNote" class="input" placeholder="اختیاری"></div></div><div class="actions" style="margin-top:10px"><button class="btn orange" onclick="applyReturn('${id}')">ثبت برگشت</button><button class="btn sec" onclick="closeModal()">انصراف</button></div>`;modal('برگشت کالا — '+s.no,body)}
function applyReturn(id){const s=data.sales.find(x=>x.id===id);if(!s)return;let retTotal=0,retProfit=0,any=false;for(let idx=0;idx<s.items.length;idx++){const i=s.items[idx],remainingLine=Math.max(0,n(i.qty)-n(i.returnedQty));const q=Math.max(0,Math.min(remainingLine,n(document.getElementById('ret_'+idx)?.value)));if(!q)continue;any=true;const p=product(i.productId);if(p){const before=n(p.stock);p.stock+=q;data.moves.push({id:uid(),isoDate:todayISO(),date:faDate(),type:'برگشت فروش',productId:p.id,qty:q,before,after:p.stock,ref:s.no})}i.returnedQty=n(i.returnedQty)+q;retTotal+=q*n(i.price);retProfit+=q*(n(i.price)-n(i.buy))}if(!any)return alert('تعداد برگشتی معتبر وارد نشده است');s.returned=(s.returned||0)+retTotal;s.returnedAmount=(s.returnedAmount||0)+retTotal;s.profit-=retProfit;const pay=val('retPay')||s.paymentType;cashAdd('برگشت وجه',-retTotal,pay,s.partyName,s.no);if(s.partyId&&s.remaining>0){const pa=party(s.partyId);pa.balance=Math.max(0,n(pa.balance)-Math.min(retTotal,s.remaining))}if(s.items.every(i=>n(i.returnedQty)>=n(i.qty)))s.status='returned';audit('برگشت فروش',s.no+' · '+retTotal);closeModal();save()}


function productCard(id){
  const p=product(id); if(!p)return alert('کالا پیدا نشد');
  const ss=activeSales();
  const rows=[]; let sold7=0,sold30=0,revenue30=0,profit30=0,lastSale='-';
  const now=new Date(), d7=new Date(now.getTime()-7*86400000), d30=new Date(now.getTime()-30*86400000);
  ss.forEach(s=>{const dt=new Date(String(s.isoDate||s.date||'')); if(!s.items)return; s.items.forEach(it=>{if(it.productId!==id)return; const q=n(it.qty); if(dt>=d7)sold7+=q; if(dt>=d30){sold30+=q; revenue30+=q*n(it.price); profit30+=q*(n(it.price)-n(it.cost||p.avgBuy||p.buy));} if(dt>=d30 && (!lastSale||String(s.isoDate||s.date||'')>lastSale))lastSale=s.date||s.isoDate||'-';});});
  const stock=n(p.stock), avg=n(p.avgBuy||p.buy), sell=n(p.sell), margin=sell?((sell-avg)/sell*100):0;
  const daysCover=sold30>0?Math.floor(stock/(sold30/30)):'-';
  modal('کارت کامل کالا — '+esc(p.name),
   `<div class="miniGrid"><div class="mini">کد کالا<b>${esc(p.code||'-')}</b></div><div class="mini">بارکد<b>${esc(p.barcode||'-')}</b></div><div class="mini">موجودی<b>${qty(stock)}</b></div><div class="mini">قفسه<b>${esc(p.shelf||'-')}</b></div></div>`+
   `<div class="miniGrid" style="margin-top:8px"><div class="mini">میانگین خرید<b>${money(avg)}</b></div><div class="mini">فروش عادی<b>${money(sell)}</b></div><div class="mini">سود از فروش<b>${margin.toFixed(1)}%</b></div><div class="mini">حداقل موجودی<b>${qty(p.minStock)}</b></div></div>`+
   `<div class="miniGrid" style="margin-top:8px"><div class="mini">فروش ۷ روز<b>${qty(sold7)}</b></div><div class="mini">فروش ۳۰ روز<b>${qty(sold30)}</b></div><div class="mini">درآمد ۳۰ روز<b>${money(revenue30)}</b></div><div class="mini">سود ۳۰ روز<b>${money(profit30)}</b></div></div>`+
   `<div class="sectionbox" style="margin-top:10px"><b>پوشش موجودی:</b> ${daysCover==='-'?'بدون سابقه فروش':daysCover+' روز'} · <b>آخرین فروش:</b> ${esc(lastSale)}<br><span class="muted">این کارت برای کنترل سریع قیمت، موجودی و عملکرد فروش کالا طراحی شده است.</span></div>`+
   `<div class="actions"><button class="btn green" onclick="addDraft('${p.id}');closeModal();go('pos')">فروش این کالا</button><button class="btn blue" onclick="stockAdjust('${p.id}')">اصلاح موجودی</button><button class="btn sec" onclick="closeModal();openProduct('${p.id}')">ویرایش کالا</button></div>`
  );
}

function productTable(rows){if(!rows.length)return '<div class="empty">کالایی ثبت نشده است.</div>';return `<div class="tablewrap"><table><tr><th>کد</th><th>بارکد</th><th>نام کالا</th><th>دسته</th><th>قیمت خرید</th><th>قیمت فروش</th><th>سود %</th><th>موجودی</th><th>حداقل</th><th>قفسه</th><th>عملیات</th></tr>${rows.map(p=>{const margin=n(p.sell)?Math.round((n(p.sell)-n(p.avgBuy))/n(p.sell)*100):0;return `<tr class="${n(p.stock)<=n(p.minStock)?'danger':''}"><td>${esc(p.code||'-')}</td><td>${esc(p.barcode||'-')}</td><td><b>${esc(p.name)}</b><div class="muted">${esc(p.brand||'')}</div></td><td>${esc(p.cat||'-')}</td><td>${money(p.avgBuy)}</td><td><b>${money(p.sell)}</b></td><td><span class="tag ${margin<20?'r':'g'}">${margin}%</span></td><td><span class="tag ${n(p.stock)<=n(p.minStock)?'r':'g'}">${qty(p.stock)}</span></td><td>${qty(p.minStock)}</td><td>${esc(p.shelf||'-')}</td><td><button class="btn sec" onclick="openProduct('${p.id}')">ویرایش</button> <button class="btn blue" onclick="stockAdjust('${p.id}')">موجودی</button></td></tr>`}).join('')}</table></div>`}

function openProduct(id=''){const p=id?product(id):{id:'',name:'',code:nextProductCode(),barcode:'',cat:'لوازم تحریر',brand:'',unit:'عدد',buy:0,avgBuy:0,sell:0,stock:0,minStock:3,shelf:'',note:'',reorderDays:14};modal(id?'ویرایش کالا':'ثبت کالای جدید',`<div class="sectionbox"><h3>اطلاعات پایه کالا</h3><div class="formgrid"><div class="field"><label>نام کالا *</label><input id="pn" class="input" value="${esc(p.name)}"></div><div class="field"><label>کد کالا ${id?'':'(خودکار)'}</label><div class="actions"><input id="pc" class="input" value="${esc(p.code)}" ${id?'':'readonly'} style="flex:1"><button class="btn sec" type="button" onclick="regenProductCode()">تولید کد جدید</button></div></div><div class="field"><label>بارکد</label><input id="pb" class="input" value="${esc(p.barcode)}"></div><div class="field"><label>دسته‌بندی</label><input id="pca" class="input" value="${esc(p.cat)}"></div><div class="field"><label>برند</label><input id="pbr" class="input" value="${esc(p.brand)}"></div><div class="field"><label>واحد فروش</label><select id="pu" class="select"><option ${p.unit==='عدد'?'selected':''}>عدد</option><option ${p.unit==='بسته'?'selected':''}>بسته</option><option ${p.unit==='کیلو'?'selected':''}>کیلو</option><option ${p.unit==='متر'?'selected':''}>متر</option></select></div><div class="field"><label>قفسه</label><input id="psh" class="input" value="${esc(p.shelf)}"></div><div class="field"><label>حداقل موجودی</label><input id="pmin" class="input" type="number" value="${n(p.minStock)}"></div><div class="field"><label>روزهای پوشش هدف</label><input id="preorder" class="input" type="number" value="${n(p.reorderDays||14)}"></div></div></div><div class="sectionbox"><h3>قیمت‌گذاری و موجودی</h3><div class="formgrid"><div class="field"><label>قیمت خرید فعلی</label><input id="pbu" class="input" type="number" value="${n(p.buy||p.avgBuy)}" oninput="syncProductProfit('buy')"></div><div class="field"><label>میانگین خرید / بهای تمام‌شده</label><input id="pavg" class="input" type="number" value="${n(p.avgBuy||p.buy)}" oninput="syncProductProfit('cost')"></div><div class="field"><label>قیمت فروش</label><input id="psel" class="input" type="number" value="${n(p.sell)}" oninput="syncProductProfit('sell')"></div><div class="field"><label>درصد سود روی قیمت خرید</label><div class="actions"><input id="ppct" class="input" type="number" step="0.01" value="${p.sell&&((p.avgBuy||p.buy)>0)?(((n(p.sell)/(n(p.avgBuy||p.buy)))-1)*100).toFixed(2):''}" oninput="syncProductProfit('pct')" style="flex:1"><span class="tag b">مثال: ۱۰٪</span></div></div><div class="field"><label>حاشیه سود از قیمت فروش</label><input id="pmargin" class="input" value="" disabled></div><div class="field"><label>تعداد موجودی</label><input id="pst" class="input" type="number" value="${n(p.stock)}"></div><div class="field" style="grid-column:span 3"><label>قیمت فروش محاسبه‌شده</label><div class="actions"><div id="pselPreview" class="input" style="background:#f8fafc;font-weight:900;flex:1">${p.sell?n(p.sell):0}</div><button class="btn sec" type="button" onclick="applyProductProfit()">اعمال درصد به قیمت فروش</button></div></div><div class="field" style="grid-column:span 3"><label>توضیحات</label><input id="pnote" class="input" value="${esc(p.note)}"></div></div></div><div class="hint">درصد سود این بخش بر اساس <b>قیمت خرید</b> محاسبه می‌شود؛ مثلاً خرید ۱۰۰٬۰۰۰ و سود ۱۰٪ ⇒ فروش ۱۱۰٬۰۰۰. می‌توانی قیمت فروش را هم دستی تغییر بدهی. «حاشیه سود» جداگانه بر اساس قیمت فروش نمایش داده می‌شود.</div><div class="actions"><button class="btn green" onclick="saveProduct('${id}')">ذخیره کالا</button><button class="btn sec" onclick="closeModal()">انصراف</button></div>`);setTimeout(()=>syncProductProfit('init'),0)}
function syncProductProfit(source='init'){const cost=Number(document.getElementById('pavg')?.value)||Number(document.getElementById('pbu')?.value)||0;const pctEl=document.getElementById('ppct'),sellEl=document.getElementById('psel'),preview=document.getElementById('pselPreview'),marginEl=document.getElementById('pmargin');if(!pctEl||!sellEl)return;if(source==='pct'){const pct=Number(pctEl.value)||0;const sell=cost*(1+pct/100);sellEl.value=Math.round(sell);if(preview)preview.textContent=Math.round(sell)}else if(source==='sell'){const sell=Number(sellEl.value)||0;const pct=cost>0?((sell/cost)-1)*100:0;pctEl.value=sell&&cost?pct.toFixed(2):'';if(preview)preview.textContent=sell}else if(source==='cost'||source==='buy'){const pct=Number(pctEl.value)||0;const sell=cost*(1+pct/100);if(pctEl.value!==''&&sell){sellEl.value=Math.round(sell);if(preview)preview.textContent=Math.round(sell)}}else{const sell=Number(sellEl.value)||0;const pct=cost>0&&sell?((sell/cost)-1)*100:0;if(pctEl.value===''&&sell)pctEl.value=pct.toFixed(2);if(preview)preview.textContent=sell}const sell=Number(sellEl.value)||0;marginEl.value=sell&&cost?(((sell-cost)/sell*100).toFixed(2)+'%'):''}

function saveProduct(id){const name=val('pn').trim();if(!name)return alert('نام کالا را وارد کن');let p=id?product(id):null;const oldStock=p?n(p.stock):0,oldSell=p?n(p.sell):0;let enteredCode=val('pc').trim();if(!p&&!enteredCode)enteredCode=nextProductCode();if(enteredCode&&data.products.some(x=>x.id!==(p?.id||'')&&String(x.code||'').trim()===enteredCode))return alert('این کد کالا قبلاً استفاده شده است');if(!p){p={id:uid()};data.products.push(p)}Object.assign(p,{name,code:enteredCode,barcode:val('pb').trim(),cat:val('pca').trim(),brand:val('pbr').trim(),unit:val('pu'),shelf:val('psh').trim(),minStock:n(val('pmin')),buy:n(val('pbu')),avgBuy:n(val('pavg')||val('pbu')),sell:n(val('psel')),profitPercent:val('ppct')===''?'':n(val('ppct')),stock:n(val('pst')),note:val('pnote').trim(),reorderDays:n(val('preorder')||14)});if(p.sell>0&&p.avgBuy>0&&data.settings.minMargin>0){const m=(p.sell-p.avgBuy)/p.sell*100;if(m<data.settings.minMargin&&!confirm('حاشیه سود این کالا فقط '+Math.round(m)+'٪ است و زیر حد هشدار است. ذخیره شود؟'))return;}if(p.stock!==oldStock)data.moves.push({id:uid(),isoDate:todayISO(),date:faDate(),type:'اصلاح مستقیم',productId:p.id,qty:p.stock-oldStock,before:oldStock,after:p.stock,ref:'ثبت/ویرایش کالا'});if(id&&oldSell!==p.sell){data.priceHistory=(data.priceHistory||[]);data.priceHistory.push({id:uid(),isoDate:todayISO(),date:faDate(),productId:p.id,old:n(oldSell),new:n(p.sell)})}audit(id?'ویرایش کالا':'ثبت کالا',p.name);closeModal();save()}
function stockAdjust(id){const p=product(id);modal('ورود / خروج موجودی — '+esc(p.name),`<div class="miniGrid"><div class="mini">موجودی فعلی<b>${qty(p.stock)}</b></div><div class="mini">حداقل<b>${qty(p.minStock)}</b></div><div class="mini">قیمت خرید<b>${money(p.avgBuy)}</b></div><div class="mini">قیمت فروش<b>${money(p.sell)}</b></div></div><div class="sectionbox" style="margin-top:10px"><div class="formgrid"><div class="field"><label>نوع حرکت</label><select id="at" class="select"><option value="in">ورود</option><option value="out">خروج</option><option value="set">تنظیم موجودی</option></select></div><div class="field"><label>تعداد</label><input id="aq" class="input" type="number" min="0"></div><div class="field" style="grid-column:span 2"><label>شرح</label><input id="an" class="input" placeholder="خرید، ضایعات، مصرف، انتقال..." ></div></div></div><div class="actions"><button class="btn" onclick="applyAdjust('${id}')">ثبت حرکت</button><button class="btn sec" onclick="closeModal()">بستن</button></div>`)}
function applyAdjust(id){const p=product(id),t=val('at'),q=n(val('aq'));if(!q&&t!=='set')return alert('تعداد را وارد کن');const before=n(p.stock);let after=before;if(t==='in')after=before+q;if(t==='out')after=before-q;if(t==='set')after=q;if(after<0)return alert('موجودی نمی‌تواند منفی شود');p.stock=after;data.moves.push({id:uid(),isoDate:todayISO(),date:faDate(),type:t==='in'?'ورود دستی':t==='out'?'خروج دستی':'تنظیم موجودی',productId:id,qty:after-before,before,after,ref:val('an')||'دستی'});closeModal();save()}
function openBulkPrice(){modal('ویرایش گروهی قیمت فروش',`<div class="hint">می‌توانی برای چند کالا یک درصد افزایش روی قیمت فعلی اعمال کنی یا مبلغ ثابت به فروش اضافه/کم کنی.</div><div class="formgrid"><div class="field"><label>دسته</label><select id="bpCat" class="select"><option value="">همه دسته‌ها</option>${[...new Set(data.products.map(p=>p.cat).filter(Boolean))].map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>نوع تغییر</label><select id="bpType" class="select"><option value="pct">درصد</option><option value="amount">مبلغ</option></select></div><div class="field"><label>مقدار</label><input id="bpVal" class="input" type="number" value="10"></div></div><div class="actions" style="margin-top:10px"><button class="btn" onclick="applyBulkPrice()">اعمال تغییر</button><button class="btn sec" onclick="closeModal()">انصراف</button></div>`)}
function applyBulkPrice(){const c=val('bpCat'),t=val('bpType'),v=n(val('bpVal'));let count=0;data.products.forEach(p=>{if(c&&p.cat!==c)return;if(t==='pct')p.sell=Math.max(0,Math.round(p.sell*(1+v/100)));else p.sell=Math.max(0,p.sell+v);count++});closeModal();save();alert(count+' کالا به‌روزرسانی شد')}

function purchasesPage(){const rows=data.purchases.slice().reverse();return `<div class="panel"><div class="toolbar"><div class="left"><b>خریدها و ورود کالا</b></div><div class="right"><button class="btn" onclick="openPurchase()">+ ثبت خرید</button></div></div>${rows.length?`<div class="tablewrap"><table><tr><th>شماره</th><th>تاریخ</th><th>تأمین‌کننده</th><th>مبلغ</th><th>پرداخت</th><th>مانده</th><th>اقلام</th></tr>${rows.map(x=>`<tr><td>${esc(x.no)}</td><td>${esc(x.date)}</td><td>${esc(x.partyName||'متفرقه')}</td><td>${money(x.total)}</td><td>${money(x.paid)}</td><td>${money(x.remaining)}</td><td>${qty(x.items.reduce((a,i)=>a+i.qty,0))}</td></tr>`).join('')}</table></div>`:'<div class="empty">خریدی ثبت نشده است.</div>'}</div>`}
function openPurchase(){let items=[];modal('ثبت خرید و ورود به انبار',`<div class="sectionbox"><div class="formgrid"><div class="field"><label>تأمین‌کننده</label><select id="purParty" class="select"><option value="">بدون انتخاب</option>${data.parties.filter(p=>p.type==='supplier').map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>تخفیف</label><input id="purDisc" class="input" type="number" value="0" oninput="recalcPurchase()"></div><div class="field"><label>پرداختی</label><input id="purPaid" class="input" type="number" value="0" oninput="recalcPurchase()"></div><div class="field"><label>روش پرداخت</label><select id="purPay" class="select"><option>نقدی</option><option>کارتخوان</option><option>کارت‌به‌کارت</option><option>نسیه</option></select></div></div></div><div class="sectionbox"><div class="actions"><select id="purProd" class="select" style="max-width:460px"><option value="">انتخاب کالا...</option>${data.products.map(p=>`<option value="${p.id}">${esc(p.name)} · موجودی ${qty(p.stock)}</option>`).join('')}</select><button class="btn" onclick="addPurchaseLine()">+ افزودن</button></div></div><div id="purLines"></div><div id="purSummary"></div><div class="actions" style="margin-top:10px"><button class="btn green" onclick="savePurchase()">ثبت خرید</button><button class="btn sec" onclick="closeModal()">انصراف</button></div>`);window._purchaseItems=items;renderPurchase()}
function renderPurchase(){const a=window._purchaseItems||[];document.getElementById('purLines').innerHTML=a.length?`<div class="tablewrap"><table><tr><th>کالا</th><th>تعداد</th><th>قیمت خرید واحد</th><th>جمع</th><th></th></tr>${a.map((i,idx)=>`<tr><td>${esc(product(i.productId)?.name||i.name)}</td><td><input class="input" type="number" value="${i.qty}" onchange="window._purchaseItems[${idx}].qty=Math.max(1,n(this.value));renderPurchase()"></td><td><input class="input" type="number" value="${i.price}" onchange="window._purchaseItems[${idx}].price=n(this.value);renderPurchase()"></td><td>${money(i.qty*i.price)}</td><td><button class="btn red" onclick="window._purchaseItems.splice(${idx},1);renderPurchase()">×</button></td></tr>`).join('')}</table></div>`:'<div class="empty">قلمی انتخاب نشده است.</div>';const sub=a.reduce((x,i)=>x+i.qty*i.price,0),disc=n(val('purDisc')),total=Math.max(0,sub-disc);document.getElementById('purSummary').innerHTML=`<div class="summary"><div class="sumBox">جمع خرید<b>${money(sub)}</b></div><div class="sumBox">تخفیف<b>${money(disc)}</b></div><div class="sumBox">قابل پرداخت<b>${money(total)}</b></div><div class="sumBox">اقلام<b>${qty(a.reduce((x,i)=>x+i.qty,0))}</b></div></div>`}
function addPurchaseLine(){const id=val('purProd');if(!id)return;const p=product(id),a=window._purchaseItems||[];const ex=a.find(i=>i.productId===id);if(ex)ex.qty++;else a.push({productId:id,name:p.name,qty:1,price:n(p.avgBuy||p.buy)});window._purchaseItems=a;document.getElementById('purProd').value='';renderPurchase()}
function recalcPurchase(){renderPurchase()}
function savePurchase(){const a=window._purchaseItems||[],sub=a.reduce((x,i)=>x+i.qty*i.price,0),disc=n(val('purDisc')),total=Math.max(0,sub-disc),paid=n(val('purPaid')||total);if(!a.length)return alert('اقلام خرید خالی است');const pa=party(val('purParty'));const no=data.settings.prefix+'K'+String(data.seq.purchase++).padStart(5,'0');const items=a.map(i=>({...i}));items.forEach(i=>{const p=product(i.productId);const before=n(p.stock),oldAvg=n(p.avgBuy||p.buy),oldStock=before,addQty=n(i.qty),newAvg=(oldAvg*oldStock+n(i.price)*addQty)/(oldStock+addQty||1);p.avgBuy=Math.round(newAvg);p.buy=n(i.price);p.stock=oldStock+addQty;data.moves.push({id:uid(),isoDate:todayISO(),date:faDate(),type:'خرید',productId:p.id,qty:addQty,before,after:p.stock,ref:no})});data.purchases.push({id:uid(),no,isoDate:todayISO(),date:faDate(),partyId:pa?.id||'',partyName:pa?.name||'متفرقه',items,subtotal:sub,discount:disc,total,paid:Math.min(total,paid),remaining:Math.max(0,total-paid),paymentType:val('purPay')});if(paid)cashAdd('پرداخت خرید',-paid,val('purPay'),pa?.name||'متفرقه',no);audit('ثبت خرید',no+' · '+(pa?.name||'متفرقه')+' · '+total);closeModal();save()}

function partiesPage(){const rows=data.parties;return `<div class="panel"><div class="toolbar"><b>مشتریان و تأمین‌کنندگان</b><button class="btn" onclick="openParty()">+ طرف حساب</button></div>${rows.length?`<div class="tablewrap"><table><tr><th>نام</th><th>نوع</th><th>تلفن</th><th>مانده</th><th>عملیات</th></tr>${rows.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td><span class="tag ${p.type==='customer'?'b':'o'}">${p.type==='customer'?'مشتری':'تأمین‌کننده'}</span></td><td>${esc(p.phone||'-')}</td><td class="${n(p.balance)>0?'negative':'positive'}">${money(p.balance)}</td><td><button class="btn sec" onclick="openParty('${p.id}')">ویرایش</button> <button class="btn blue" onclick="partyStatement('${p.id}')">گردش حساب</button> <button class="btn green" onclick="receiveParty('${p.id}')">تسویه</button></td></tr>`).join('')}</table></div>`:'<div class="empty">طرف حسابی ثبت نشده است.</div>'}</div>`}
function openParty(id=''){const p=id?party(id):{id:'',name:'',type:'customer',phone:'',balance:0,note:''};modal(id?'ویرایش طرف حساب':'طرف حساب جدید',`<div class="formgrid"><div class="field"><label>نام *</label><input id="pnm" class="input" value="${esc(p.name)}"></div><div class="field"><label>نوع</label><select id="pty" class="select"><option value="customer" ${p.type==='customer'?'selected':''}>مشتری</option><option value="supplier" ${p.type==='supplier'?'selected':''}>تأمین‌کننده</option></select></div><div class="field"><label>تلفن</label><input id="ptel" class="input" value="${esc(p.phone)}"></div><div class="field"><label>مانده اولیه</label><input id="pbal" class="input" type="number" value="${n(p.balance)}"></div></div><div style="margin-top:9px"><label class="muted">یادداشت</label><input id="pnot" class="input" value="${esc(p.note||'')}"></div><div class="actions" style="margin-top:10px"><button class="btn" onclick="saveParty('${id}')">ذخیره</button><button class="btn sec" onclick="closeModal()">انصراف</button></div>`)}
function saveParty(id){const name=val('pnm').trim();if(!name)return alert('نام را وارد کن');let p=id?party(id):null;if(!p){p={id:uid()};data.parties.push(p)}Object.assign(p,{name,type:val('pty'),phone:val('ptel'),balance:n(val('pbal')),note:val('pnot')});audit(id?'ویرایش طرف حساب':'ثبت طرف حساب',p.name);closeModal();save()}
function receiveParty(id){const p=party(id);modal('تسویه حساب — '+esc(p.name),`<div class="miniGrid"><div class="mini">مانده فعلی<b>${money(p.balance)}</b></div></div><div class="formgrid" style="margin-top:10px"><div class="field"><label>مبلغ تسویه</label><input id="recvAmt" class="input" type="number" value="${n(p.balance)}"></div><div class="field"><label>روش</label><select id="recvPay" class="select"><option>نقدی</option><option>کارتخوان</option><option>کارت‌به‌کارت</option></select></div><div class="field" style="grid-column:span 2"><label>شرح</label><input id="recvNote" class="input"></div></div><div class="actions" style="margin-top:10px"><button class="btn green" onclick="applyPartyPayment('${id}')">ثبت تسویه</button><button class="btn sec" onclick="closeModal()">انصراف</button></div>`)}
function applyPartyPayment(id){const p=party(id),a=Math.min(Math.max(0,n(val('recvAmt'))),Math.max(0,n(p.balance)));if(!a)return alert('مبلغ معتبر نیست');p.balance-=a;cashAdd('تسویه مشتری',a,val('recvPay'),p.name,val('recvNote')||p.name);closeModal();save()}
function partyStatement(id){const p=party(id);const ss=data.sales.filter(s=>s.partyId===id);const pp=data.purchases.filter(x=>x.partyId===id);const cs=data.cash.filter(x=>x.partyName===p.name);modal('گردش حساب — '+esc(p.name),`<div class="miniGrid"><div class="mini">مانده فعلی<b>${money(p.balance)}</b></div><div class="mini">فروش نسیه<b>${money(ss.reduce((a,s)=>a+s.remaining,0))}</b></div><div class="mini">خرید نسیه<b>${money(pp.reduce((a,s)=>a+s.remaining,0))}</b></div><div class="mini">عملیات صندوق<b>${qty(cs.length)}</b></div></div><div class="tablewrap" style="margin-top:10px"><table><tr><th>تاریخ</th><th>شرح</th><th>مرجع</th><th>مبلغ</th></tr>${ss.map(s=>`<tr><td>${s.date}</td><td>فاکتور فروش</td><td>${s.no}</td><td>${money(s.total)}</td></tr>`).concat(pp.map(x=>`<tr><td>${x.date}</td><td>فاکتور خرید</td><td>${x.no}</td><td>${money(x.total)}</td></tr>`)).concat(cs.map(x=>`<tr><td>${x.date}</td><td>${esc(x.type)}</td><td>${esc(x.ref||'-')}</td><td>${money(x.amount)}</td></tr>`)).join('')}</table></div>`)}

function cashAdd(type,amount,paymentType='نقدی',partyName='',ref=''){data.cash.push({id:uid(),isoDate:todayISO(),date:faDate(),type,amount:n(amount),paymentType,partyName,ref})}
function cashBalanceNow(){return data.cash.reduce((a,x)=>a+(x.paymentType==='نقدی'?n(x.amount):0),0)}
function bankTurnoverNow(){return data.cash.reduce((a,x)=>a+((x.paymentType==='کارتخوان'||x.paymentType==='کارت‌به‌کارت')?n(x.amount):0),0)}
function cashPage(){const rows=data.cash.slice().reverse();const bal=cashBalanceNow(),today=rows.filter(x=>x.isoDate===todayISO()),day=today.reduce((a,x)=>a+n(x.amount),0);return `<div class="cards"><div class="card metric"><div class="muted">مانده صندوق</div><div class="big">${money(bal)}</div></div><div class="card metric"><div class="muted">حرکت امروز</div><div class="big">${money(day)}</div></div><div class="card metric"><div class="muted">دریافت امروز</div><div class="big">${money(today.filter(x=>n(x.amount)>0).reduce((a,x)=>a+n(x.amount),0))}</div></div><div class="card metric"><div class="muted">پرداخت امروز</div><div class="big">${money(Math.abs(today.filter(x=>n(x.amount)<0).reduce((a,x)=>a+n(x.amount),0)))}</div></div><div class="card metric"><div class="muted">عملیات صندوق</div><div class="big">${qty(rows.length)}</div></div><div class="card metric"><div class="muted">گردش کارت</div><div class="big">${money(Math.abs(today.filter(x=>x.paymentType==='کارتخوان'||x.paymentType==='کارت‌به‌کارت').reduce((a,x)=>a+n(x.amount),0)))}</div></div><div class="card metric"><div class="muted">مدیریت</div><div class="big" style="font-size:14px"><button class="btn dark" onclick="openCashClose()">بستن صندوق</button></div></div></div><div class="section panel"><div class="toolbar"><b>عملیات صندوق</b><button class="btn" onclick="openCashMove()">+ دریافت / پرداخت</button></div><div class="tablewrap"><table><tr><th>تاریخ</th><th>نوع</th><th>طرف حساب</th><th>روش</th><th>مبلغ</th><th>مرجع</th></tr>${rows.slice(0,100).map(x=>`<tr><td>${x.date}</td><td>${esc(x.type)}</td><td>${esc(x.partyName||'-')}</td><td>${esc(x.paymentType||'-')}</td><td class="${n(x.amount)>=0?'positive':'negative'}">${money(x.amount)}</td><td>${esc(x.ref||'-')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">تراکنشی نیست.</td></tr>'}</table></div></div>`}
function openCashMove(){modal('دریافت / پرداخت صندوق',`<div class="formgrid"><div class="field"><label>نوع</label><select id="cmType" class="select"><option value="in">دریافت</option><option value="out">پرداخت</option></select></div><div class="field"><label>مبلغ</label><input id="cmAmt" class="input" type="number"></div><div class="field"><label>روش</label><select id="cmPay" class="select"><option>نقدی</option><option>کارتخوان</option><option>کارت‌به‌کارت</option></select></div><div class="field"><label>طرف حساب / شرح</label><input id="cmParty" class="input"></div></div><div class="actions" style="margin-top:10px"><button class="btn" onclick="applyCashMove()">ثبت</button><button class="btn sec" onclick="closeModal()">انصراف</button></div>`)}
function applyCashMove(){const a=n(val('cmAmt'));if(!a)return alert('مبلغ را وارد کن');cashAdd(val('cmType')==='in'?'دریافت دستی':'پرداخت دستی',val('cmType')==='in'?a:-a,val('cmPay'),val('cmParty'));closeModal();save()}
function openCashClose(){
 const today=data.cash.filter(x=>x.isoDate===todayISO());
 const book=cashBalanceNow();
 const received=today.filter(x=>n(x.amount)>0).reduce((a,x)=>a+n(x.amount),0);
 const paid=today.filter(x=>n(x.amount)<0).reduce((a,x)=>a+n(x.amount),0);
 modal('بستن صندوق امروز',
 '<div class="miniGrid">'
 +'<div class="mini">مانده ثبت‌شده<b>'+money(book)+'</b></div>'
 +'<div class="mini">تعداد تراکنش امروز<b>'+qty(today.length)+'</b></div>'
 +'<div class="mini">دریافت امروز<b>'+money(received)+'</b></div>'
 +'<div class="mini">پرداخت امروز<b>'+money(Math.abs(paid))+'</b></div>'
 +'</div>'
 +'<div class="formgrid" style="margin-top:10px">'
 +'<div class="field"><label>موجودی واقعی صندوق</label><input id="closeReal" class="input" type="number" value="'+book+'" oninput="updateCloseDiff()"></div>'
 +'<div class="field"><label>اختلاف</label><input id="closeDiff" class="input" disabled value="0 تومان"></div>'
 +'<div class="field" style="grid-column:span 2"><label>یادداشت</label><input id="closeNote" class="input"></div>'
 +'</div>'
 +'<div class="actions" style="margin-top:10px"><button class="btn green" onclick="applyCashClose()">ثبت بستن صندوق</button><button class="btn sec" onclick="closeModal()">انصراف</button></div>'
 );
 updateCloseDiff();
}
function applyCashClose(){const real=n(val('closeReal')),book=cashBalanceNow(),diff=real-book;if(diff)cashAdd(diff>0?'اختلاف صندوق مثبت':'اختلاف صندوق منفی',diff,'نقدی','',val('closeNote')||'بستن صندوق');closeModal();save();alert('بستن صندوق ثبت شد')}

function expensesPage(){const rows=data.expenses.slice().reverse(),sum=rows.reduce((a,x)=>a+n(x.amount),0);return `<div class="cards"><div class="card metric"><div class="muted">کل هزینه</div><div class="big">${money(sum)}</div></div><div class="card metric"><div class="muted">تعداد</div><div class="big">${qty(rows.length)}</div></div></div><div class="section panel"><div class="toolbar"><b>هزینه‌ها</b><button class="btn" onclick="openExpense()">+ ثبت هزینه</button></div><div class="tablewrap"><table><tr><th>تاریخ</th><th>عنوان</th><th>مبلغ</th><th>روش</th><th>شرح</th></tr>${rows.map(e=>`<tr><td>${e.date}</td><td>${esc(e.title)}</td><td>${money(e.amount)}</td><td>${esc(e.payment)}</td><td>${esc(e.note||'-')}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">هزینه‌ای ثبت نشده است.</td></tr>'}</table></div></div>`}

function stocktakePage(){const rows=data.stocktakes.slice().reverse();return `<div class="panel"><div class="toolbar"><b>انبارگردانی و اصلاح موجودی</b><button class="btn" onclick="startStocktake()">+ انبارگردانی جدید</button></div><div class="hint" style="margin:10px">موجودی واقعی را شمارش کن؛ نرم‌افزار اختلاف را محاسبه می‌کند و پس از تأیید، موجودی را با سابقه ثبت اصلاح می‌کند.</div><div class="tablewrap"><table><tr><th>تاریخ</th><th>تعداد کالا</th><th>جمع اختلاف</th><th>یادداشت</th></tr>${rows.map(x=>`<tr><td>${x.date}</td><td>${qty(x.count)}</td><td>${qty(x.diff)}</td><td>${esc(x.note||'-')}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">انبارگردانی ثبت نشده است.</td></tr>'}</table></div><div class="toolbar"><b>گردش انبار</b><button class="btn sec" onclick="showMoves()">مشاهده همه حرکات</button></div></div>`}
function startStocktake(){modal('انبارگردانی جدید',`<div class="hint">برای هر کالا موجودی واقعی را وارد کن. اگر تغییری نداشته باشد همان عدد قبلی باقی می‌ماند.</div><div class="tablewrap"><table><tr><th>کالا</th><th>سیستم</th><th>واقعی</th><th>اختلاف</th></tr>${data.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${qty(p.stock)}</td><td><input id="st_${p.id}" class="input" type="number" value="${n(p.stock)}" oninput="this.parentElement.nextElementSibling.textContent=(Number(this.value)||0)-${n(p.stock)}"></td><td>0</td></tr>`).join('')}</table></div><div class="formgrid" style="margin-top:10px"><div class="field" style="grid-column:span 3"><label>یادداشت</label><input id="stNote" class="input"></div></div><div class="actions" style="margin-top:10px"><button class="btn green" onclick="saveStocktake()">ثبت و اصلاح انبار</button><button class="btn sec" onclick="closeModal()">انصراف</button></div>`)}
function saveStocktake(){let diff=0,count=0;data.products.forEach(p=>{const el=document.getElementById('st_'+p.id);if(!el)return;const real=Math.max(0,n(el.value)),before=n(p.stock),d=real-before;if(d){data.moves.push({id:uid(),isoDate:todayISO(),date:faDate(),type:'انبارگردانی',productId:p.id,qty:d,before,after:real,ref:'انبارگردانی'});p.stock=real;diff+=Math.abs(d)}count++});data.stocktakes.push({id:uid(),isoDate:todayISO(),date:faDate(),count,diff,note:val('stNote')});closeModal();save()}
function showMoves(){modal('گردش انبار',`<div class="tablewrap"><table><tr><th>تاریخ</th><th>کالا</th><th>نوع</th><th>تعداد</th><th>قبل</th><th>بعد</th><th>مرجع</th></tr>${data.moves.slice().reverse().map(m=>`<tr><td>${m.date}</td><td>${esc(product(m.productId)?.name||'-')}</td><td>${esc(m.type)}</td><td>${qty(m.qty)}</td><td>${qty(m.before)}</td><td>${qty(m.after)}</td><td>${esc(m.ref||'-')}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">حرکتی ثبت نشده است.</td></tr>'}</table></div>`)}

function reportsPage(){const s=activeSales();return `<div class="panel"><div class="tabs"><button class="tab active">گزارش فروش و سود</button><button class="tab" onclick="openProfitByProduct()">سود هر کالا</button><button class="tab" onclick="openDailyReport()">فروش روزانه</button></div><div class="pad"><div class="formgrid"><div class="field"><label>از تاریخ میلادی</label><input id="rf" class="input" placeholder="2026-09-01" value=""></div><div class="field"><label>تا تاریخ میلادی</label><input id="rt" class="input" placeholder="2026-09-30" value=""></div><div class="field"><label>دسته</label><select id="rc" class="select"><option value="">همه</option>${[...new Set(data.products.map(p=>p.cat).filter(Boolean))].map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="field" style="display:flex;align-items:end"><button class="btn" onclick="applyReport()">اعمال گزارش</button></div></div><div id="reportArea" style="margin-top:11px">${reportCards(s)}</div></div></div>`}

function reportCards(ss){const turn=ss.reduce((a,s)=>a+n(s.total),0),profit=ss.reduce((a,s)=>a+n(s.profit),0),exp=data.expenses.filter(e=>(!val('rf')||e.isoDate>=val('rf'))&&(!val('rt')||e.isoDate<=val('rt'))).reduce((a,e)=>a+n(e.amount),0),net=profit-exp,qtySold=ss.reduce((a,s)=>a+s.items.reduce((b,i)=>b+n(i.qty),0),0),margin=turn?Math.round(profit/turn*100):0;const top=topProducts(ss,12);return `<div class="cards"><div class="card metric"><div class="muted">فروش</div><div class="big">${money(turn)}</div></div><div class="card metric"><div class="muted">سود ناخالص</div><div class="big">${money(profit)}</div></div><div class="card metric"><div class="muted">حاشیه سود</div><div class="big">${margin}%</div></div><div class="card metric"><div class="muted">هزینه</div><div class="big">${money(exp)}</div></div><div class="card metric"><div class="muted">سود پس از هزینه</div><div class="big">${money(net)}</div></div><div class="card metric"><div class="muted">اقلام فروخته‌شده</div><div class="big">${qty(qtySold)}</div></div></div><div class="section grid2"><div class="panel"><div class="toolbar"><b>پرفروش‌ترین کالاها</b></div><div class="pad">${top.map(x=>`<div style="padding:8px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between"><span>${esc(x.name)}</span><b>${qty(x.qty)}</b></div>`).join('')||'<div class="empty">داده‌ای نیست.</div>'}</div></div><div class="panel"><div class="toolbar"><b>ارزش انبار</b></div><div class="pad"><div class="miniGrid"><div class="mini">ارزش خرید<b>${money(stockBuyValue())}</b></div><div class="mini">ارزش فروش<b>${money(stockSellValue())}</b></div><div class="mini">سود بالقوه<b>${money(stockSellValue()-stockBuyValue())}</b></div><div class="mini">مطالبات<b>${money(data.parties.filter(p=>p.type==='customer').reduce((a,p)=>a+n(p.balance),0))}</b></div></div></div></div></div>`}
function applyReport(){document.getElementById('reportArea').innerHTML=reportCards(filteredReportSales())}
function openProfitByProduct(){const ss=filteredReportSales(),m={};ss.forEach(s=>s.items.forEach(i=>{const p=product(i.productId);if(!p)return;(m[p.id]??={name:p.name,sales:0,profit:0,qty:0}).sales+=i.lineTotal;(m[p.id]).profit+=n(i.lineTotal)-n(i.qty)*n(i.buy);(m[p.id]).qty+=n(i.qty)}));const rows=Object.values(m).sort((a,b)=>b.profit-a.profit);modal('سود به تفکیک کالا',`<div class="tablewrap"><table><tr><th>کالا</th><th>تعداد</th><th>فروش</th><th>سود</th></tr>${rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${qty(x.qty)}</td><td>${money(x.sales)}</td><td>${money(x.profit)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">داده‌ای نیست.</td></tr>'}</table></div>`)}

let autoBackupTimer=null;
let autoBackupBusy=false;
function backupSettings(){const s=data.settings||{};return {enabled:s.autoBackup!==false,interval:Math.max(1,n(s.autoBackupInterval)||6),retention:Math.min(20,Math.max(3,n(s.autoBackupRetention)||8))}}
function lastAutoBackup(){try{return JSON.parse(localStorage.getItem('abrang_last_auto_backup')||'null')}catch(e){return null}}
function scheduleAutoBackup(){try{clearTimeout(autoBackupTimer);const cfg=backupSettings();if(!cfg.enabled)return;const wait=cfg.interval*60*60*1000;autoBackupTimer=setTimeout(()=>performAutoBackup('scheduled'),Math.min(wait,10*60*1000))}catch(e){}}
function performAutoBackup(reason='scheduled'){try{if(autoBackupBusy)return;const cfg=backupSettings();if(!cfg.enabled)return;const now=Date.now(),prev=lastAutoBackup(),intMs=cfg.interval*60*60*1000;if(reason!=='closing'&&prev?.at&&now-prev.at<intMs){scheduleAutoBackup();return}autoBackupBusy=true;const arr=getLocalSnapshots();const payload=backupPayload('auto');payload.autoReason=reason;payload.autoAt=new Date(now).toISOString();payload.data=clone(data);payload.date=faDate()+' '+new Intl.DateTimeFormat('fa-IR',{hour:'2-digit',minute:'2-digit'}).format(new Date());payload.size=JSON.stringify(payload.data).length;arr.unshift(payload);const uniq=[],seen=new Set();for(const x of arr){const sig=JSON.stringify(x.data);if(seen.has(sig))continue;seen.add(sig);uniq.push(x);if(uniq.length>=cfg.retention)break}try{localStorage.setItem(BACKUP_KEY,JSON.stringify(uniq))}catch(e){try{localStorage.setItem(BACKUP_KEY,JSON.stringify(uniq.slice(0,Math.max(3,Math.floor(cfg.retention/2)))))}catch(e2){}}localStorage.setItem('abrang_last_auto_backup',JSON.stringify({at:now,iso:new Date(now).toISOString(),reason,count:uniq.length}));autoBackupBusy=false;scheduleAutoBackup();if(page==='backup')render()}catch(e){autoBackupBusy=false}}
function autoBackupStatus(){const cfg=backupSettings(),x=lastAutoBackup();if(!cfg.enabled)return {text:'خاموش',cls:'r'};if(!x)return {text:'هنوز اجرا نشده',cls:'o'};return {text:new Intl.DateTimeFormat('fa-IR',{dateStyle:'short',timeStyle:'short'}).format(new Date(x.at)),cls:'g'}}
function saveBackupSettings(){data.settings.autoBackup=document.getElementById('abEnabled')?.checked!==false;data.settings.autoBackupInterval=Math.max(1,n(val('abInterval'))||6);data.settings.autoBackupRetention=Math.min(20,Math.max(3,n(val('abRetention'))||8));save();alert('تنظیمات پشتیبان خودکار ذخیره شد')}
function autoBackupNow(){performAutoBackup('manual-auto');alert('پشتیبان خودکار داخلی ذخیره شد');if(page==='backup')render()}

function backupCompatibilityReport(){const keys=['abrang_accounting_v12','abrang_accounting_v11','abrang_accounting_v10','abrang_accounting_v9','abrang_accounting_v8','abrang_accounting_v7','abrang_accounting_v6'];const found=[];for(const k of keys){try{const raw=localStorage.getItem(k);if(raw){const d=normalize(JSON.parse(raw));found.push({key:k,version:k.replace('abrang_accounting_',''),products:d.products.length,sales:d.sales.length,purchases:d.purchases.length})}}catch(e){}}return found}

function backupPage(){const snaps=getLocalSnapshots(),cfg=backupSettings(),st=autoBackupStatus(),last=lastAutoBackup(),sz=prettyBytes(JSON.stringify(data).length);return `<div class="panel"><div class="toolbar"><b>پشتیبان، امنیت و تنظیمات</b><div class="actions"><button class="btn" onclick="downloadBackup()">پشتیبان کامل</button><button class="btn sec" onclick="quickBackup()">پشتیبان سریع</button><label class="btn sec" for="restore">بازیابی</label><input id="restore" class="hide" type="file" accept="application/json,.json" onchange="restoreData(event)"></div></div><div class="pad"><div class="sectionbox"><h3>پشتیبان‌گیری خودکار</h3><div class="notice"><b>پشتیبان خودکار فعال باشد، نسخه‌های داخلی اطلاعات را بدون نیاز به دخالت دستی ذخیره می‌کند.</b><br>مرورگر اجازه دانلود خودکار فایل روی دیسک بدون اجازه کاربر را نمی‌دهد؛ بنابراین پشتیبان خودکار داخل خود برنامه نگهداری می‌شود و هر زمان لازم بود می‌توانی فایل مستقل دانلود کنی.</div><div class="miniGrid"><div class="mini">وضعیت<b><span class="tag ${st.cls}">${st.text}</span></b></div><div class="mini">فاصله<b>${qty(cfg.interval)} ساعت</b></div><div class="mini">نگهداری<b>${qty(cfg.retention)} نسخه</b></div><div class="mini">آخرین اجرا<b>${last?esc(new Intl.DateTimeFormat('fa-IR',{dateStyle:'short',timeStyle:'short'}).format(new Date(last.at))):'—'}</b></div></div><div class="formgrid" style="margin-top:12px"><div class="field"><label><input id="abEnabled" type="checkbox" ${cfg.enabled?'checked':''}> فعال‌سازی پشتیبان خودکار</label></div><div class="field"><label>فاصله</label><select id="abInterval" class="select"><option value="1" ${cfg.interval===1?'selected':''}>هر ۱ ساعت</option><option value="3" ${cfg.interval===3?'selected':''}>هر ۳ ساعت</option><option value="6" ${cfg.interval===6?'selected':''}>هر ۶ ساعت</option><option value="12" ${cfg.interval===12?'selected':''}>هر ۱۲ ساعت</option><option value="24" ${cfg.interval===24?'selected':''}>هر ۲۴ ساعت</option></select></div><div class="field"><label>تعداد نسخه داخلی</label><input id="abRetention" class="input" type="number" min="3" max="20" value="${cfg.retention}"></div></div><div class="actions" style="margin-top:10px"><button class="btn green" onclick="saveBackupSettings()">ذخیره تنظیمات پشتیبان</button><button class="btn sec" onclick="autoBackupNow()">پشتیبان خودکار همین حالا</button></div></div><div class="sectionbox"><h3>وضعیت اطلاعات</h3><div class="miniGrid"><div class="mini">حجم داده<b>${sz}</b></div><div class="mini">کالا<b>${qty(data.products.length)}</b></div><div class="mini">فاکتور فروش<b>${qty(data.sales.length)}</b></div><div class="mini">خرید<b>${qty(data.purchases.length)}</b></div><div class="mini">طرف حساب<b>${qty(data.parties.length)}</b></div><div class="mini">نسخه داخلی<b>${qty(snaps.length)}</b></div></div></div><div class="sectionbox"><h3>پشتیبان‌های داخلی اخیر</h3>${snaps.length?`<div class="tablewrap"><table><tr><th>تاریخ</th><th>نوع</th><th>نسخه</th><th>کالا</th><th>فاکتور</th><th>اندازه</th><th>عملیات</th></tr>${snaps.map((x,i)=>`<tr><td>${esc(x.date||x.exportedAt||'')}</td><td><span class="tag ${x.source==='auto'?'g':'b'}">${x.source==='auto'?'خودکار':'دستی'}</span></td><td>${esc(x.appVersion||'')}</td><td>${qty((x.data?.products||[]).length)}</td><td>${qty((x.data?.sales||[]).length)}</td><td>${prettyBytes(x.size||JSON.stringify(x.data||{}).length)}</td><td><button class="btn sm" onclick="restoreLocalSnapshot(${i})">بازیابی</button></td></tr>`).join('')}</table></div>`:'<div class="empty">هنوز پشتیبان داخلی ذخیره نشده است.</div>'}<div class="actions" style="margin-top:10px"><button class="btn red" onclick="clearLocalSnapshots()">پاک کردن پشتیبان‌های داخلی</button><button class="btn sec" onclick="downloadProductsBackup()">خروجی فقط کالاها</button></div></div><div class="sectionbox"><h3>اطلاعات فروشگاه</h3><div class="formgrid"><div class="field"><label>نام</label><input id="sn" class="input" value="${esc(data.settings.shopName)}"></div><div class="field"><label>تلفن</label><input id="sp" class="input" value="${esc(data.settings.phone)}"></div><div class="field" style="grid-column:span 2"><label>آدرس</label><input id="sa" class="input" value="${esc(data.settings.address)}"></div><div class="field"><label>پیشوند فاکتور</label><input id="spr" class="input" value="${esc(data.settings.prefix)}"></div><div class="field"><label>درصد مالیات</label><input id="stax" class="input" type="number" value="${n(data.settings.tax)}"></div><div class="field"><label>حداقل حاشیه سود هشدار</label><input id="sminm" class="input" type="number" value="${n(data.settings.minMargin)}" placeholder="مثلاً 20"></div></div><div class="actions" style="margin-top:10px"><button class="btn" onclick="saveSettings()">ذخیره تنظیمات</button><button class="btn red" onclick="resetAll()">حذف کامل اطلاعات</button></div></div><div class="sectionbox"><h3>فرمت پشتیبان و سازگاری نسخه‌ها</h3><div class="muted">${BACKUP_FORMAT} · نسخه برنامه ${APP_VERSION}. نسخه‌های بعدی باید این فرمت را پشتیبانی کنند تا کالاها و سوابق بدون ورود مجدد منتقل شوند.</div></div></div></div>`}

function saveSettings(){data.settings.shopName=val('sn');data.settings.phone=val('sp');data.settings.address=val('sa');data.settings.prefix=val('spr')||'A';data.settings.tax=n(val('stax'));data.settings.minMargin=n(val('sminm'));save();createLocalSnapshot();alert('تنظیمات و پشتیبان داخلی ذخیره شد')}
function backupPayload(source='manual'){return {format:BACKUP_FORMAT,app:'حسابداری فروشگاهی آبرنگ',appVersion:APP_VERSION,exportedAt:new Date().toISOString(),source,sourceKey:KEY,data:clone(data)}}
function downloadJSON(obj,filename){const b=new Blob([JSON.stringify(obj,null,2)],{type:'application/json;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1200)}
function stampName(prefix='abrang-backup'){return prefix+'-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json'}
function downloadBackup(){downloadJSON(backupPayload('manual'),stampName('abrang-full-backup-v53'));createLocalSnapshot()}
function quickBackup(){downloadJSON(backupPayload('quick'),stampName('abrang-backup-v53'));createLocalSnapshot()}
function downloadProductsBackup(){const obj={format:'ABRANG_PRODUCTS_V1',appVersion:APP_VERSION,exportedAt:new Date().toISOString(),products:clone(data.products)};downloadJSON(obj,stampName('abrang-products-v53'))}
function validateImportedPayload(raw){if(!raw||typeof raw!=='object')throw new Error('ساختار نامعتبر');let payload=raw;if(raw.data&&typeof raw.data==='object')payload=raw.data;if(!Array.isArray(payload.products)||!Array.isArray(payload.sales)||!Array.isArray(payload.purchases))throw new Error('این فایل پشتیبان آبرنگ نیست یا ناقص است');return normalize(clone(payload))}
function restoreData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const raw=JSON.parse(r.result);const incoming=validateImportedPayload(raw);const current=clone(data);downloadJSON({format:BACKUP_FORMAT,app:'حسابداری فروشگاهی آبرنگ',appVersion:APP_VERSION,exportedAt:new Date().toISOString(),source:'pre-restore',sourceKey:KEY,data:current},stampName('abrang-before-restore'));if(!confirm('اطلاعات فعلی با فایل پشتیبان جایگزین شود؟ قبل از جایگزینی یک پشتیبان خودکار از اطلاعات فعلی دانلود شد.'))return;data=incoming;save(true);createLocalSnapshot();render();alert('پشتیبان با موفقیت بازیابی شد');}catch(err){console.error(err);alert('فایل پشتیبان معتبر یا کامل نیست. هیچ اطلاعاتی تغییر نکرد.')}};r.readAsText(f);e.target.value=''}
function getLocalSnapshots(){try{return JSON.parse(localStorage.getItem(BACKUP_KEY)||'[]')}catch(e){return []}}
function createLocalSnapshot(){try{const arr=getLocalSnapshots();const payload=backupPayload('local');payload.data=clone(data);payload.date=faDate()+' '+new Intl.DateTimeFormat('fa-IR',{hour:'2-digit',minute:'2-digit'}).format(new Date());payload.size=JSON.stringify(payload.data).length;arr.unshift(payload);const limit=backupSettings().retention;const uniq=[];const seen=new Set();for(const x of arr){const sig=JSON.stringify(x.data);if(seen.has(sig))continue;seen.add(sig);uniq.push(x);if(uniq.length>=limit)break}localStorage.setItem(BACKUP_KEY,JSON.stringify(uniq));}catch(e){}}
function restoreLocalSnapshot(index){const arr=getLocalSnapshots();const item=arr[index];if(!item)return;if(!confirm('این نسخه داخلی بازیابی شود؟ اطلاعات فعلی قبل از جایگزینی پشتیبان می‌شود.'))return;downloadJSON(backupPayload('pre-local-restore'),stampName('abrang-before-local-restore'));try{data=validateImportedPayload(item.data);save(true);render();alert('نسخه داخلی با موفقیت بازیابی شد')}catch(e){alert('پشتیبان داخلی معتبر نیست')}}
function clearLocalSnapshots(){if(confirm('پشتیبان‌های داخلی حذف شوند؟ فایل‌های دانلودشده حذف نمی‌شوند.')){localStorage.removeItem(BACKUP_KEY);go('backup')}}
function prettyBytes(bytes){const b=n(bytes);if(b<1024)return b+' B';if(b<1024*1024)return (b/1024).toFixed(1)+' KB';return (b/1024/1024).toFixed(1)+' MB'}
function resetAll(){if(confirm('همه اطلاعات حذف شود؟ این کار قابل برگشت نیست.')){downloadJSON(backupPayload('pre-reset'),stampName('abrang-before-reset'));localStorage.removeItem(KEY);data=clone(defaults);createLocalSnapshot();render();alert('اطلاعات حذف شد و یک پشتیبان قبل از حذف دانلود شد')}}

function exportProducts(){const rows=[['کد','بارکد','نام','دسته','برند','قیمت خرید','قیمت فروش','موجودی','حداقل','قفسه']].concat(data.products.map(p=>[p.code,p.barcode,p.name,p.cat,p.brand,p.avgBuy,p.sell,p.stock,p.minStock,p.shelf]));const csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n');const b=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='abrang-products-v58.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

function audit(action,detail=''){data.auditLogs=(data.auditLogs||[]);data.auditLogs.push({id:uid(),isoDate:todayISO(),date:faDate(),time:new Intl.DateTimeFormat('fa-IR',{hour:'2-digit',minute:'2-digit'}).format(new Date()),action,detail});if(data.auditLogs.length>1000)data.auditLogs=data.auditLogs.slice(-1000)}
function salesStats(productId,days=30){const from=new Date();from.setHours(0,0,0,0);from.setDate(from.getDate()-days);const fromIso=from.toISOString().slice(0,10);let q=0,revenue=0,last='';for(const s of activeSales()){if(s.isoDate<fromIso)continue;for(const i of s.items||[]){if(i.productId===productId){q+=n(i.qty);revenue+=n(i.lineTotal);if(!last||s.isoDate>last)last=s.isoDate}}}return {q,revenue,last,avg:q/days}}
function purchaseRecommendation(p){const days=Math.max(1,n(p.reorderDays||14));const st=salesStats(p.id,Math.max(30,days*2));const daily=st.avg;const target=Math.max(n(p.minStock||0),Math.ceil(daily*days));const rec=Math.max(0,target-n(p.stock));const cover=daily>0?n(p.stock)/daily:999;let level='مناسب',cls='g';if(n(p.stock)<=0){level='ناموجود';cls='r'}else if(n(p.stock)<=n(p.minStock)||cover<days/2){level='نیازمند خرید';cls='o'}return {daily,target,rec,cover,level,cls,unitsPeriod:st.q,last:st.last,days}}
function smartBuyRows(){return data.products.map(p=>({p,r:purchaseRecommendation(p)})).filter(x=>x.r.rec>0).sort((a,b)=>(b.r.rec*n(b.p.avgBuy))-(a.r.rec*n(a.p.avgBuy)))}
function smartBuyPage(){const rows=smartBuyRows(),need=rows.reduce((a,x)=>a+x.r.rec*n(x.p.avgBuy),0),out=data.products.filter(p=>n(p.stock)<=0).length,low=data.products.filter(p=>n(p.stock)>0&&n(p.stock)<=n(p.minStock)).length;return `<div class="cards"><div class="card metric"><div class="muted">پیشنهاد خرید</div><div class="big">${qty(rows.length)} کالا</div></div><div class="card metric"><div class="muted">ارزش خرید پیشنهادی</div><div class="big">${money(need)}</div></div><div class="card metric"><div class="muted">ناموجود</div><div class="big">${qty(out)}</div></div><div class="card metric"><div class="muted">کم‌موجودی</div><div class="big">${qty(low)}</div></div></div><div class="section panel"><div class="toolbar"><div class="left"><b>موتور خرید هوشمند</b><span class="badgeInfo">سرعت فروش + موجودی + حداقل موجودی + روزهای پوشش</span></div><div class="right"><button class="btn" onclick="openBulkPurchase()">ساخت لیست خرید</button><button class="btn sec" onclick="openABC()">ABC کالاها</button></div></div><div class="pad"><div class="hint">«روزهای پوشش هدف» را در کارت هر کالا تعیین کن. موتور خرید بر اساس فروش گذشته، مقدار لازم برای رسیدن به موجودی هدف را پیشنهاد می‌دهد.</div><div class="tablewrap" style="margin-top:10px"><table><tr><th>کالا</th><th>موجودی</th><th>فروش دوره</th><th>روز پوشش فعلی</th><th>هدف</th><th>پیشنهاد خرید</th><th>ارزش خرید</th><th>وضعیت</th></tr>${rows.map(x=>`<tr><td><b>${esc(x.p.name)}</b><div class="muted">${esc(x.p.cat||'')}</div></td><td>${qty(x.p.stock)}</td><td>${qty(x.r.unitsPeriod)}</td><td>${x.r.cover>=900?'—':x.r.cover.toFixed(1)+' روز'}</td><td>${qty(x.r.target)}</td><td><b>${qty(x.r.rec)}</b></td><td>${money(x.r.rec*x.p.avgBuy)}</td><td><span class="tag ${x.r.cls}">${x.r.level}</span></td></tr>`).join('')||'<tr><td colspan="8" class="empty">فعلاً خرید پیشنهادی نداریم.</td></tr>'}</table></div></div></div>`}
