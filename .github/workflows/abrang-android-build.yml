name: Build Abrang Android APK
on:
  pull_request:
    branches: [master]
  push:
    branches: [abrang-android-65-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: 'platform-tools platforms;android-35 build-tools;35.0.0'}
      - uses: gradle/actions/setup-gradle@v6
        with: {gradle-version: '8.11.1', cache-provider: basic}
      - name: Build APK
        working-directory: AbrangAndroid65Real
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK
        working-directory: AbrangAndroid65Real
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          test $(stat -c%s "$APK") -gt 200000
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
          unzip -t "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Abrang-65.8-installable-debug
          path: AbrangAndroid65Real/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
